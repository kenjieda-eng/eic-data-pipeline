name: Nightly Fetch

on:
  schedule:
    # JST 8:00 = UTC 23:00（前日）
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill: 取得可能な全年を取りに行く（通常は直近 2 年のみ）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # backfill 時は JMA が 9 地点 × 180 ヶ月 = 1,620 リクエストで 40 分強かかるため 90 分確保
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch JEPX spot prices
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching all available years"
            python scripts/fetch_jepx.py --all
          else
            echo "normal mode: fetching last 2 years"
            python scripts/fetch_jepx.py
          fi
        continue-on-error: true

      - name: Fetch JMA daily temperature
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching all months from 2012-01"
            python scripts/fetch_jma.py --all
          else
            echo "normal mode: fetching last 2 months"
            python scripts/fetch_jma.py
          fi
        continue-on-error: true

      - name: Fetch World Bank fuel prices (monthly)
        # 月次データだが、前月値の確定がズレるため毎日叩いて差分更新する。
        # XLSX を 1 回 DL して 7 系列を一括処理するため所要時間は短い（1 分未満）。
        run: |
          python scripts/fetch_fuel.py
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          