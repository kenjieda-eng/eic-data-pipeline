name: Nightly Fetch

on:
  schedule:
    # JST 8:00 = UTC 23:00（前日）
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch JEPX spot prices
        run: python scripts/fetch_jepx.py
        continue-on-error: true

      # 今後ソースが増えたらここに step を追加する
      # - name: Fetch JMA
      #   run: python scripts/fetch_jma.py
      #   continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name "eic-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            git commit -m "nightly: data update ${today}"
            git push
          fi
