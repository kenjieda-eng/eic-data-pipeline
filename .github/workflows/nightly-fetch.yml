name: Nightly Fetch

on:
  schedule:
    # JST 8:00 = UTC 23:00（前日）
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill: 取得可能な全年を取りに行く（通常は直近 2 年のみ）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # backfill 時は JMA が 9 地点 × 180 ヶ月 = 1,620 リクエストで 40 分強かかるため 90 分確保
    timeout-minutes: 90

    steps:
      - name: Checkout
        # 2026-04-24: Node.js 24 対応（期限 2026-06-02）で v4 → v5 へ
        uses: actions/checkout@v5

      - name: Setup Python
        # 2026-04-24: Node.js 24 対応で v5 → v6 へ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch JEPX spot prices
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching all available years"
            python scripts/fetch_jepx.py --all
          else
            echo "normal mode: fetching last 2 years"
            python scripts/fetch_jepx.py
          fi
        continue-on-error: true

      - name: Fetch JMA daily temperature
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching all months from 2012-01"
            python scripts/fetch_jma.py --all
          else
            echo "normal mode: fetching last 2 months"
            python scripts/fetch_jma.py
          fi
        continue-on-error: true

      - name: Fetch World Bank fuel prices (monthly)
        # 月次データだが、前月値の確定がズレるため毎日叩いて差分更新する。
        # XLSX を 1 回 DL して 7 系列を一括処理するため所要時間は短い（1 分未満）。
        run: |
          python scripts/fetch_fuel.py
        continue-on-error: true

      - name: Fetch BOJ FX rates (monthly)
        # BOJ FM08 の USD/JPY 4 系列（月中平均/月末/月内高値/月内安値）を 1 リクエストで取得。
        # 月次データ、翌月初に確定。毎日叩いてもほぼゼロ負荷（375KB 前後 × 1 req）。
        run: |
          python scripts/fetch_fx.py
        continue-on-error: true

      - name: Fetch MOF JGB yields (daily)
        # 財務省の国債金利情報 CSV（jgbcm_all.csv、Shift-JIS、和暦、全期間 1974-09 〜）を 1 発で取得。
        # Phase 1 は 10 年新発のみ extract（source_map.yaml の term_to_id に定義）。
        # 平日 17 時台に当日分が追記されるため、毎朝実行で 1 営業日遅れを追従。
        run: |
          python scripts/fetch_jgb.py
        continue-on-error: true

      - name: Fetch METI 電力調査統計 (Phase 2-A, monthly, fiscal-year XLSX)
        # 資源エネルギー庁 電力調査統計（ep002）の年度単位 XLSX から 12 系列を抽出。
        # 発電 8 + 需要 3 + 派生 1（meti-renewables-share）。約 2 ヶ月遅延で公表される。
        # バックフィル時は FY2016〜最新年度の 10 年度分（= 20 XLSX ≒ 60 MB）を走査。
        # 通常モードは最新年度の XLSX 更新のみを確認（数 MB）。
        # Phase 2-A Day 4 でメインループ有効化。現在は --dry-run 相当の空振り実装で CI 無害。
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching FY2016 onwards"
            python scripts/fetch_enecho_power.py --backfill
          else
            echo "normal mode: fetching latest fiscal year only"
            python scripts/fetch_enecho_power.py
          fi
        continue-on-error: true

      - name: Generate indicators catalog (D-011)
        # data/processed/**/*.metadata.json を集約して data/catalog/indicators.json を生成。
        # Required 10 欠落は exit 1（CI fail）、Recommended 欠落/鮮度超過は warning 止まり。
        # モック（mockups/index-v2.html）はこの 1 本を起動時に fetch する。
        run: |
          python scripts/generate_catalog.py

      - name: Commit & push if changed
        run: |
          git config user.name "eic-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            git commit -m "nightly: data update ${today}"
            git push
          fi
