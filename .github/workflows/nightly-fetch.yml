name: Nightly Fetch

on:
  schedule:
    # JST 8:00 = UTC 23:00（前日）
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill: 取得可能な全年を取りに行く（通常は直近 2 年のみ）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # backfill 時は JMA が 9 地点 × 180 ヶ月 = 1,620 リクエストで 40 分強かかるため 90 分確保
    timeout-minutes: 90

    steps:
      - name: Checkout
        # 2026-04-24: Node.js 24 対応（期限 2026-06-02）で v4 → v5 へ
        uses: actions/checkout@v5

      - name: Setup Python
        # 2026-04-24: Node.js 24 対応で v5 → v6 へ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch JEPX spot prices
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching all available years"
            python scripts/fetch_jepx.py --all
          else
            echo "normal mode: fetching last 2 years"
            python scripts/fetch_jepx.py
          fi
        continue-on-error: true

      - name: Fetch JMA daily temperature
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching all months from 2012-01"
            python scripts/fetch_jma.py --all
          else
            echo "normal mode: fetching last 2 months"
            python scripts/fetch_jma.py
          fi
        continue-on-error: true

      - name: Fetch World Bank fuel prices (monthly)
        # 月次データだが、前月値の確定がズレるため毎日叩いて差分更新する。
        # XLSX を 1 回 DL して 7 系列を一括処理するため所要時間は短い（1 分未満）。
        run: |
          python scripts/fetch_fuel.py
        continue-on-error: true

      - name: Fetch BOJ FX rates (monthly)
        # BOJ FM08 の USD/JPY 4 系列（月中平均/月末/月内高値/月内安値）を 1 リクエストで取得。
        # 月次データ、翌月初に確定。毎日叩いてもほぼゼロ負荷（375KB 前後 × 1 req）。
        run: |
          python scripts/fetch_fx.py
        continue-on-error: true

      - name: Fetch BOJ Tankan DI (quarterly, 4 series)
        # BOJ db=CO の業況判断 DI 4 系列（大企業/中小企業 × 製造業/非製造業、実績）。
        # 四半期データ、各 Q の翌月（4/7/10/12 月）初に確定。毎日叩いてもほぼゼロ負荷（120KB × 1 req）。
        run: |
          python scripts/fetch_boj_tankan.py
        continue-on-error: true

      - name: Fetch MOF JGB yields (daily)
        # 財務省の国債金利情報 CSV（jgbcm_all.csv、Shift-JIS、和暦、全期間 1974-09 〜）を 1 発で取得。
        # Phase 1 は 10 年新発のみ extract（source_map.yaml の term_to_id に定義）。
        # 平日 17 時台に当日分が追記されるため、毎朝実行で 1 営業日遅れを追従。
        run: |
          python scripts/fetch_jgb.py
        continue-on-error: true

      - name: Fetch US Treasury daily yields (CMT, 4 series)
        # 米国財務省の年別 CSV API（type=daily_treasury_yield_curve）から CMT 利回り 4 系列を取得。
        # 通常モードは当年のみ、--backfill で 1990-当年まで全期間（4 系列 × 約 9,000 行）。
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching from 1990 onwards"
            python scripts/fetch_us_treasury.py --backfill
          else
            echo "normal mode: fetching current year only"
            python scripts/fetch_us_treasury.py
          fi
        continue-on-error: true

      - name: Fetch US macro from FRED (Phase 3-B Round 2, 3 series)
        # FRED API（無料・120 req/min）で米マクロ 3 系列を取得:
        #   us-cpi-yoy（CPIAUCSL の 12 ヶ月前比 %）/ us-fed-funds-rate（FEDFUNDS）/ us-industrial-production（INDPRO）
        # 月次データ、毎日叩いて差分更新（FRED 側で過去値の改定が入るため）。
        # API キー未設定時は CSV 直 DL エンドポイントに自動フォールバック（fetch_us_macro.py 内）。
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/fetch_us_macro.py
        continue-on-error: true

      - name: Fetch METI 電力調査統計 (Phase 2-A, monthly, fiscal-year XLSX)
        # 資源エネルギー庁 電力調査統計（ep002）の年度単位 XLSX から 12 系列を抽出。
        # 発電 8 + 需要 3 + 派生 1（meti-renewables-share）。約 2 ヶ月遅延で公表される。
        # バックフィル時は FY2016〜最新年度の 10 年度分（= 20 XLSX ≒ 60 MB）を走査。
        # 通常モードは最新年度の XLSX 更新のみを確認（数 MB）。
        # Phase 2-A Day 4 でメインループ有効化。現在は --dry-run 相当の空振り実装で CI 無害。
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching FY2016 onwards"
            python scripts/fetch_enecho_power.py --backfill
          else
            echo "normal mode: fetching latest fiscal year only"
            python scripts/fetch_enecho_power.py
          fi
        continue-on-error: true

      - name: Fetch ECB rates & FX (Phase 2 international, 5 series)
        # ECB SDMX API で政策金利 3 (DFR/MRR/MLF) + 為替 2 (EUR/USD, EUR/JPY) を取得。
        # 政策金利は日次変化点を月末値で月次化。月次データ、毎日叩いても 5 リクエストで終わる。
        # backfill 引数で 1999-01 から、通常モードは直近 3 年分。
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching from 1999-01"
            python scripts/fetch_ecb.py --backfill
          else
            echo "normal mode: fetching last 3 years"
            python scripts/fetch_ecb.py
          fi
        continue-on-error: true

      - name: Fetch Ember monthly electricity (Phase 2 international, 50 series)
        # Ember の long-format CSV (約 70 MB) を 1 リクエストで取得し、
        # 主要 5 ヶ国 (日/米/中/独/英) × 10 指標を抽出:
        #   demand / generation / CO2 intensity (3) + 電源種別 share% × 7 fuel
        #   (coal/gas/nuclear/solar/wind/hydro/bioenergy) = 計 50 系列。
        # 電源構成 share は #67 CO2 強度の「なぜ＝電源構成」を示す主要国電源構成比較 Insight の素材。
        # CSV は常に全期間 (1999-01〜) を返すため通常/backfill の差は無い。
        run: |
          python scripts/fetch_ember.py
        continue-on-error: true

      - name: Fetch e-Stat Japan (economy CPI/IIP 2 + population 都道府県別 141 series)
        # 政府統計の総合窓口 e-Stat API（appId 必須、無料登録）で日本の公的統計を取得:
        #   [economy] jpn-cpi-yoy（2020 年基準 CPI 総合 全国 前年同月比、1971-01〜）
        #             jpn-industrial-production（2020 年基準 鉱工業生産指数 業種別原指数 月次、2018-01〜）
        #   [population] 人口推計 都道府県別 3 指標 × 47 都道府県 = 141 系列（年次、各年10月1日現在、千人）
        #             total / working(15-64) / 65over。統計表 0004021110(2016-2020)+0003448225(2021-2024)。
        # fetch_estat.py が estat（economy）と estat-population（population）の両セクションを 1 回で処理。
        # 認証必須。secrets.ESTAT_APP_ID 未設定時は WARN ログを吐いて exit 1 するが、
        # continue-on-error で他系列を止めない（既存系列はキャッシュから再取得不要）。
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          python scripts/fetch_estat.py
        continue-on-error: true

      - name: Fetch e-Stat trade (geopolitics エネルギー輸入 源国別 23 series)
        # 財務省 普通貿易統計「品別国別表（輸入）」を e-Stat API で取得し geopolitics ドメインを seed:
        #   原油 / LNG / 石炭 の輸入相手国別 年間金額（千円、年次）。中東依存度・源国集中の素材。
        #   jp-import-value-{crude|lng|coal}-{cc}（相手国別、region=ISO2）+ -total（全相手国合算、region=WORLD）。
        # 統計表 0003313966(2016-2020)+0003425294(2021-2025確々報) を結合。各燃料の HS は見出し prefix
        #   （原油=2709/LNG=271111/石炭=2701）で getMetaInfo から実行時導出（HS 改正耐性、L-062）。
        # 認証必須（fetch_estat.py と同一 secrets.ESTAT_APP_ID）。continue-on-error で他系列を止めない。
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          python scripts/fetch_estat_trade.py
        continue-on-error: true

      - name: Fetch NBS Manufacturing PMI (Phase 2 international, 1 series)
        # 中国 国家統計局 英語版 PressRelease から月次 Manufacturing PMI を抽出。
        # 認証不要。index ページの "Purchasing Managers' Index" アンカーから最新リリースを動的に解決。
        # 各リリースに直近 13 ヶ月のテーブルが同梱 → write_processed が key_cols dedup で安全に append。
        # Caixin PMI は S&P Global proprietary のため不採用 (L-063, 2026-05-27)。
        run: |
          python scripts/fetch_nbs_pmi.py
        continue-on-error: true

      - name: Fetch EU ETS verified emissions (annual, ESG)
        # EU 排出量取引制度（EUTL / European Environment Agency）の検証排出量を取得し ESG ドメインを seed。
        # datahub.io ミラー（安定 r-link、ODC-PDDL-1.0）から CSV 2 本を 1 リクエストずつ取得:
        #   Family A: eu-ets-sector-emissions.csv → EU 全体 部門別 8 系列（aggregation=raw, region=EU-ETS）
        #   Family B: eu-ets.csv（約 8MB）→ 加盟国別 合計検証排出量 31 系列（aggregation=annual_sum, region=ISO2）
        # Family B は citl_information=="2.1 EU-ETS Verified Emission" / 4 桁年 / main_activity_code 非 -99（rollup 除外）
        #   / country_code=ISO2(非 XI) でフィルタし国×年で合計 → ÷1e6 で Mt 化。
        # CSV は常に全期間（2005-2025、航空のみ 2012-）を返すため backfill フラグ不要。認証不要。
        run: |
          python scripts/fetch_eu_ets.py
        continue-on-error: true

      - name: Fetch NREL ATB tech-cost (annual, tech domain, 31 series)
        # NREL Annual Technology Baseline（ATB）電力版を OEDI Data Lake（S3 公開、CC BY 4.0）から
        # HTTPS 直 URL で取得し、技術（tech）ドメインを seed:
        #   10 技術 × {LCOE($/MWh), CAPEX($/kW), CF(%)} + 蓄電池 4hr CAPEX = 31 系列。
        # ⚠️ 編集方針（リク監修）: 未来予測値は非収載。各年版の base year（当年）コスト推計のみ採用
        #   （2021-2024 版、横軸=年版公表年）。techdetail は ATB default フラグで代表区分を選定。
        # 年 1 回の年版更新のため通常は no-op（各版 CSV は不変、サイズ一致で再利用）。aws cli 不要。
        run: |
          python scripts/fetch_nrel_atb.py
        continue-on-error: true

      - name: Fetch FIT 調達価格 (annual, regulation domain, 5 series)
        # 資源エネルギー庁「なっとく！再生可能エネルギー」FIT 買取価格ページ（HTML 表）から
        # 電源別×年度の調達価格（円/kWh）を取得し、regulation ドメイン（12 ドメイン最後）を seed:
        #   太陽光(事業用)/陸上風力/地熱/一般木質バイオマス/中小水力 の 5 系列、2012-2026 年度。
        # METI は Akamai Bot Manager 保護のため curl_cffi/chrome120 で TLS fingerprint を模倣（enecho-power 流用）。
        # 年度で列構成が激変するため <table> を colspan/rowspan 展開し、列見出しキーワードで代表区分を抽出。
        # 年 1 回（年度末告示）の更新のため通常は no-op（write_processed が key_cols dedup で安全に append）。認証不要。
        run: |
          python scripts/fetch_fit_price.py
        continue-on-error: true

      - name: Fetch JEPX 非化石証書 約定価格・約定量 (quarterly, regulation domain, 6 series)
        # JEPX 非化石価値取引市場のオークション結果から 3 類型 ×（約定価格, 約定総量）を取得:
        #   FIT / 非FIT(再エネ指定) / 非FIT(再エネ指定なし) の 6 系列、FY2017-最新年度。
        # 取得範囲は年度レンジ API (get_graph_year.php?dir=nf_summary) の応答から決める。
        # 年度をハードコードしないので、年度ローテーションを公式レスポンスで検知できる
        # （＝ Pink Sheet 型サイレント停滞の予防）。認証不要。
        # 年 4 回オークション（8月/11月/2月/5月）のため通常は no-op
        # （write_processed の key_cols dedup で安全に再実行できる）。
        # 書き出し前に価格の想定枠（source_map.yaml の sanity_min/max）を検査し、
        # 列取り違え型のパースバグではゴミを着地させずに落とす。
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "backfill mode: fetching all fiscal years from the year-range API"
            python scripts/fetch_nonfossil.py --all
          else
            echo "normal mode: fetching last 2 fiscal years"
            python scripts/fetch_nonfossil.py
          fi
        # 年 4 回更新のため通常 no-op。JEPX 一時障害で他ソースの commit まで巻き込まないよう他 fetch と同様に true。停滞検知は commit 後の Staleness hard check が担う（L-064）。
        continue-on-error: true

      - name: Fetch GIO 日本の温室効果ガス排出量 (annual, esg domain, 18 series)
        # 国立環境研究所 温室効果ガスインベントリオフィス (GIO) のインベントリから 18 系列:
        #   部門別 CO2 9（電気・熱配分後）/ ガス別 GHG 7 / 吸収量・ネット 2、1990-最新年度。
        # ★ xlsx の直 URL はハードコードせず、毎回 index ページをパースして最新版を解決する。
        #   規約の「データファイルへの直接リンクはご遠慮ください」に沿うため、かつ
        #   URL 中の att ディレクトリ ID が公表年ごとにローテートするため
        #   （決め打ちすると Pink Sheet 型サイレント停滞になる）。
        # ★ 規約の「公開日の異なる版を組み合わせての使用は避けてください」条項と、
        #   毎年の再計算で過去年も遡及改定される実態から、追記ではなく**全置換**で書き出す。
        #   全置換は取得漏れが既存データの欠損に直結するので、fetch_gio.py は 18 系列が揃い
        #   元ファイル内部の恒等式（部門合計・ガス内訳・シート跨ぎ）が全て通ったときにのみ書く。
        # 年 1 回（4 月中旬〜下旬）公表のため通常は no-op（同一版なら CSV は md5 一致）。
        run: |
          python scripts/fetch_gio.py
        # GIO 側の一時障害で他ソースの commit まで巻き込まないよう他 fetch と同様に true。
        # 停滞検知は commit 後の Staleness hard check が担う（L-064）。SLA 800 → 2×=1600 日。
        continue-on-error: true

      - name: Fetch EIA international CO2 (annual, international domain, 21 series)
        # 米国エネルギー情報局 (EIA) International Energy Statistics API v2 から
        # 国際 CO2 排出量 9 系列: 地域別合計 6 (WORL/JPN/CHN/USA/EU27/OECD) + 日本の燃料別内訳 3。
        # + 派生 12 系列 (2026-08-20 追加): 一人当たり CO2 6 (t-CO2/人) と
        #   GDP 当たり CO2 6 (t-CO2/百万2015年PPPドル)。同じスクリプト内で完結するため
        #   ステップの追加は不要（実行コマンドは python scripts/fetch_eia_intl.py のまま）。
        #   分母の人口 (activityId 33/productId 4702/THP) と実質 GDP (34/4701/BDOLPPP) は
        #   取得するが **系列化しない**（生の人口は e-Stat 人口推計と競合するため）。
        # international ドメインの「経済全体・国際横断・共通方法論の CO2」を埋める
        # (既存 jp-ghg-* は日本のみ・年度・UNFCCC、ember-co2-intensity-* は電力部門のみで重複なし)。
        # ★ facet 一覧エンドポイント (/v2/international/facet/{id}) は使わない。
        #   2026-08-14 実測で一覧は石油系サブセットしか返さず、activityId=8(Emissions) も
        #   unit=MMTCD も列挙されない。一覧を信じると CO2 の存在自体に気づけないため、
        #   facet 値は source_map.yaml のハードコードを明示指定する。
        # ★ countryRegionId には WP17(name="Japan", type=r) 等 JPN と同値の重複コードが存在する。
        #   ピン留めせず集計すると二重計上になるので、要求値と完全一致しない行は検証ゲートで弾く。
        # ★ activityId 33/34 には productId 47 (Energy intensity) が同居する。activityId だけで
        #   絞るとエネルギー原単位を人口・GDP として取り込むため productId/unit も明示指定する。
        # ★ 検証ゲート — 1 本でも破れたら CSV を 1 行も書かずに exit 1。
        #   CO2 側: a(facet 一致) / b(加算整合 |jp-(coal+oil+gas)|<=0.05) / c(行数下限・正値)
        #   派生側: a(productId 完全一致) / b(countryRegionId 完全一致) / c(unit・行数) /
        #           d(年の突合: CO2 に無い period=2025 は出力しない) / e(レンジ) /
        #           f(基準年カナリア: GDP が 2015 年基準のままか。unit BDOLPPP は基準年を
        #             含まないため、EIA のサイレントなリベースはこれでしか検知できない)
        # 認証必須。secrets.EIA_API_KEY 未設定時は WARN ログを吐いて exit 1 するが、
        # continue-on-error で他系列を止めない（fetch_estat.py と同一規約）。
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python scripts/fetch_eia_intl.py
        # 年 1 回更新のため通常 no-op。EIA 側の一時障害で他ソースの commit まで巻き込まないよう
        # 他 fetch と同様に true。停滞検知は commit 後の Staleness hard check が担う（L-064）。
        # SLA 1300 → 2× ハードゲート = 2600 日。★ annual 既定の 540 ではない:
        # EIA は年 Y の値を ~Y+2 年央に公表し、観測日を暦年 1/1 に置くため初出時点で
        # age≈950 日になる。540 だと初日から warning かつ 2026-12-16 に CI が赤になる
        # （観測日規約と SLA はセットで動かすこと）。
        continue-on-error: true

      - name: Generate indicators catalog (D-011)
        # data/processed/**/*.metadata.json を集約して data/catalog/indicators.json を生成。
        # Required 10 欠落は exit 1（CI fail）、Recommended 欠落/鮮度超過は warning 止まり。
        # モック（mockups/index-v2.html）はこの 1 本を起動時に fetch する。
        run: |
          python scripts/generate_catalog.py

      - name: Generate today morning summary (data/today)
        # 朝刊サマリー JSON（/today 復活 A 案・pipeline 側）。catalog を入力に
        # data/today/{latest.json, archive/{date}.json, index.json} を生成。
        # web 側は latest.json を起動時に fetch する。lines 0 件のみ exit 1（他は継続）。
        run: python scripts/generate_today_summary.py

      - name: Commit & push if changed
        run: |
          git config user.name "eic-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            git commit -m "nightly: data update ${today}"
            git push
          fi

      - name: Staleness hard check
        # サイレント停滞（silent stall）の再発防止ハードチェック。
        # data/catalog/indicators.json の各系列について age（今日−observation_cutoff）が
        # freshness_sla_days の 2 倍を超え、かつ KNOWN_STALE allowlist に無い系列が
        # 1 件でもあれば exit 1（ラン失敗）。
        #
        # ★ commit & push の「後」に continue-on-error 無しで置くのが肝:
        #   - データ commit は既に完了しているので、停滞を検知してランを赤くしてもデータは着地済み。
        #   - generate_catalog の soft warning（1×SLA）は緑のまま流れて見落とされる（＝今回の
        #     Pink Sheet URL 未更新による燃料 8 系列 7 ヶ月停止の温床）。
        #   - ここで 2×SLA 超えの停滞はランを赤くして人間に気付かせる（loud failure）。
        # 構造的に更新が来ない系列（Brexit 後の EU ETS 英国、降雪の稀な地点の最深積雪 等）は
        # check_staleness.py の KNOWN_STALE allowlist で除外している。
        run: |
          python scripts/check_staleness.py
