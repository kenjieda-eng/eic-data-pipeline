  estat-trade:
    name: 政府統計の総合窓口（e-Stat）API 普通貿易統計 品別国別表（輸入）
    publisher: 財務省
    publisher_url: https://www.customs.go.jp/toukei/info/index.htm
    source_url: https://www.e-stat.go.jp/
    api_base: "https://api.e-stat.go.jp/rest/3.0/app/json"
    # --- D-011 メタデータ共通項目 ---
    license: estat-terms
    license_url: https://www.e-stat.go.jp/terms-of-use
    license_notice: "出典: 財務省 貿易統計（政府統計の総合窓口 e-Stat）。"
    license_text: |
      財務省 貿易統計（普通貿易統計）。政府統計＝政府標準利用規約 2.0 互換、
      出典明示を条件に商用含む再利用可。e-Stat API 経由で取得。
      参考: https://www.e-stat.go.jp/terms-of-use
    domain: geopolitics
    frequency: annual
    unit: "千円"
    tz: Asia/Tokyo
    missing_policy: "null"
    aggregation: annual_sum
    backfill_start: "2016-01-01"
    # 年次確定は対象年の翌年11月頃、確々報はそれ以前に公表。値は YYYY-01-01 に格納するため
    # 鮮度は publication lag を見込み約25ヶ月（直近2年が欠落した場合のみ警告）に設定。
    freshness_sla_days: 760
    # cat02=140（合計_金額、単位=千円）= 年間合計金額を抽出。
    value_cat02_code: "140"
    # 「確定/確速 品別国別表（輸入）」年次統計表。各表の HS コードは prefix で実行時解決（L-062、HS 改正耐性）。
    # 2026-06-11 実 API（getStatsList searchWord「貿易統計 品別国別 輸入」）で特定・検証。
    tables:
      - stats_data_id: "0003313966"   # 確定 品別国別表(輸入) 2016年～2020年
      - stats_data_id: "0003425294"   # 確速 品別国別表(輸入) 2021-2024確定 + 2025確々報
    # 燃料 → HS 見出し prefix。2026-06-11 getMetaInfo で実コードを確認:
    #   原油 2709 = 270900100/270900900、LNG 271111 = 271111000、
    #   石炭 2701 = 270111000(無煙炭)/270112*(瀝青炭)/270119*(その他)/270120000(練炭等)。
    fuels:
      crude: { hs_prefixes: ["2709"],   name_ja: "原油" }
      lng:   { hs_prefixes: ["271111"], name_ja: "LNG（液化天然ガス）" }
      coal:  { hs_prefixes: ["2701"],   name_ja: "石炭" }
    # 相手国 area コード（getMetaInfo 検証 2026-06-11）→ region 用 ISO2 大文字。
    country_codes:
      "50137": SA   # サウジアラビア
      "50147": AE   # アラブ首長国連邦
      "50138": KW   # クウェート
      "50140": QA   # カタール
      "50141": OM   # オマーン
      "50304": US   # アメリカ合衆国
      "50601": AU   # オーストラリア
      "50113": MY   # マレーシア
      "50224": RU   # ロシア
      "50118": ID   # インドネシア
      "50602": PG   # パプアニューギニア
      "50116": BN   # ブルネイ
      "50302": CA   # カナダ
      "50551": ZA   # 南アフリカ共和国
    # 燃料別 対象相手国（area コード）。2025年確々報の輸入額シェア上位の主要源国を採用。
    # total 系列は全相手国合算（region=WORLD）で、源国集中・中東依存度の分母に使う。
    fuel_countries:
      crude: ["50147", "50137", "50138", "50140", "50141", "50304"]
      lng:   ["50601", "50113", "50224", "50304", "50118", "50140", "50602", "50116"]
      coal:  ["50601", "50118", "50304", "50302", "50551", "50224"]
    notes: |
      日本のエネルギー輸入 源国別 金額（原油/LNG/石炭、年次、単位=千円）。geopolitics seed。
      普通貿易統計「確定/確速 品別国別表（輸入）」を 0003313966(2016-2020)+0003425294(2021-2025)で結合。
      各燃料の輸入額は HS 見出し配下の全 9 桁コードを合算（原油=2709、LNG=271111、石炭=2701）。
      系列は jp-import-value-{crude|lng|coal}-{cc}（相手国別、region=ISO2）+ -total（全相手国合算、region=WORLD）。
      L-062: HS コード・国コードは getStatsList/getMetaInfo で実確認（推測禁止、2026-06-11）。
      L-063: 財務省 貿易統計＝政府標準利用規約、出典明記で商用含む再利用可（GO）。
      検証(2026-06-11): 2025年 原油 計≈9.62兆円(UAE43%/サウジ40%)、LNG 計≈5.70兆円(豪40%)、石炭 計≈3.34兆円(豪67%)。
      2025年は確々報（後日確定値に改定され得る）。確定値は翌年11月頃に再公表。
    indicator_ids:
      - jp-import-value-crude-ae
      - jp-import-value-crude-sa
      - jp-import-value-crude-kw
      - jp-import-value-crude-qa
      - jp-import-value-crude-om
      - jp-import-value-crude-us
      - jp-import-value-crude-total
      - jp-import-value-lng-au
      - jp-import-value-lng-my
      - jp-import-value-lng-ru
      - jp-import-value-lng-us
      - jp-import-value-lng-id
      - jp-import-value-lng-qa
      - jp-import-value-lng-pg
      - jp-import-value-lng-bn
      - jp-import-value-lng-total
      - jp-import-value-coal-au
      - jp-import-value-coal-id
      - jp-import-value-coal-us
      - jp-import-value-coal-ca
      - jp-import-value-coal-za
      - jp-import-value-coal-ru
      - jp-import-value-coal-total

  fit:
    name: 資源エネルギー庁「なっとく！再生可能エネルギー」FIT 買取価格
    publisher: 資源エネルギー庁（METI）
    publisher_url: https://www.enecho.meti.go.jp/
    # 過去（2012-2025 年度）と現行（2026 年度以降）の 2 ページから HTML 表を抽出。
    # source_url は過去ページ（2012-2025 の大半の出典）。2026 は fit_kakaku.html。
    source_url: https://www.enecho.meti.go.jp/category/saving_and_new/saiene/kaitori/kakaku.html
    past_url: https://www.enecho.meti.go.jp/category/saving_and_new/saiene/kaitori/kakaku.html
    current_url: https://www.enecho.meti.go.jp/category/saving_and_new/saiene/kaitori/fit_kakaku.html
    # --- D-011 メタデータ共通項目 ---
    license: meti-terms                            # 政府標準利用規約 2.0 互換（enecho-power と同じ）
    license_url: https://www.meti.go.jp/main/rules.html
    license_notice: "出典: 資源エネルギー庁「なっとく！再生可能エネルギー」FIT・FIP制度 買取価格。政府標準利用規約 2.0 に従い、出典明示を条件に利用可。"
    license_text: |
      経済産業省（METI）資源エネルギー庁 公表資料。政府標準利用規約 2.0（CC BY 4.0 互換）。
      出典明示を条件に商用含む再利用可。L-063 = GO。
      参考: https://www.meti.go.jp/main/rules.html
    domain: regulation
    frequency: annual
    unit: "円/kWh"
    tz: Asia/Tokyo
    missing_policy: "null"
    aggregation: raw
    backfill_start: "2012-04-01"
    # 翌年度の価格は調達価格等算定委員会を経て年度末に告示。年次更新のため SLA は約 18 ヶ月。
    freshness_sla_days: 540
    # ----- 抽出方式（fetch_fit_price.py） --------------------------------
    # ページは UTF-8 の HTML 表。h3「YYYY年度の価格表」(平成/令和は西暦換算) で年度ブロックを区切り、
    # 各電源の <table> を colspan/rowspan 展開した grid 上で「列見出しキーワード + 除外 + pick」により
    # 代表区分の調達価格（円/kWh）を抽出する（L-062: 価格はハードコードせず live HTML から取得）。
    # 列構成が年度で激変するため、年により異なる規模区分（例: 太陽光 10kW以上 / 10kW以上50kW未満）を
    # キーワード優先順で吸収する。2026 の地熱・中小水力 等の「出力に応じて連続的に変化」区分や
    # 入札区分（クリーンな単価なし）は取得対象外（無理に値を作らない）。
    notes: |
      日本の再エネ FIT 制度 電源別 調達価格（円/kWh、年度別、date=YYYY-04-01）。regulation seed（12 ドメイン最後）。
      過去ページ kakaku.html（2012-2025）+ 現行ページ fit_kakaku.html（2026）。
      系列は fit-price-{solar-business|wind-onshore|geothermal|biomass-wood|hydro-small}。
      代表区分: 事業用太陽光 10kW以上(非入札) / 陸上風力(非入札・非リプレース) / 地熱 15,000kW未満新設 /
      一般木質バイオマス(入札対象外) / 中小水力 200kW未満新設。原則税抜（事業用調達価格）。
      地熱 2026 は 1,000-15,000kW が連続価格化したため未取得（14 年分）。他 4 系列は 2012-2026（15 年分）。
      検証(2026-06-12): 事業用太陽光 40円(2012)→10円(2025)→9.9円(2026)、陸上風力 22→13→14、地熱 40 固定、
      一般木質バイオマス 24 固定、中小水力 34 固定。FIT 履歴と整合（大幅削減は太陽光/風力のみ）。
      L-063: 政府標準利用規約、出典明記で商用含む再利用可（GO、license=meti-terms）。
    indicator_ids:
      - fit-price-solar-business
