# source_map.yaml
# 指標 ID → 一次ソース URL の対応表（機械可読）
#
# 各エントリは fetch_*.py スクリプトから読まれる。
# license フィールドは DATA_LICENSE.md の「一次ソース優先」原則の根拠資料。

version: 1

sources:
  jepx-spot:
    name: JEPX スポット価格（日次サマリ）
    publisher: 一般社団法人 日本卸電力取引所 (JEPX)
    publisher_url: https://www.jepx.jp/
    market_page: https://www.jepx.jp/electricpower/market-data/spot/
    # ダウンロードは POST フォーム方式。
    # セッション Cookie + Referer + X-Requested-With が必要と推定。
    post_url: https://www.jepx.jp/_download.php
    post_dir: spot_summary
    # ファイル名リストが定義されている JS
    js_url: https://www.jepx.jp/js/spot_summary.js
    filename_template: 'spot_summary_{year}.csv'
    license: |
      JEPX 公開データ。再配布・引用は出典明示を条件に可。
      参考: https://www.jepx.jp/electricpower/index.html
    frequency: daily
    columns:
      # 元 CSV の列構造（参考）
      - 受渡日
      - 時間コード (1-48)
      - 売り入札量(kWh)
      - 買い入札量(kWh)
      - 約定総量(kWh)
      - システムプライス(円/kWh)
      - エリアプライス_北海道
      - エリアプライス_東北
      - エリアプライス_東京
      - エリアプライス_中部
      - エリアプライス_北陸
      - エリアプライス_関西
      - エリアプライス_中国
      - エリアプライス_四国
      - エリアプライス_九州
    indicator_ids:
      # このソースから派生する indicator_id 一覧
      - jepx-spot-system        # システムプライス（日次平均、円/kWh）
      - jepx-spot-tokyo         # 東京エリア日次平均
      - jepx-spot-kansai        # 関西エリア日次平均
      - jepx-spot-kyushu        # 九州エリア日次平均
    notes: |
      - 1 日 = 48 コマ（30 分単位）。日次平均は 48 コマの単純平均で算出。

  jma-temp:
    name: 気象庁 日次気温（9 エリア代表観測点）
    publisher: 気象庁
    publisher_url: https://www.data.jma.go.jp/
    # 静的 HTML 月次ページ（候補 B）。
    # 気象官署（daily_s1.php）系統のみ使用。アメダス専用点（daily_a1.php）は今回対象外。
    page_url_template: "https://www.data.jma.go.jp/obd/stats/etrn/view/daily_s1.php?prec_no={prec_no}&block_no={block_no}&year={year}&month={month}&day=&view="
    encoding: shift_jis
    table_class: data2_s
    # テーブル内の列位置（0-indexed）。気象官署 日ごとの値 の標準レイアウトを想定。
    # ヘッダ行が 2 段 merged なので、データ行の td インデックスで指定する。
    columns:
      day: 0
      temp_avg: 6
      temp_max: 7
      temp_min: 8
    stations:
      hokkaido: { name: 札幌, prec_no: 14, block_no: 47412 }
      tohoku:   { name: 仙台, prec_no: 34, block_no: 47590 }
      tokyo:    { name: 東京, prec_no: 44, block_no: 47662 }
      chubu:    { name: 名古屋, prec_no: 51, block_no: 47636 }
      hokuriku: { name: 金沢, prec_no: 56, block_no: 47605 }
      kansai:   { name: 大阪, prec_no: 62, block_no: 47772 }
      chugoku:  { name: 広島, prec_no: 67, block_no: 47765 }
      shikoku:  { name: 高松, prec_no: 72, block_no: 47891 }
      kyushu:   { name: 福岡, prec_no: 82, block_no: 47807 }
    items:
      - { key: temp_avg, id_prefix: jma-temp-avg, ja: 日平均気温, unit: ℃ }
      - { key: temp_max, id_prefix: jma-temp-max, ja: 日最高気温, unit: ℃ }
      - { key: temp_min, id_prefix: jma-temp-min, ja: 日最低気温, unit: ℃ }
    license: |
      気象庁ホームページのコンテンツの利用について（https://www.jma.go.jp/jma/kishou/info/coment.html）
      出典明示を条件に自由利用可。再配布時は出典と編集加工の有無を明示する。
    frequency: daily
    indicator_ids:
      # 9 エリア × 3 項目 = 27 系列
      - jma-temp-avg-hokkaido
      - jma-temp-avg-tohoku
      - jma-temp-avg-tokyo
      - jma-temp-avg-chubu
      - jma-temp-avg-hokuriku
      - jma-temp-avg-kansai
      - jma-temp-avg-chugoku
      - jma-temp-avg-shikoku
      - jma-temp-avg-kyushu
      - jma-temp-max-hokkaido
      - jma-temp-max-tohoku
      - jma-temp-max-tokyo
      - jma-temp-max-chubu
      - jma-temp-max-hokuriku
      - jma-temp-max-kansai
      - jma-temp-max-chugoku
      - jma-temp-max-shikoku
      - jma-temp-max-kyushu
      - jma-temp-min-hokkaido
      - jma-temp-min-tohoku
      - jma-temp-min-tokyo
      - jma-temp-min-chubu
      - jma-temp-min-hokuriku
      - jma-temp-min-kansai
      - jma-temp-min-chugoku
      - jma-temp-min-shikoku
      - jma-temp-min-kyushu
    notes: |
      - 月単位の HTML ページから日次テーブルを抽出する方式。
      - 欠測記号 `///`, `--`, `)`, `×`, 空文字を NaN として扱う。
      - `--all` 指定時は 2012-01 から現在まで。通常は直近 2 ヶ月分のみ取り直し（差分更新）。
      - 観測点コード（prec_no, block_no）は公式の「地点の情報」ページで確認済みのものを採用。初回ラン時にページ到達失敗が出たら修正する。
      - 当該年の CSV は年内更新型（追記される）ため、当該年と前年の 2 ファイルを取得すれば最新まで揃う。

  wb-pink-sheet:
    name: World Bank Commodity Prices (Pink Sheet) — 月次
    publisher: The World Bank Group
    publisher_url: https://www.worldbank.org/en/research/commodity-markets
    # 単一の安定 XLSX URL（"CMO-Historical-Data-Monthly"）。
    # World Bank は数年単位でこの URL を引っ越す履歴があるため fallback_urls を併記しておく。
    xlsx_url: "https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025/related/CMO-Historical-Data-Monthly.xlsx"
    fallback_urls:
      - "https://pubdocs.worldbank.org/en/561011486076393416/CMO-Historical-Data-Monthly.xlsx"
      - "https://thedocs.worldbank.org/en/doc/561011486076393416-0050022017/CMO-Historical-Data-Monthly"
    sheet_name: "Monthly Prices"
    license: |
      World Bank Open Data: Creative Commons Attribution 4.0 International (CC BY 4.0)
      出典明示を条件に自由利用可（再配布・商用可）。
      参考: https://www.worldbank.org/en/about/legal/terms-of-use-for-datasets
    frequency: monthly
    # 各系列は wide 形式の Excel 列を部分一致で引くためのキーワード定義。
    # match: すべて含む AND 条件、exclude: いずれかに含まれたら除外。
    series:
      - id: fuel-lng-jp-cif
        name: 日本向け LNG 輸入価格（CIF）
        match: [Japan, LNG]
        exclude: []
        region: jp
        unit: USD_per_mmbtu
      - id: fuel-ng-henryhub
        name: 天然ガス（米国, Henry Hub）
        match: [Natural gas, U.S.]
        exclude: [index]
        region: us
        unit: USD_per_mmbtu
      - id: fuel-ng-europe-ttf
        name: 天然ガス（欧州, TTF）
        match: [Natural gas, Europe]
        exclude: [index]
        region: eu
        unit: USD_per_mmbtu
      - id: fuel-crude-brent
        name: 原油（Brent）
        match: [Crude oil, Brent]
        exclude: []
        region: eu
        unit: USD_per_bbl
      - id: fuel-crude-dubai
        name: 原油（Dubai）
        match: [Crude oil, Dubai]
        exclude: []
        region: me
        unit: USD_per_bbl
      - id: fuel-crude-wti
        name: 原油（WTI）
        match: [Crude oil, WTI]
        exclude: []
        region: us
        unit: USD_per_bbl
      - id: fuel-coal-au
        name: 石炭（豪州）
        match: [Coal, Australian]
        exclude: []
        region: au
        unit: USD_per_mt
    indicator_ids:
      - fuel-lng-jp-cif
      - fuel-ng-henryhub
      - fuel-ng-europe-ttf
      - fuel-crude-brent
      - fuel-crude-dubai
      - fuel-crude-wti
      - fuel-coal-au
    notes: |
      - 月次データ、日付は「月初日（YYYY-MM-01）」で正規化。
      - 1960-01 から現在まで。翌月上旬に前月値が確定（遅延約 1 ヶ月）。
      - 列ヘッダは年度で表記が揺れるため、部分一致（match / exclude）で列を探す設計。
        もし初回ランで series が見つからなければ、Excel を開いて実際の列名を確認し match を微調整する。
      - シート名が "Monthly Prices" でないバージョンに当たった場合は sheet_name を更新する。
      - 価格単位の混在: $/mmbtu（天然ガス）, $/bbl（原油）, $/mt（石炭）。indicator ごとに unit を持つ。
