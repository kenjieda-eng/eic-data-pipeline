        backfill_start: "1974-06-01"
        aggregation: raw
        notes: "BOJ getDataCode db=CO / TK99F1000601GCQ01000。良い-悪い の差分（%pt）。Q1=Mar/Q2=Jun/Q3=Sep/Q4=Dec 実施分を月初日に正規化"
        depends_on: null
      tankan-large-nonmfg-di:
        name: "日銀短観 業況判断 DI 大企業・非製造業"
        domain: macro
        unit: "DI"
        backfill_start: "1983-06-01"
        aggregation: raw
        notes: "BOJ getDataCode db=CO / TK99F2000601GCQ01000。良い-悪い の差分（%pt）"
        depends_on: null
      tankan-sme-mfg-di:
        name: "日銀短観 業況判断 DI 中小企業・製造業"
        domain: macro
        unit: "DI"
        backfill_start: "1967-09-01"
        aggregation: raw
        notes: "BOJ getDataCode db=CO / TK99F1000601GCQ03000。良い-悪い の差分（%pt）"
        depends_on: null
      tankan-sme-nonmfg-di:
        name: "日銀短観 業況判断 DI 中小企業・非製造業"
        domain: macro
        unit: "DI"
        backfill_start: "1983-06-01"
        aggregation: raw
        notes: "BOJ getDataCode db=CO / TK99F2000601GCQ03000。良い-悪い の差分（%pt）"
        depends_on: null
    notes: |
      - 四半期データ、日付は survey-month convention で月初日に正規化（Q1=YYYY-03-01, Q2=YYYY-06-01, Q3=YYYY-09-01, Q4=YYYY-12-01）。
      - 系列開始は indicator により異なる（大企業製造業 1974Q2、中小企業製造業 1967Q3、非製造業 2 系列 1983Q2）。発表は年 4 回（4 月初/7 月初/10 月初/12 月中旬）。
      - 全 4 系列を 1 リクエストで取得（カンマ区切り）。
      - CSV レスポンス構造は FM08（boj-fx）と同一。先頭 11 行メタ、12 行目ヘッダ、13 行目以降データ。
      - SURVEY_DATES は YYYYNN（NN=01..04）。NN を月 03/06/09/12 に変換。
