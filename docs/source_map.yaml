# source_map.yaml
# 指標 ID → 一次ソース URL の対応表（機械可読）
#
# 各エントリは fetch_*.py スクリプトから読まれる。
# license フィールドは DATA_LICENSE.md の「一次ソース優先」原則の根拠資料。

version: 2  # 2026-04-22: D-011 に従い indicators: dict とメタデータ共通項目を追加

sources:
  jepx-spot:
    name: JEPX スポット価格（日次サマリ）
    publisher: 一般社団法人 日本卸電力取引所 (JEPX)
    publisher_url: https://www.jepx.jp/
    source_url: https://www.jepx.jp/electricpower/market-data/spot/
    market_page: https://www.jepx.jp/electricpower/market-data/spot/
    # ダウンロードは POST フォーム方式。
    # セッション Cookie + Referer + X-Requested-With が必要と推定。
    post_url: https://www.jepx.jp/_download.php
    post_dir: spot_summary
    # ファイル名リストが定義されている JS
    js_url: https://www.jepx.jp/js/spot_summary.js
    filename_template: 'spot_summary_{year}.csv'
    # --- D-011 メタデータ共通項目 ---
    license: jepx-terms                           # SPDX 非対応のため独自識別子
    license_url: https://www.jepx.jp/electricpower/index.html
    license_notice: ""
    license_text: |
      JEPX 公開データ。再配布・引用は出典明示を条件に可。
      参考: https://www.jepx.jp/electricpower/index.html
    frequency: daily
    tz: Asia/Tokyo
    missing_policy: "null"                        # 欠損日はそのまま null（forward fill しない）
    freshness_sla_days: 3                         # 平日 1 回更新、3 営業日以内を許容
    columns:
      # 元 CSV の列構造（参考）
      - 受渡日
      - 時間コード (1-48)
      - 売り入札量(kWh)
      - 買い入札量(kWh)
      - 約定総量(kWh)
      - システムプライス(円/kWh)
      - エリアプライス_北海道
      - エリアプライス_東北
      - エリアプライス_東京
      - エリアプライス_中部
      - エリアプライス_北陸
      - エリアプライス_関西
      - エリアプライス_中国
      - エリアプライス_四国
      - エリアプライス_九州
    indicator_ids:
      # このソースから派生する indicator_id 一覧（互換のため保持、実際は indicators: dict を使う）
      - jepx-spot-system
      - jepx-spot-hokkaido
      - jepx-spot-tohoku
      - jepx-spot-tokyo
      - jepx-spot-chubu
      - jepx-spot-hokuriku
      - jepx-spot-kansai
      - jepx-spot-chugoku
      - jepx-spot-shikoku
      - jepx-spot-kyushu
    # D-011 準拠の indicator 固有メタデータ（10 系列）
    indicators:
      jepx-spot-system:
        name: JEPX スポット システムプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "48 コマの単純平均。システム全体の指標価格"
        depends_on: null
      jepx-spot-hokkaido:
        name: JEPX スポット 北海道エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "北海道電力管内の日次平均約定価格"
        depends_on: null
      jepx-spot-tohoku:
        name: JEPX スポット 東北エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "東北電力管内の日次平均約定価格"
        depends_on: null
      jepx-spot-tokyo:
        name: JEPX スポット 東京エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "東京電力 PG 管内の日次平均約定価格。首都圏の指標"
        depends_on: null
      jepx-spot-chubu:
        name: JEPX スポット 中部エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "中部電力管内の日次平均約定価格"
        depends_on: null
      jepx-spot-hokuriku:
        name: JEPX スポット 北陸エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "北陸電力管内の日次平均約定価格"
        depends_on: null
      jepx-spot-kansai:
        name: JEPX スポット 関西エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "関西電力管内の日次平均約定価格"
        depends_on: null
      jepx-spot-chugoku:
        name: JEPX スポット 中国エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "中国電力管内の日次平均約定価格"
        depends_on: null
      jepx-spot-shikoku:
        name: JEPX スポット 四国エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "四国電力管内の日次平均約定価格"
        depends_on: null
      jepx-spot-kyushu:
        name: JEPX スポット 九州エリアプライス
        domain: power
        unit: "¥/kWh"
        backfill_start: "2005-04-01"
        aggregation: daily_mean
        notes: "九州電力管内の日次平均約定価格"
        depends_on: null
    notes: |
      - 1 日 = 48 コマ（30 分単位）。日次平均は 48 コマの単純平均で算出。

  jma-temp:
    name: 気象庁 日次気温（9 エリア代表観測点）
    publisher: 気象庁
    publisher_url: https://www.data.jma.go.jp/
    source_url: https://www.data.jma.go.jp/obd/stats/etrn/index.php
    # --- D-011 メタデータ共通項目 ---
    license: jma-terms
    license_url: https://www.jma.go.jp/jma/kishou/info/coment.html
    license_notice: ""
    tz: Asia/Tokyo
    missing_policy: "null"            # 欠測記号はすべて NaN = null に正規化
    freshness_sla_days: 3
    # 静的 HTML 月次ページ（候補 B）。
    # 気象官署（daily_s1.php）系統のみ使用。アメダス専用点（daily_a1.php）は今回対象外。
    page_url_template: "https://www.data.jma.go.jp/obd/stats/etrn/view/daily_s1.php?prec_no={prec_no}&block_no={block_no}&year={year}&month={month}&day=&view="
    # 2026-05-18: JMA daily_s1 は <meta charset="UTF-8"> で配信。過去 raw HTML（2014-）も全て UTF-8。
    # 旧設定は shift_jis だが、数値は ASCII バイトで化けず気付かれなかった。
    # 風向（漢字）追加に伴い UTF-8 へ修正。
    encoding: utf-8
    table_class: data2_s
    # テーブル内の列位置（0-indexed）。気象官署 日ごとの値 の標準レイアウトを想定。
    # ヘッダ行が 2 段 merged なので、データ行の td インデックスで指定する。
    columns:
      day: 0
      precip: 3
      temp_avg: 6
      temp_max: 7
      temp_min: 8
      wind_avg: 11      # 風速 平均（m/s）
      wind_dir: 13      # 最大風速時の風向（16 方位の漢字 → 度に変換）
      sunshine: 16      # 日照時間（h）
      snow_max: 18      # 最深積雪（cm）
    stations:
      hokkaido: { name: 札幌, prec_no: 14, block_no: 47412 }
      tohoku:   { name: 仙台, prec_no: 34, block_no: 47590 }
      tokyo:    { name: 東京, prec_no: 44, block_no: 47662 }
      chubu:    { name: 名古屋, prec_no: 51, block_no: 47636 }
      hokuriku: { name: 金沢, prec_no: 56, block_no: 47605 }
      kansai:   { name: 大阪, prec_no: 62, block_no: 47772 }
      chugoku:  { name: 広島, prec_no: 67, block_no: 47765 }
      shikoku:  { name: 高松, prec_no: 72, block_no: 47891 }
      kyushu:   { name: 福岡, prec_no: 82, block_no: 47807 }
    items:
      - { key: temp_avg, id_prefix: jma-temp-avg, ja: 日平均気温, unit: ℃, aggregation: daily_mean }
      - { key: temp_max, id_prefix: jma-temp-max, ja: 日最高気温, unit: ℃, aggregation: daily_max }
      - { key: temp_min, id_prefix: jma-temp-min, ja: 日最低気温, unit: ℃, aggregation: daily_min }
      - { key: precip,   id_prefix: jma-precip,   ja: 日降水量合計, unit: mm, aggregation: daily_sum }
      - { key: sunshine, id_prefix: jma-sunshine, ja: 日照時間, unit: h, aggregation: daily_sum }
      - { key: wind_avg, id_prefix: jma-wind-avg, ja: 日平均風速, unit: "m/s", aggregation: daily_mean }
      - { key: wind_dir, id_prefix: jma-wind-dir, ja: 最大風速時風向, unit: deg, aggregation: raw }
      - { key: snow_max, id_prefix: jma-snow-max, ja: 最深積雪, unit: cm, aggregation: daily_max }
    license_text: |
      気象庁ホームページのコンテンツの利用について（https://www.jma.go.jp/jma/kishou/info/coment.html）
      出典明示を条件に自由利用可。再配布時は出典と編集加工の有無を明示する。
    frequency: daily
    indicator_ids:
      # 9 エリア × 3 項目 = 27 系列
      - jma-temp-avg-hokkaido
      - jma-temp-avg-tohoku
      - jma-temp-avg-tokyo
      - jma-temp-avg-chubu
      - jma-temp-avg-hokuriku
      - jma-temp-avg-kansai
      - jma-temp-avg-chugoku
      - jma-temp-avg-shikoku
      - jma-temp-avg-kyushu
      - jma-temp-max-hokkaido
      - jma-temp-max-tohoku
      - jma-temp-max-tokyo
      - jma-temp-max-chubu
      - jma-temp-max-hokuriku
      - jma-temp-max-kansai
      - jma-temp-max-chugoku
      - jma-temp-max-shikoku
      - jma-temp-max-kyushu
      - jma-temp-min-hokkaido
      - jma-temp-min-tohoku
      - jma-temp-min-tokyo
      - jma-temp-min-chubu
      - jma-temp-min-hokuriku
      - jma-temp-min-kansai
      - jma-temp-min-chugoku
      - jma-temp-min-shikoku
      - jma-temp-min-kyushu
      - jma-precip-hokkaido
      - jma-precip-tohoku
      - jma-precip-tokyo
      - jma-precip-chubu
      - jma-precip-hokuriku
      - jma-precip-kansai
      - jma-precip-chugoku
      - jma-precip-shikoku
      - jma-precip-kyushu
      # --- Phase 2-C 追加 27 系列（日照・風速・積雪） ---
      - jma-sunshine-hokkaido
      - jma-sunshine-tohoku
      - jma-sunshine-tokyo
      - jma-sunshine-chubu
      - jma-sunshine-hokuriku
      - jma-sunshine-kansai
      - jma-sunshine-chugoku
      - jma-sunshine-shikoku
      - jma-sunshine-kyushu
      - jma-wind-avg-hokkaido
      - jma-wind-avg-tohoku
      - jma-wind-avg-tokyo
      - jma-wind-avg-chubu
      - jma-wind-avg-hokuriku
      - jma-wind-avg-kansai
      - jma-wind-avg-chugoku
      - jma-wind-avg-shikoku
      - jma-wind-avg-kyushu
      - jma-snow-max-hokkaido
      - jma-snow-max-tohoku
      - jma-snow-max-tokyo
      - jma-snow-max-chubu
      - jma-snow-max-hokuriku
      - jma-snow-max-kansai
      - jma-snow-max-chugoku
      - jma-snow-max-shikoku
      - jma-snow-max-kyushu
      # --- 最大風速時風向 9 系列（16 方位 → 度、aggregation=raw） ---
      - jma-wind-dir-hokkaido
      - jma-wind-dir-tohoku
      - jma-wind-dir-tokyo
      - jma-wind-dir-chubu
      - jma-wind-dir-hokuriku
      - jma-wind-dir-kansai
      - jma-wind-dir-chugoku
      - jma-wind-dir-shikoku
      - jma-wind-dir-kyushu
    # D-011 準拠の indicator 固有メタデータ
    indicators:
      # --- 日平均気温（9 地点）---
      jma-temp-avg-hokkaido: { name: "札幌 日平均気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 札幌（prec=14, block=47412）", depends_on: null }
      jma-temp-avg-tohoku:   { name: "仙台 日平均気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 仙台（prec=34, block=47590）", depends_on: null }
      jma-temp-avg-tokyo:    { name: "東京 日平均気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 東京（prec=44, block=47662）", depends_on: null }
      jma-temp-avg-chubu:    { name: "名古屋 日平均気温",   domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 名古屋（prec=51, block=47636）", depends_on: null }
      jma-temp-avg-hokuriku: { name: "金沢 日平均気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 金沢（prec=56, block=47605）", depends_on: null }
      jma-temp-avg-kansai:   { name: "大阪 日平均気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 大阪（prec=62, block=47772）", depends_on: null }
      jma-temp-avg-chugoku:  { name: "広島 日平均気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 広島（prec=67, block=47765）", depends_on: null }
      jma-temp-avg-shikoku:  { name: "高松 日平均気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 高松（prec=72, block=47891）", depends_on: null }
      jma-temp-avg-kyushu:   { name: "福岡 日平均気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 福岡（prec=82, block=47807）", depends_on: null }
      # --- 日最高気温（9 地点）---
      jma-temp-max-hokkaido: { name: "札幌 日最高気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 札幌。夏の冷房需要・冬日解析で使用", depends_on: null }
      jma-temp-max-tohoku:   { name: "仙台 日最高気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 仙台", depends_on: null }
      jma-temp-max-tokyo:    { name: "東京 日最高気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 東京。首都圏の夏季ピーク指標", depends_on: null }
      jma-temp-max-chubu:    { name: "名古屋 日最高気温",   domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 名古屋", depends_on: null }
      jma-temp-max-hokuriku: { name: "金沢 日最高気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 金沢", depends_on: null }
      jma-temp-max-kansai:   { name: "大阪 日最高気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 大阪", depends_on: null }
      jma-temp-max-chugoku:  { name: "広島 日最高気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 広島", depends_on: null }
      jma-temp-max-shikoku:  { name: "高松 日最高気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 高松", depends_on: null }
      jma-temp-max-kyushu:   { name: "福岡 日最高気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 福岡", depends_on: null }
      # --- 日最低気温（9 地点）---
      jma-temp-min-hokkaido: { name: "札幌 日最低気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 札幌。冬の暖房需要の指標", depends_on: null }
      jma-temp-min-tohoku:   { name: "仙台 日最低気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 仙台", depends_on: null }
      jma-temp-min-tokyo:    { name: "東京 日最低気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 東京", depends_on: null }
      jma-temp-min-chubu:    { name: "名古屋 日最低気温",   domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 名古屋", depends_on: null }
      jma-temp-min-hokuriku: { name: "金沢 日最低気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 金沢", depends_on: null }
      jma-temp-min-kansai:   { name: "大阪 日最低気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 大阪", depends_on: null }
      jma-temp-min-chugoku:  { name: "広島 日最低気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 広島", depends_on: null }
      jma-temp-min-shikoku:  { name: "高松 日最低気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 高松", depends_on: null }
      jma-temp-min-kyushu:   { name: "福岡 日最低気温",     domain: weather, unit: "℃", backfill_start: "2012-01-01", aggregation: daily_min,  notes: "気象官署 福岡", depends_on: null }
      # --- 日降水量合計（9 地点）---
      # 観測所からの値到着が一時的にラグることがあるため、3 日 → 7 日に緩和して誤検知を減らす。
      jma-precip-hokkaido:   { name: "札幌 日降水量合計",   domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 札幌。水力発電ダム流入と雪・豪雨イベントの素材指標", depends_on: null, freshness_sla_days: 7 }
      jma-precip-tohoku:     { name: "仙台 日降水量合計",   domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 仙台", depends_on: null, freshness_sla_days: 7 }
      jma-precip-tokyo:      { name: "東京 日降水量合計",   domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 東京。首都圏の豪雨・梅雨指標", depends_on: null, freshness_sla_days: 7 }
      jma-precip-chubu:      { name: "名古屋 日降水量合計", domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 名古屋", depends_on: null, freshness_sla_days: 7 }
      jma-precip-hokuriku:   { name: "金沢 日降水量合計",   domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 金沢。冬の豪雪＝水力貯水の素材", depends_on: null, freshness_sla_days: 7 }
      jma-precip-kansai:     { name: "大阪 日降水量合計",   domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 大阪", depends_on: null, freshness_sla_days: 7 }
      jma-precip-chugoku:    { name: "広島 日降水量合計",   domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 広島", depends_on: null, freshness_sla_days: 7 }
      jma-precip-shikoku:    { name: "高松 日降水量合計",   domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 高松", depends_on: null, freshness_sla_days: 7 }
      jma-precip-kyushu:     { name: "福岡 日降水量合計",   domain: weather, unit: "mm", backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 福岡。九州北部豪雨の素材", depends_on: null, freshness_sla_days: 7 }
