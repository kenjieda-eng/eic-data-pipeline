        「このサービスは、日本銀行時系列統計データ検索サイトの API 機能を使用しています。
         サービスの内容は日本銀行によって保証されたものではありません。」
      API 機能利用時の留意点: https://www.stat-search.boj.or.jp/info/api_notice.pdf
    frequency: quarterly
    tz: Asia/Tokyo
    missing_policy: "null"
    freshness_sla_days: 150
    # 4 系列（大企業 製造/非製造、中小企業 製造/非製造）
    series:
      - id: tankan-large-mfg-di
        name: 短観 業況判断 DI 大企業・製造業（実績）
        code: TK99F1000601GCQ01000
        region: jp
        unit: DI
      - id: tankan-large-nonmfg-di
        name: 短観 業況判断 DI 大企業・非製造業（実績）
