      atb-capex-battery: { name: "蓄電池（4時間 ユーティリティ規模） CAPEX（米 NREL ATB）", domain: tech, unit: "$/kW", backfill_start: "2021-01-01", aggregation: raw, atb_technology: "Utility-Scale Battery Storage", atb_techdetail: "4Hr Battery Storage", notes: "NREL ATB 2021-2024 各年版の base year（当年）コスト推計。technology=Utility-Scale Battery Storage / techdetail=4Hr Battery Storage / scenario=Moderate / case=Market。米国前提コスト。将来射影は非収載（base year 値のみ、横軸=年版公表年）。", depends_on: null }
    notes: |
      - 技術（tech）ドメイン seed。NREL ATB 電力版、OEDI Data Lake（CC BY 4.0、L-063 確定）。
      - ⚠️ 編集方針（リク監修）: EIC Data は未来予測値を公開しない。ATB は 2050 までの将来射影を含むが、
        各年版（edition）の base year（当年）コスト推計値のみを収載し、将来年（base year 超）の行は取り込まない。
        → 「NREL が各年版で推計した現在コスト」の近年系列。横軸（date）は年版公表年（2021-2024）。
      - L-062 実査（2026-06-06、実 CSV 6 版を S3 から取得）で確定した採用範囲:
          採用 = 2021/2022/2023/2024 版（base year はそれぞれ 2019/2020/2021/2022）。
          除外 = 2019 版（base year LCOE が Moderate でなく Constant/Low/Mid シナリオのみ）/
                 2020 版（techdetail が LTRG・地名タクソノミで Class 系と非互換、default フラグ無し）。
      - techdetail 選定: ATB の default フラグ（=1、2021/2022 は "1.0"・2023/2024 は "1" で正規化）で
        各技術の代表区分を採用（全版で一貫: 陸上風力 Class4 / 洋上風力 Class3 / PV Class5 / CSP Class2 /
        地熱 HydroFlash / 水力 NPD1 / バイオ Dedicated / 原子力 Nuclear）。蓄電池のみ明示 techdetail="4Hr Battery Storage"。
      - 指標 3 種 × 技術: LCOE($/MWh) / CAPEX($/kW) / CF(設備利用率 %)。CF は ATB 分数値を ×100。
      - 化石（NaturalGas_FE / Coal_FE）は FE 表再編で LCOE・CF を持たず CAPEX も年版で techdetail 命名が
        不安定（2023 は "*" のみ）のため今回は不採用。蓄電池は storage のため LCOE 非定義、CAPEX のみ採用（#74 連携）。
      - 原子力は 2024 版で新設炉が 2030 年初出（base year 2022 に値が無い）ため 2021-2023 の 3 点。
      - 取得: HTTPS 直 URL（aws cli 不要）。raw は data/raw/nrel-atb/atbe_{edition}.csv（不変版のためサイズ一致で再利用）。

  edinet:
    name: 金融庁 EDINET 有価証券報告書（企業財務）
    source_name: 金融庁 EDINET（有価証券報告書 XBRL/CSV, EDINET API v2）
    publisher: 金融庁 EDINET
    publisher_url: https://disclosure2.edinet-fsa.go.jp/
    source_url: https://disclosure2.edinet-fsa.go.jp/
    # EDINET API v2。2 本立て:
    #   Document List API: {api_base}/documents.json?date=YYYY-MM-DD&type=2 で docID 特定
    #   Document Acquisition API: {api_base}/documents/{docID}?type=5 で CSV(ZIP, TSV/UTF-16) 取得
    # API キーは .env の EDINET_API_KEY（Subscription-Key パラメータ）。CSV/metadata には保存しない。
    api_base: https://api.edinet-fsa.go.jp/api/v2
    doc_type_code: "120"      # 有価証券報告書
    submission_month: 6       # 3 月期決算 → 6 月提出（fetch_edinet.py が当月の各日を新しい順に走査）
    # --- D-011 メタデータ共通項目 ---
    license: edinet-terms
    license_url: https://disclosure2.edinet-fsa.go.jp/
    license_notice: "出典: 金融庁 EDINET、公共データ利用規約 第1.0版"
    license_text: |
      金融庁 EDINET 公開データ。公共データ利用規約（第1.0版, PDL1.0）準拠。
      平成27年改訂で営利目的を含む二次利用が可能（出典明記が条件）。
      L-063 (2026-06-09): 公表元 金融庁 EDINET、出典明記で商用再利用可、EDINET API v2 で
      自動取得可（API キー必須）を確認済（GO）。
