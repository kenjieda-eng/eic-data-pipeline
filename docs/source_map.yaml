      - capacity-main-auction-volume-hokuriku
      - capacity-main-auction-volume-kansai
      - capacity-main-auction-volume-chugoku
      - capacity-main-auction-volume-shikoku
      - capacity-main-auction-volume-kyushu
    # D-011 準拠の indicator 固有メタデータ (20 系列)
    # date 軸 = 実需給年度の 4 月 1 日 (例: FY2024 → 2024-04-01)
    indicators:
