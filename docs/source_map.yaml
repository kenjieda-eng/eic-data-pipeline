  occto-capacity:
    name: OCCTO 容量市場 メインオークション約定結果
    publisher: 電力広域的運営推進機関 (OCCTO)
    publisher_url: https://www.occto.or.jp/
    source_url: https://www.occto.or.jp/capacity-market/yoryoshijyo/main/data/
    # ----- Phase D 第 1 期 Day 2 (2026-05-20 午後) 全面書き直し -----------
    # Day 1 (5/20 朝) の scaffold は 6 件のドリフトが発覚し全面修正:
    #   1. index_url: /market-board/market/main-auction/ (404) →
    #                 /capacity-market/yoryoshijyo/main/data/ (正)
    #   2. ファイル形式: PDF/Excel 単一 → ZIP に CSV 1 枚 格納
    #   3. ファイル名: main_auction_YYYY.xlsx → {delivery_fy}_yakujoukekka_csv.zip
    #   4. 主軸: auction_year (オークション開催年) → delivery_fy (実需給年度)
    #   5. スコープ: 2020-2024 メイン 5 回 → FY2024-FY2029 メイン 6 回
    #   6. parse 関数名: parse_auction_excel/_pdf 廃止 → parse_auction_zip_csv 新規
    # 上記は 5/20 午後の probe (FY2024 + FY2028 ZIP) で実構造を完全把握した結果。
    # 詳細: L-061 候補 (scaffold 起草時の実 URL HTTP リーチ確認不足を体系化予定)。
    # --------------------------------------------------------------
    # 容量市場 = 4 年後の供給力 (kW 価値) を取引する市場、OCCTO が運営。
    # 2020 年 7 月にメインオークション初回開催 (FY2024 実需給対象)、以降毎年 1 回開催。
    # 公開データは ZIP に格納された 1 枚の CSV (エリア毎の詳細)。
    # トップページ (実需給年度ごとのファイルリンクが並ぶ統合ページ)
    index_url: https://www.occto.or.jp/capacity-market/yoryoshijyo/main/data/
    # メインオークション約定結果 ZIP の URL テンプレート (実 URL 検証済、FY2024/FY2028 で確認)
    # 注: FY2028 のみ ".../2028_main_yakujoukekka_csv.zip" (中央に "main" が入る)、
    # それ以外 (FY2024/FY2025/FY2026/FY2027/FY2029) は "{fy}_yakujoukekka_csv.zip"。
    # FY2029 だけ別パスに置かれる: .../assets/capacity-market/yoryoshijyo/main/data/index/{fy}_yakujoukekka_csv.zip
    # 動的解決は index_url の HTML を fetch して a[href] を走査することで対応。
    file_url_base: https://www.occto.or.jp/capacity-market/wp-content/themes/occto/documents/
    # ZIP 内 CSV は cp932 (Shift_JIS) エンコード、列構造は以下に固定 (FY2024 + FY2028 で実測):
    #   1. 対象実需給年度          (int, e.g. 2024)
    #   2. エリア                  (str, 北海道/東北/東京/中部/北陸/関西/中国/四国/九州)
    #   3. 約定価格[円/kW]         (int, e.g. 14137)
    #   4. エリア毎の約定容量[kW]  (int, e.g. 5931674)
    #   5. エリア毎の約定総額（経過措置控除後）[円]  (int)
    csv_encoding: cp932
    csv_columns:
      - 対象実需給年度
      - エリア
      - 約定価格[円/kW]
      - エリア毎の約定容量[kW]
      - エリア毎の約定総額（経過措置控除後）[円]
    # エリア日本語名 → indicator_id サフィックス (英数小文字) の mapping
    area_map:
      北海道: hokkaido
      東北: tohoku
      東京: tokyo
      中部: chubu
      北陸: hokuriku
      関西: kansai
      中国: chugoku
      四国: shikoku
      九州: kyushu
    # --- D-011 メタデータ共通項目 ---
    license: occto-terms                          # OCCTO 利用規約 (出典明示で再配布可)
    license_url: https://www.occto.or.jp/info/disclaimer.html
    license_notice: |
      出典: 電力広域的運営推進機関 (OCCTO)「容量市場 メインオークション約定結果」
      OCCTO 利用規約に従い、出典明示を条件に利用可。
    license_text: |
      OCCTO 公開データ。再配布・引用は出典明示を条件に可。
      参考: https://www.occto.or.jp/info/disclaimer.html
    frequency: annual
    tz: Asia/Tokyo
    missing_policy: "null"                        # 未開催年度は null
    freshness_sla_days: 365                       # 年 1 回オークションのため
    # ----- スコープ境界 (実需給年度ベース) --------------------------------
    # FY2024 (第 1 回オークション、2020 年実施) ～ FY2029 (第 6 回、2025 年実施) = 6 年分
    # FY2028 は ZIP 名が "{fy}_main_yakujoukekka_csv.zip" と異なるので filename pattern は柔軟に
    min_delivery_fy: 2024
    # 単位 (約定価格 = ¥/kW・年、約定容量 = kW)
    unit_price: "¥/kW"
    unit_volume: "kW"
    indicator_ids:
      - capacity-main-auction-price-national
      - capacity-main-auction-price-hokkaido
      - capacity-main-auction-price-tohoku
      - capacity-main-auction-price-tokyo
      - capacity-main-auction-price-chubu
      - capacity-main-auction-price-hokuriku
      - capacity-main-auction-price-kansai
