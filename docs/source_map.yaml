  jepx-nonfossil:
    name: JEPX 非化石価値取引市場 オークション結果
    publisher: 一般社団法人 日本卸電力取引所 (JEPX)
    publisher_url: https://www.jepx.jp/
    source_url: https://www.jepx.jp/nonfossil/market-data/
    market_page: https://www.jepx.jp/nonfossil/market-data/
    # ----- 取得エンドポイント（L-063 レポート §A-1 §1 で実測特定）------------
    # 市場ページの JS (js/nonfossil-market-data.js) が叩いている 2 本をそのまま使う。
    # spot と違い POST(_download.php) ではなく GET で CSV が返る。
    #   1) 収録年度レンジ: 応答本文 "2025,2017"（最新年度, 最古年度）
    #   2) 年度別オークション結果 CSV
    # ★ 取得範囲は 1) の応答から決める（年度をハードコードしない）。
    #   年度ローテーションを公式レスポンスで検知できる = Pink Sheet 型サイレント停滞の予防。
    year_range_url: https://www.jepx.jp/js/get_graph_year.php?dir=nf_summary
    csv_url_template: https://www.jepx.jp/js/csv_read.php?dir=nf_summary&file=nf_summary_{fy}.csv
    post_dir: nf_summary
    # --- D-011 メタデータ共通項目 ---
    license: jepx-terms                            # 既存識別子。新規追加不要（jepx-spot 10 系列と同条件）
    license_url: https://www.jepx.jp/disclaimer/
    license_notice: "出典: 一般社団法人 日本卸電力取引所 (JEPX) 非化石価値取引市場 オークション結果。JEPX 免責事項・著作権「当ウェブサイトに掲載されている内容に関する著作権は本所にあります」「出所を明示した上でご利用下さい」に従い、出所明示を条件に利用。"
    license_text: |
      JEPX 公開データ。免責事項・著作権ページ（https://www.jepx.jp/disclaimer/）に
      「当ウェブサイトに掲載されている内容に関する著作権は本所にあります」
      「出所を明示した上でご利用下さい」
      「ご利用条件および公開されている情報の変更・削除は原則として予告なしに行います」とある。
      政府標準利用規約でも CC BY でもない JEPX 独自条件。出所明示を条件に利用。
      L-063 = GO（jepx-spot 10 系列と完全に同一条件のため新規ライセンスリスクなし）。
    domain: regulation
    frequency: quarterly
    tz: Asia/Tokyo
    missing_policy: "null"                         # 未開催回は行を作らない（"-" は観測なし）
    aggregation: raw
    # 年 4 回オークション（間隔 約 92 日）。L-063 レポート推奨値。
    # check_staleness.py の 2x ハードゲート = 240 日 ≒ 約定 2 回分の欠落で赤くなる。
    freshness_sla_days: 120
    # ----- サニティ枠（fetch_nonfossil.check_sanity_bands が書き出し前に検査）-----
    # 目的は「約定量(1e8 オーダー)を価格として書き込む」類の列取り違えを、
    # ゴミが data/processed に着地する前に落とすこと。
    # **最新観測** が枠外なら書き出し中止 + exit 1。過去観測の枠外は warning のみ
    # （下限/上限は制度改正で動いており、現行の枠を過去に遡って当てるのは誤り）。
    # 制度改正で枠が動いてもコード修正なしで追随できるよう yaml 側に持つ。
    columns:
      # 元 CSV の列構造（全 FY2017-2025 の 9 ファイルで同一と確認, L-062）
      - 年度
      - 開催回          # {1,2,3,4}。ただし FY2017 のみ "通年"
      - 商品            # FIT / 非FIT(再エネ指定) / 非FIT(再エネ指定なし) の 3 種で固定
      - 約定日          # "YYYY/M/D"。未開催回は "-"
      - 約定総量(kWh)
      - 約定価格(円/kWh)
      - 約定最高価格(円/kWh)
      - 約定最低価格(円/kWh)
      - 入札会員数
      - 約定会員数
      - 売り入札量(kWh)
      - 買い入札量(kWh)
    notes: |
      日本の非化石証書 3 類型 × (約定価格, 約定総量) の四半期系列。regulation ドメイン拡充（5 → 11 系列）。
      L-063 事前確認: energy-data-platform/docs/l063-check-energy-gx-2026-08-07.md §A-1 = 🟢 GO。
      date は「約定日」をそのまま使う。同一開催回でも商品ごとに約定日が 1 日ずつずれる
      （例 FY2025 第4回: 非FIT指定なし 5/20 / 非FIT指定 5/21 / FIT 5/22）ため系列間で日付は揃わない。
      実データ調査（全 9 年度走査, L-062）で確定した仕様:
        - ヘッダ・商品名は 9 年度すべて同一。表記ゆれなし。
        - 未開催セルは空文字ではなく "-"。行自体は存在し全列が "-" になる → 約定日が "-" の行はスキップ。
        - 非FIT 2 種は FY2020 第 2 回が初回（FY2017-2019 + FY2020 第 1 回は全て "-"）。
        - FY2017 のみ開催回が "通年"（年 1 回開催）。数値前提のパースにしない。
        - **FY2021 第 1 回だけ FIT が "-"** → 欠落は系列先頭だけでなく途中にも出る。行単位で判定する。
      価格の推移（実測）: FIT 1.3円(FY2017-2020) → 0.3円台(FY2021-2022) → 0.4円台(FY2023-2025)。
      非FIT 2 種は全観測が 0.6〜1.3 円のレンジ内。直近は上下限に張り付く回が多く、
      記事化では「需給で動く市場価格」ではなく「制度上下限の中での約定」として扱うこと。
      レポートが密度版として挙げた入札倍率（買い入札量÷約定総量）は不採用:
      FIT は 買い入札量 == 約定総量 が恒常成立し倍率が常に 1.000 の定数系列になるため。
    indicator_ids:
      - nonfossil-cert-fit-price
      - nonfossil-cert-nonfit-re-price
      - nonfossil-cert-nonfit-price
      - nonfossil-cert-fit-volume
      - nonfossil-cert-nonfit-re-volume
      - nonfossil-cert-nonfit-volume
    indicators:
      nonfossil-cert-fit-price:
        name: 非化石証書 約定価格 FIT
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2017-04-01"
        aggregation: raw
        sanity_min: 0.4                            # 現行の最低価格
        sanity_max: 4                              # 現行の上限価格
        notes: "FIT 非化石証書の回次約定価格。FY2017 は通年 1 回のみ、FY2021 第1回は未開催。最低価格は制度改正で 1.3→0.3→0.4 円と変遷しており、FY2021-2022 の 0.3 円台は当時の下限（現行枠 0.4 円の枠外だが正しい実績値）。"
        depends_on: null
      nonfossil-cert-nonfit-re-price:
        name: 非化石証書 約定価格 非FIT（再エネ指定）
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2020-04-01"
        aggregation: raw
        sanity_min: 0.6
        sanity_max: 1.3
        notes: "非FIT 再エネ指定の回次約定価格。FY2020 第2回が初回（FY2017-2019 と FY2020 第1回は未開催）。全観測が 0.6〜1.3 円のレンジ内。"
        depends_on: null
      nonfossil-cert-nonfit-price:
        name: 非化石証書 約定価格 非FIT（再エネ指定なし）
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2020-04-01"
        aggregation: raw
        sanity_min: 0.6
        sanity_max: 1.3
        notes: "非FIT 再エネ指定なしの回次約定価格。FY2020 第2回が初回（FY2017-2019 と FY2020 第1回は未開催）。全観測が 0.6〜1.3 円のレンジ内。"
        depends_on: null
      nonfossil-cert-fit-volume:
        name: 非化石証書 約定総量 FIT
        domain: regulation
        unit: kWh
        backfill_start: "2017-04-01"
        aggregation: raw
        notes: "FIT 非化石証書の回次約定総量。FIT は売り超過が恒常的で、買い入札量が全量約定する（買い入札量 == 約定総量）。"
        depends_on: null
      nonfossil-cert-nonfit-re-volume:
        name: 非化石証書 約定総量 非FIT（再エネ指定）
        domain: regulation
        unit: kWh
        backfill_start: "2020-04-01"
        aggregation: raw
        notes: "非FIT 再エネ指定の回次約定総量。FY2020 第2回が初回。"
        depends_on: null
      nonfossil-cert-nonfit-volume:
        name: 非化石証書 約定総量 非FIT（再エネ指定なし）
        domain: regulation
        unit: kWh
        backfill_start: "2020-04-01"
        aggregation: raw
        notes: "非FIT 再エネ指定なしの回次約定総量。FY2020 第2回が初回。"
        depends_on: null

  nbs-pmi:
    name: 中国 国家統計局 製造業 PMI（NBS 官製）
    publisher: National Bureau of Statistics of China (NBS) / China Federation of Logistics & Purchasing (CFLP)
    publisher_url: https://www.stats.gov.cn/english/
    # 月次の Purchasing Managers' Index 英語版プレスリリースのインデックス。
    # スクリプトはこのページからアンカー名 "Purchasing Managers' Index" のリンクを引き当て、
    # 各リリース内 Table 1 (China's Manufacturing PMI and Sub-indexes) の 13 ヶ月分を抽出する。
    index_url: "https://www.stats.gov.cn/english/PressRelease/"
    # --- D-011 メタデータ共通項目 ---
    license: nbs-terms
    license_url: https://www.stats.gov.cn/english/
    license_notice: "Source: National Bureau of Statistics of China (NBS) / CFLP. Reuse permitted with citation."
    license_text: |
      中国国家統計局の英語版プレスリリース。再利用は出典明示を条件に可。
      参考: https://www.stats.gov.cn/english/
    frequency: monthly
    tz: Asia/Shanghai
    missing_policy: "null"
    # 翌月 1 日朝（北京時間 09:30）に前月分を公表。最新リリースに過去 13 ヶ月の表が同梱されるため、
    # 通常運用では毎月初に 1 回叩けば直近値が更新される。
    # 月次系列は観測値を「月初日 (YYYY-MM-01)」で日付づける規約のため、M 月分が M+1 月に着地した
    # 時点で age は既に 30 日超。次の M+1 月分が着地する直前まで age は伸び続ける。
    # git 履歴からの実測最大 age（対象 10 系列）: 60-66 日（最大は us-nonfarm-payrolls /
    # us-unemployment-rate の 66 日 = obs 2026-06-01 が 2026-07-03 着地 → 2026-08-07 に更新）。
    # 45 も 60 も実測最大を下回るため構造的に毎月違反が残る → 90 に統一（実測 66 日に対しマージン 24 日）。
    # 90 は monthly 89 系列の最頻値 (42 件) であり、us-cpi-yoy / us-industrial-production と同値。
    freshness_sla_days: 90                        # 実測最大 age 63 日（china-nbs-mfg-pmi）+ マージン
    indicator_ids:
      - china-nbs-mfg-pmi
    indicators:
      china-nbs-mfg-pmi:
        name: "中国 製造業 PMI（NBS 官製、季節調整済）"
        domain: international
        unit: "index"
        backfill_start: "2025-04-01"
        aggregation: raw
        notes: "stats.gov.cn 英語版 Purchasing Managers' Index 月次リリース Table 1 の PMI 列。50 を境界に >50=拡張 / <50=収縮。Caixin PMI は S&P Global proprietary のため不採用 (L-063, 2026-05-27)。FRED に NBS PMI 直系列は存在せず、NBS 英語版プレスリリースから直接抽出。各リリースに過去 13 ヶ月のテーブルが同梱され、月次運用で過去分は dedup で安定化"
        depends_on: null
    notes: |
      - 英語版 PressRelease トップから anchor text に "Purchasing Managers' Index" を含むリンクを最新 1 件引いてフォロー。
      - リリース URL は /english/PressRelease/{YYYYMM}/t{YYYYMMDD}_{ID}.html 形式だが ID は予測不能なため index 経由で動的解決。
      - 各リリース本文 Table 1 (China's Manufacturing PMI and Sub-indexes, Seasonally Adjusted) は直近 13 ヶ月分を含む。
        年マーカー "YYYY-MonthName" 行があり、以降は MonthName のみ繰り返す。次の "YYYY-MonthName" が次年。
      - 列順: PMI / Production Index / New Order Index / Raw Materials Inventory Index / Employment Index / Supplier Delivery Time Index。
        headline PMI は month label の直後の 1 つ目の数値。
      - 過去 13 ヶ月を超える backfill には過去のプレスリリースを別途辿る必要があるが、月次運用で自然に時系列が伸びる。
      - ディレクトリリスト (/PressRelease/202604/ 等) は 403 で取れないため、index ページの "Purchasing Managers' Index" アンカー経由が唯一の発見手段。
      - L-063 判断 (2026-05-27): FRED API series_search で "China Manufacturing PMI" / "China PMI" / "NBS Manufacturing" を全件確認、NBS 製造業 PMI の公開系列なし
        （OECD Business Tendency Surveys composite indicator は方法論が異なり PMI ではない）。NBS 直スクレイプを採用。
      - L-062 smoke (2026-05-27): 2026-04 PMI = 50.3、2026-03 = 50.4、2025-04 = 49.0 で >50 拡張/<50 収縮の妥当帯。

  eu-ets:
    name: "EU ETS data from EUTL (European Environment Agency)"
    source_name: "EU ETS data from EUTL (European Environment Agency)"
    publisher: European Environment Agency (EEA)
    publisher_url: https://www.eea.europa.eu/
    source_url: https://www.eea.europa.eu/en/datahub/datahubitem-view/98f04097-26de-4fca-86c4-63834818c0c0
    # datahub.io ミラー（安定 r-link、追加加工は ODC-PDDL-1.0）。2 本の CSV を 1 リクエストずつ取得。
    #   Family A: 部門別 EU 集計（重複排除済み・Mt 単位）
    #   Family B: 国 × 部門 × metric の原票（約 8MB）
    csv_url_sector: "https://datahub.io/core/eu-emissions-trading-system/_r/-/data/eu-ets-sector-emissions.csv"
    csv_url_full: "https://datahub.io/core/eu-emissions-trading-system/_r/-/data/eu-ets.csv"
    # --- D-011 メタデータ共通項目 ---
    license: eea-terms
    license_url: https://www.eea.europa.eu/legal/copyright
    license_notice: "Source: EU Emissions Trading System (EU ETS) data from EUTL, European Environment Agency / DG-CLIMA. Re-use permitted with attribution. Processed package: ODC-PDDL-1.0 (datahub.io)."
    license_text: |
      EEA 再利用ポリシー（出典明記で商用再利用可）。datahub.io の追加加工分は
      Open Data Commons Public Domain Dedication and License (ODC-PDDL-1.0)。
      L-063 (2026-06-01): 公表元 EEA(EUTL)、出典明記で商用再利用可、安定 r-link で自動取得可を確認済み。
    frequency: annual
    domain: esg
    unit: "Mt-CO2e"
    tz: UTC
    missing_policy: "null"
    # 年次。前年分の検証排出量は翌年中頃（4 月頃）に公表 → 年次 + 公開ラグで緩め設定。
    freshness_sla_days: 400
    backfill_start: "2005-01-01"
    # Family A: activity code -> slug マップ。未マップ部門は fetch script が name から kebab 導出してログ出力。
    sector_slug_map:
      "10": aviation
      "20": combustion
      "21": refining
      "24": iron-steel
      "29": cement
      "30": lime
      "36": paper
      "42": chemicals
    # Family B: 検証排出量フィルタで除外する特殊 country_code（実在国以外）。
    #   XI=北アイルランド（Windsor 枠組みの行政コード）。Innovation/Modernisation Fund / NER 300 / RRF 等の
    #   ファンド行は 2.1 検証排出量サブセットには出現しないが、ISO2 正規表現 + 本リストで安全側に除外。
    country_exclude:
      - XI
    # Family B: ISO2 -> 日本語国名（name 用）。未登録コードは id にフォールバックしてログ出力。
    country_names:
      AT: オーストリア
      BE: ベルギー
      BG: ブルガリア
      CY: キプロス
      CZ: チェコ
      DE: ドイツ
      DK: デンマーク
      EE: エストニア
      ES: スペイン
      FI: フィンランド
      FR: フランス
      GB: 英国
      GR: ギリシャ
      HR: クロアチア
      HU: ハンガリー
      IE: アイルランド
      IS: アイスランド
      IT: イタリア
      LI: リヒテンシュタイン
      LT: リトアニア
      LU: ルクセンブルク
      LV: ラトビア
      MT: マルタ
      NL: オランダ
      "NO": ノルウェー   # YAML 1.1 で NO は bool False に化けるためクォート必須
      PL: ポーランド
      PT: ポルトガル
      RO: ルーマニア
      SE: スウェーデン
      SI: スロベニア
      SK: スロバキア
    # D-011 準拠の indicator 固有メタデータ（Family A 8 + Family B 31 + Family C 2 + Family D 31 = 72 系列）。
    # 系列数・件数はハードコードではなく実データから確定する（L-013）。本 dict は name と
    # 個別 override の出典であり、実際に書き出す系列は fetch_eu_ets.py が実 CSV から決定する。
    indicators:
      # --- Family A: EU 全体 部門別 検証排出量（aggregation=raw, region=EU-ETS）---
