        domain: esg
        unit: "Mt-CO2"
        backfill_start: "1991-03-31"
        aggregation: raw
        notes: "間接 CO2 等。"
        depends_on: null
      jp-ghg-co2-total:
        name: 日本 CO2 排出量 合計（電気・熱配分後 部門計）
        domain: esg
