    notes: |
      - ESG ドメイン seed（北極星 12 ドメイン唯一の未 seed を解消、2026-06-01）。出典 = EU ETS data from EUTL（EEA/DG-CLIMA）、datahub.io ミラー。
      - 4 ファミリ構成:
          Family A（部門別、aggregation=raw, region=EU-ETS）: eu-ets-sector-emissions.csv の全部門に 1 系列。
            slug は sector_slug_map（10=aviation/20=combustion/21=refining/24=iron-steel/29=cement/30=lime/36=paper/42=chemicals）。
          Family B（国別合計、aggregation=annual_sum, region=ISO2）: eu-ets.csv を
            citl_information=="2.1 EU-ETS Verified Emission" / year=^\d{4}$ / main_activity_code 非 -99 / country_code=ISO2(非 XI)
            でフィルタし、国×年で value を合計 → ÷1e6 で Mt 化。
          Family C（EU 全体 供給側、aggregation=annual_sum, region=EU-ETS, unit=百万 EUA, 2026-06-08 追加）: eu-ets.csv の
            供給側 metric（1.1 無償割当 / 1.3 オークション売却）を EU 全体×年で合計。供給側は leaf 部門按分が無く、
            特にオークションは 10 航空 + 20-99 全固定設備 rollup の 2 コードのみ（leaf 合計だと航空分のみに化けるため
            rollup 必須、L-062 実データ確認）。有効国（ISO2 非 XI）の 10+20-99 を年で合計 → ÷1e6 で百万 EUA 化（1 EUA=1 tCO2e）。
          Family D（国別 無償割当、aggregation=annual_sum, region=ISO2, unit=百万 EUA, 2026-06-09 追加）: eu-ets.csv の
            1.1 Freely allocated allowances を Family C と同じ rollup（10 航空 + 20-99 全固定設備）で国×年に分解。
            Family B（国別検証排出量）と対の参照系列。全国合計 == Family C eu-ets-allowances-allocated（同手法・国分解のため完全一致）。
      - 二重計上回避: main_activity_code の "-99"（20-99=全固定設備, 21-99=産業計）は leaf 部門の rollup のため
        Family B（排出量）では除外必須。一方 Family C（供給側）は leaf 按分が無いため 20-99 rollup を採用する（按分有無の違い）。
        fetch_eu_ets.py が「Family B 全国合計（航空除く）」と「Family A 固定設備部門合計（航空除く）」を最新共通年で print 照合する。
      - 単位: Family A/B = Mt-CO2e、Family C/D = 百万 EUA。頻度は annual、期間 2005-2025（航空のみ 2012-）。
      - 系列数は実 CSV から確定（L-013）。本セクションの indicators は Family A 8 + Family B 31 + Family C 2 + Family D 31 = 72 を想定（D は無償割当データのある国のみ書き出し）。
      - CSV は常に全期間を返すため backfill フラグ不要（write_processed が key_cols で dedup）。
  nrel-atb:
    name: NREL Annual Technology Baseline (ATB) Electricity
    publisher: National Renewable Energy Laboratory (NREL)
    publisher_url: https://atb.nrel.gov/
    source_url: https://atb.nrel.gov/
    # OEDI Data Lake（S3 公開、no-sign-request）。HTTPS 直 URL で年版別 CSV を取得。
    # aws cli 不要。L-062 実査（2026-06-06）: csv/{YYYY}/ATBe.csv（2024 のみ v3.0.0 サブディレクトリ）。
    s3_base: "https://oedi-data-lake.s3.amazonaws.com/ATB/electricity/csv"
    editions:
      # edition_year: S3 相対パス（実在確認済み 2026-06-06）。2019/2020 は別タクソノミ・別シナリオ命名のため不採用。
      "2021": "2021/ATBe.csv"
      "2022": "2022/ATBe.csv"
      "2023": "2023/ATBe.csv"
      "2024": "2024/v3.0.0/ATBe.csv"
    # 固定フィルタ（L-062 実 CSV 検証 2026-06-06）。実列名で抽出する。
    filter_scenario: "Moderate"
    filter_case: "Market"
    # metric -> ATB 実パラメータ / 単位 / 値スケール / CRP フィルタ（LCOE のみ財務指標で CRP 依存）。
    metrics:
      lcoe:  { param: "LCOE",  unit: "$/MWh", scale: 1,   crpyears: "20" }
      capex: { param: "CAPEX", unit: "$/kW",  scale: 1,   crpyears: null }
      cf:    { param: "CF",    unit: "%",     scale: 100, crpyears: null }   # ATB の CF は分数（0-1）→ ×100 で %
    # --- D-011 メタデータ共通項目 ---
    license: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    license_notice: "Source: NREL Annual Technology Baseline (ATB), Open Energy Data Initiative (OEDI), CC BY 4.0."
    license_text: |
      Creative Commons Attribution 4.0 International (CC BY 4.0)。
      出典明示を条件に再配布・商用利用可。OEDI submission に明記（例 2023 版 DOI 10.25984/1987306）。
