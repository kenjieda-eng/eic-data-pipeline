  mof-jgb:
    name: 財務省 国債金利情報（日次、各年限）
    publisher: 財務省
    publisher_url: https://www.mof.go.jp/
    source_url: https://www.mof.go.jp/jgbs/reference/interest_rate/
    # 単一 CSV（過去全期間: 1974-09-24 〜 前年度末）。Shift-JIS、和暦日付、15 年限の wide 形式。
    # 年度切替時にまとめて前年度をアーカイブする運用。
    csv_url: "https://www.mof.go.jp/jgbs/reference/interest_rate/data/jgbcm_all.csv"
    # 当年度の日次更新版 CSV（1974-09-24〜最新営業日まで取れない、当年度のみ）。
    # 2026-04-25 の事故（observation_cutoff が 3/31 で止まる）を受けて Phase 2-A v2 で追加。
    # 当年度版のキー = 同日付があればこちらが優先（fetch_jgb.py で union 時に当年度版が後勝ち）。
    current_csv_url: "https://www.mof.go.jp/jgbs/reference/interest_rate/jgbcm.csv"
    encoding: shift_jis
    # 列ヘッダ（2 行目）: 基準日,1年,2年,3年,4年,5年,6年,7年,8年,9年,10年,15年,20年,25年,30年,40年
    # 1 行目は単位注意書き。3 行目以降がデータ。欠損（新発がなかった期間）は "-"。
    header_row: 2
    # --- D-011 メタデータ共通項目 ---
    license: public-domain                       # 財務省公表資料、自由利用可（国の著作物）
    license_url: https://www.mof.go.jp/index.htm
    license_notice: ""
    license_text: |
      財務省（国）が作成した公表資料。国の著作物は原則として自由利用可。
      参考: 財務省ホームページ利用規約 https://www.mof.go.jp/index.htm
    frequency: daily
    tz: Asia/Tokyo
    missing_policy: "null"                        # 金利が付かなかった日は "-" → null で保持
    freshness_sla_days: 5
    indicator_ids:
      - jgb-10y-yield
      - jgb-30y-yield
    # Phase 1 は 10 年、Phase 3-B で 30 年を追加。Phase 2 以降で 2y/5y/20y も昇格可能。
    indicators:
      jgb-10y-yield:
        name: "JGB 10 年金利（新発）"
        domain: finance
        unit: "%"
        backfill_start: "1974-09-24"
        aggregation: raw
        notes: "財務省 金利情報 jgbcm_all.csv、10 年新発国債の日次利回り。土日祝・入札なし日は '-' → null"
        depends_on: null
      jgb-30y-yield:
        name: "JGB 30 年金利（新発）"
        domain: finance
        unit: "%"
        backfill_start: "1999-09-21"
        aggregation: raw
        notes: "財務省 金利情報 jgbcm_all.csv、30 年新発国債の日次利回り（1999-09 開始）。米 30 年金利との比較に使用"
        depends_on: null
    # CSV 構造のメモ（fetch_jgb.py が読む）
    columns_wide:
      - 基準日
      - "1年"
      - "2年"
      - "3年"
      - "4年"
      - "5年"
      - "6年"
      - "7年"
      - "8年"
      - "9年"
      - "10年"
      - "15年"
      - "20年"
      - "25年"
      - "30年"
      - "40年"
    # 年限と indicator_id の対応（Phase 1: 10 年、Phase 3-B: 30 年追加）
    term_to_id:
      "10年": jgb-10y-yield
      "30年": jgb-30y-yield
    notes: |
      - 単一 CSV で 1974-09-24 〜 最新営業日までを取得。差分更新不要（常に全量差し替え）。
      - 日付は和暦（例: S49.9.24 / H10.4.1 / R6.4.1）。fetch_jgb.py で西暦に変換。
      - 元号マッピング: M=明治(1868)/T=大正(1912)/S=昭和(1926)/H=平成(1989)/R=令和(2019)。
      - 新発がなかった年限は "-"。float 変換時は None に落とす（missing_policy: null）。
      - 更新タイミング: 平日 17 時台に当日分が追記される。週末・祝日は行が増えない。
      - Phase 2 で 2年 / 5年 / 20年 / 30年 を追加する際は term_to_id に 1 行足すだけで良い設計。

  enecho-power:
    name: 資源エネルギー庁 電力調査統計
    publisher: 資源エネルギー庁（METI）
    publisher_url: https://www.enecho.meti.go.jp/
    source_url: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    # ----- 2026-04-24 Day 3 実 HTML 疎通で確定した仕様 ------------------
    # ファイルは **年度単位** で公開される（月次ファイルではない）。
    # 1 XLSX に 4 月〜翌 3 月の 12 ヶ月分が格納される wide 形式。
    # 年度によって filename / layout が変わる:
    #   2019 年度〜2025 年度: `2-1-{YYYY}.xlsx` / `3-1-{YYYY}.xlsx`（西暦）
    #   2016 年度〜2018 年度: `2-1-H{nn}.xlsx` / `3-1-H{nn}.xlsx`（和暦平成）
    #   2015 年度以前:       `2-1-H{nn}.xls` + 表構造が根本的に異なる（2-1〜2-12 分割シート）
    # Phase 2-A v1 のスコープは **2016 年度〜最新（2025 年度）** の 10 年分に限定。
    # 2015 年度以前は Phase 2-B 以降で別ローダーを書く。
    # --------------------------------------------------------------
    # 最新年度トップページ（通常 1 年度分のリンクのみ）
    index_url: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/results.html
    # 過去年度一覧（2014〜直近年度を 1 ページにまとめたアーカイブ）
    archive_url: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/results_archive.html
    # どちらのページも同じ HTML 構造。list_xlsx_links は両方を順に走査して union を返す。
    index_urls:
      - https://www.enecho.meti.go.jp/statistics/electric_power/ep002/results.html
      - https://www.enecho.meti.go.jp/statistics/electric_power/ep002/results_archive.html
    # --- D-011 メタデータ共通項目 ---
    license: meti-terms                           # 政府標準利用規約 2.0 互換（CC BY 4.0 互換相当）
    license_url: https://www.meti.go.jp/main/rules.html
    license_notice: |
      出典: 資源エネルギー庁「電力調査統計」
      政府標準利用規約 2.0 に従い、出典明示を条件に利用可。
    license_text: |
      経済産業省（METI）公表資料。政府標準利用規約 2.0（CC BY 4.0 互換）。
      参考: https://www.meti.go.jp/main/rules.html
    frequency: monthly
    tz: Asia/Tokyo
    missing_policy: "null"                        # 欠測月は null
    freshness_sla_days: 150                       # METI 電力調査統計は 4 ヶ月遅れ（FY2025 確定は 2026-07 頃）
    # ----- 対象ファイル名パターン ---------------------------------------
    # 発電実績テーブル: 2-1-{YEAR}.xlsx or 2-1-H{nn}.xlsx or 2-1-{YEAR}n.xlsx（機械判読版、2025 のみ）
    # 需要実績テーブル: 3-1-{YEAR}.xlsx or 3-1-H{nn}.xlsx
    # 正規表現で抽出する。`n.xlsx` 変種が存在すればそちらを優先（機械判読しやすい）。
    target_patterns:
      generation: "^2-1-(H\\d{2}|\\d{4})n?\\.xlsx$"
      demand:     "^3-1-(H\\d{2}|\\d{4})n?\\.xlsx$"
    # 和暦プレフィックス → 西暦オフセット（filename パース用）
    era_offset:
      H: 1988     # 平成（H28 → 2016）
      R: 2018     # 令和（未使用、現状 filename は西暦直接）
    # スコープ境界（この fiscal year 以降のみを対象に取得）
    min_fiscal_year: 2016
    # 対象シート名（XLSX 内部）。Day 4 で実 XLSX を確認して調整予定。
    sheet_hints:
      generation_total: "総括"                    # 電源別・月次・全国計
      demand_total:     "総括"                    # 電灯・電力・月次・合計
    # 代替シート名（旧レイアウト）
    sheet_aliases:
      generation_total: ["発電実績", "電源別", "発電端", "月別"]
      demand_total:     ["販売", "電灯・電力", "用途別", "電力需要"]
    # ラベル駆動で値を抽出（行ラベルの最初のマッチを採用）
    row_labels:
      gen_total:       ["発電電力量計", "総計", "合計", "発電電力量合計"]
      gen_thermal:     ["火力計", "火力発電計", "火力"]
      gen_hydro:       ["水力計", "水力発電計", "水力"]
      gen_nuclear:     ["原子力"]
      gen_solar:       ["太陽光", "太陽光発電"]
      gen_wind:        ["風力", "風力発電"]
      gen_geothermal:  ["地熱", "地熱発電"]
      gen_biomass:     ["バイオマス", "バイオマス発電"]
      demand_total:    ["販売電力量計", "合計", "総計", "販売電力量合計"]
      demand_lights:   ["電灯"]
      demand_power:    ["電力"]
    # 単位の想定値（XLSX では「(百万 kWh)」「(GWh)」等の揺れあり、fetch 側で正規化）
    unit_canonical: GWh
    # 派生系列の定義（fetch 後に計算）
    derived:
      meti-renewables-share:
        formula: "(solar + wind + geothermal + hydro + biomass) / total * 100"
        numerator_ids:
          - meti-gen-solar
          - meti-gen-wind
          - meti-gen-geothermal
          - meti-gen-hydro
          - meti-gen-biomass
        denominator_id: meti-gen-total
    indicator_ids:
      - meti-gen-total
      - meti-gen-thermal
      - meti-gen-hydro
      - meti-gen-nuclear
      - meti-gen-solar
      - meti-gen-wind
      - meti-gen-geothermal
      - meti-gen-biomass
      - meti-demand-total
      - meti-demand-lights
      - meti-demand-power
      - meti-renewables-share
    # D-011 準拠の indicator 固有メタデータ（12 系列）
    indicators:
      meti-gen-total:
        name: "総発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "発電端ベース。一般送配電＋発電事業者の月合計"
        depends_on: null
      meti-gen-thermal:
        name: "火力発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "LNG・石炭・石油などの合計"
        depends_on: null
      meti-gen-hydro:
        name: "水力発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "一般水力＋揚水水力"
        depends_on: null
      meti-gen-nuclear:
        name: "原子力発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "再稼働状況と強く相関"
        depends_on: null
      meti-gen-solar:
        name: "太陽光発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "FIT/FIP 対象＋非対象"
        depends_on: null
      meti-gen-wind:
        name: "風力発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "陸上＋洋上"
        depends_on: null
      meti-gen-geothermal:
        name: "地熱発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "国内合計"
        depends_on: null
      meti-gen-biomass:
        name: "バイオマス発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "FIT/FIP 主体"
        depends_on: null
      meti-demand-total:
        name: "販売電力量合計（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "電灯＋電力の合計"
        depends_on: null
      meti-demand-lights:
        name: "電灯販売電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "家庭用需要"
        depends_on: null
      meti-demand-power:
        name: "電力販売電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "業務・産業需要"
        depends_on: null
      meti-renewables-share:
        name: "再エネ比率（発電ベース、月次）"
        domain: power
        unit: "%"
        backfill_start: "2012-01"
        aggregation: derived
        notes: "(太陽光＋風力＋地熱＋水力＋バイオマス) / 総発電量 × 100"
        depends_on:
          - meti-gen-solar
          - meti-gen-wind
          - meti-gen-geothermal
          - meti-gen-hydro
          - meti-gen-biomass
          - meti-gen-total
    notes: |
      - 月次公表、約 2 ヶ月遅延（例: 2026-04 時点で 2026-02 分まで）。
      - XLSX ファイルはトップページ results.html から取得。年別・月別ファイルの切替あり。
      - 2012 以前は XLS（旧形式）混在のため、Phase 2-A の backfill は 2012-01 以降のみ対象。
      - ラベル列の揺れ（「火力計」「火力」「火力発電計」など）に対応するため、row_labels はリスト。
      - 単位は「(百万 kWh)」= GWh に正規化（fetch_enecho_power.py で値変換）。
      - meti-renewables-share は他系列から計算される派生指標。D-011 の depends_on を初めて非 null で埋める系列。
      - ライセンス: 政府標準利用規約 2.0（CC BY 4.0 互換）。出典明示が必須。

  occto-capacity:
    name: OCCTO 容量市場 メインオークション約定結果
    publisher: 電力広域的運営推進機関 (OCCTO)
    publisher_url: https://www.occto.or.jp/
    source_url: https://www.occto.or.jp/capacity-market/yoryoshijyo/main/data/
    # ----- Phase D 第 1 期 Day 2 (2026-05-20 午後) 全面書き直し -----------
    # Day 1 (5/20 朝) の scaffold は 6 件のドリフトが発覚し全面修正:
    #   1. index_url: /market-board/market/main-auction/ (404) →
    #                 /capacity-market/yoryoshijyo/main/data/ (正)
    #   2. ファイル形式: PDF/Excel 単一 → ZIP に CSV 1 枚 格納
    #   3. ファイル名: main_auction_YYYY.xlsx → {delivery_fy}_yakujoukekka_csv.zip
    #   4. 主軸: auction_year (オークション開催年) → delivery_fy (実需給年度)
    #   5. スコープ: 2020-2024 メイン 5 回 → FY2024-FY2029 メイン 6 回
    #   6. parse 関数名: parse_auction_excel/_pdf 廃止 → parse_auction_zip_csv 新規
    # 上記は 5/20 午後の probe (FY2024 + FY2028 ZIP) で実構造を完全把握した結果。
    # 詳細: L-061 候補 (scaffold 起草時の実 URL HTTP リーチ確認不足を体系化予定)。
    # --------------------------------------------------------------
    # 容量市場 = 4 年後の供給力 (kW 価値) を取引する市場、OCCTO が運営。
    # 2020 年 7 月にメインオークション初回開催 (FY2024 実需給対象)、以降毎年 1 回開催。
    # 公開データは ZIP に格納された 1 枚の CSV (エリア毎の詳細)。
    # トップページ (実需給年度ごとのファイルリンクが並ぶ統合ページ)
    index_url: https://www.occto.or.jp/capacity-market/yoryoshijyo/main/data/
    # メインオークション約定結果 ZIP の URL テンプレート (実 URL 検証済、FY2024/FY2028 で確認)
    # 注: FY2028 のみ ".../2028_main_yakujoukekka_csv.zip" (中央に "main" が入る)、
    # それ以外 (FY2024/FY2025/FY2026/FY2027/FY2029) は "{fy}_yakujoukekka_csv.zip"。
    # FY2029 だけ別パスに置かれる: .../assets/capacity-market/yoryoshijyo/main/data/index/{fy}_yakujoukekka_csv.zip
    # 動的解決は index_url の HTML を fetch して a[href] を走査することで対応。
    file_url_base: https://www.occto.or.jp/capacity-market/wp-content/themes/occto/documents/
    # ZIP 内 CSV は cp932 (Shift_JIS) エンコード、列構造は以下に固定 (FY2024 + FY2028 で実測):
    #   1. 対象実需給年度          (int, e.g. 2024)
    #   2. エリア                  (str, 北海道/東北/東京/中部/北陸/関西/中国/四国/九州)
    #   3. 約定価格[円/kW]         (int, e.g. 14137)
    #   4. エリア毎の約定容量[kW]  (int, e.g. 5931674)
    #   5. エリア毎の約定総額（経過措置控除後）[円]  (int)
    csv_encoding: cp932
    csv_columns:
      - 対象実需給年度
      - エリア
      - 約定価格[円/kW]
      - エリア毎の約定容量[kW]
      - エリア毎の約定総額（経過措置控除後）[円]
    # エリア日本語名 → indicator_id サフィックス (英数小文字) の mapping
    area_map:
      北海道: hokkaido
      東北: tohoku
      東京: tokyo
      中部: chubu
      北陸: hokuriku
      関西: kansai
      中国: chugoku
      四国: shikoku
      九州: kyushu
    # --- D-011 メタデータ共通項目 ---
    license: occto-terms                          # OCCTO 利用規約 (出典明示で再配布可)
    license_url: https://www.occto.or.jp/info/disclaimer.html
    license_notice: |
      出典: 電力広域的運営推進機関 (OCCTO)「容量市場 メインオークション約定結果」
