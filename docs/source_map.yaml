  estat-trade:
    name: 政府統計の総合窓口（e-Stat）API 普通貿易統計 品別国別表（輸入）
    publisher: 財務省
    publisher_url: https://www.customs.go.jp/toukei/info/index.htm
    source_url: https://www.e-stat.go.jp/
    api_base: "https://api.e-stat.go.jp/rest/3.0/app/json"
    # --- D-011 メタデータ共通項目 ---
    license: estat-terms
    license_url: https://www.e-stat.go.jp/terms-of-use
    license_notice: "出典: 財務省 貿易統計（政府統計の総合窓口 e-Stat）。"
    license_text: |
      財務省 貿易統計（普通貿易統計）。政府統計＝政府標準利用規約 2.0 互換、
      出典明示を条件に商用含む再利用可。e-Stat API 経由で取得。
      参考: https://www.e-stat.go.jp/terms-of-use
    domain: geopolitics
    frequency: annual
    unit: "千円"
    tz: Asia/Tokyo
    missing_policy: "null"
    aggregation: annual_sum
    backfill_start: "2016-01-01"
    # 年次確定は対象年の翌年11月頃、確々報はそれ以前に公表。値は YYYY-01-01 に格納するため
    # 鮮度は publication lag を見込み約25ヶ月（直近2年が欠落した場合のみ警告）に設定。
    freshness_sla_days: 760
    # cat02=140（合計_金額、単位=千円）= 年間合計金額を抽出。
    value_cat02_code: "140"
    # 「確定/確速 品別国別表（輸入）」年次統計表。各表の HS コードは prefix で実行時解決（L-062、HS 改正耐性）。
    # 2026-06-11 実 API（getStatsList searchWord「貿易統計 品別国別 輸入」）で特定・検証。
    tables:
      - stats_data_id: "0003313966"   # 確定 品別国別表(輸入) 2016年～2020年
      - stats_data_id: "0003425294"   # 確速 品別国別表(輸入) 2021-2024確定 + 2025確々報
    # 燃料 → HS 見出し prefix。2026-06-11 getMetaInfo で実コードを確認:
    #   原油 2709 = 270900100/270900900、LNG 271111 = 271111000、
    #   石炭 2701 = 270111000(無煙炭)/270112*(瀝青炭)/270119*(その他)/270120000(練炭等)。
    fuels:
      crude: { hs_prefixes: ["2709"],   name_ja: "原油" }
      lng:   { hs_prefixes: ["271111"], name_ja: "LNG（液化天然ガス）" }
      coal:  { hs_prefixes: ["2701"],   name_ja: "石炭" }
    # 相手国 area コード（getMetaInfo 検証 2026-06-11）→ region 用 ISO2 大文字。
    country_codes:
      "50137": SA   # サウジアラビア
      "50147": AE   # アラブ首長国連邦
      "50138": KW   # クウェート
      "50140": QA   # カタール
      "50141": OM   # オマーン
      "50304": US   # アメリカ合衆国
      "50601": AU   # オーストラリア
      "50113": MY   # マレーシア
      "50224": RU   # ロシア
      "50118": ID   # インドネシア
      "50602": PG   # パプアニューギニア
      "50116": BN   # ブルネイ
      "50302": CA   # カナダ
      "50551": ZA   # 南アフリカ共和国
    # 燃料別 対象相手国（area コード）。2025年確々報の輸入額シェア上位の主要源国を採用。
    # total 系列は全相手国合算（region=WORLD）で、源国集中・中東依存度の分母に使う。
    fuel_countries:
      crude: ["50147", "50137", "50138", "50140", "50141", "50304"]
      lng:   ["50601", "50113", "50224", "50304", "50118", "50140", "50602", "50116"]
      coal:  ["50601", "50118", "50304", "50302", "50551", "50224"]
    notes: |
      日本のエネルギー輸入 源国別 金額（原油/LNG/石炭、年次、単位=千円）。geopolitics seed。
      普通貿易統計「確定/確速 品別国別表（輸入）」を 0003313966(2016-2020)+0003425294(2021-2025)で結合。
      各燃料の輸入額は HS 見出し配下の全 9 桁コードを合算（原油=2709、LNG=271111、石炭=2701）。
      系列は jp-import-value-{crude|lng|coal}-{cc}（相手国別、region=ISO2）+ -total（全相手国合算、region=WORLD）。
      L-062: HS コード・国コードは getStatsList/getMetaInfo で実確認（推測禁止、2026-06-11）。
      L-063: 財務省 貿易統計＝政府標準利用規約、出典明記で商用含む再利用可（GO）。
      検証(2026-06-11): 2025年 原油 計≈9.62兆円(UAE43%/サウジ40%)、LNG 計≈5.70兆円(豪40%)、石炭 計≈3.34兆円(豪67%)。
      2025年は確々報（後日確定値に改定され得る）。確定値は翌年11月頃に再公表。
    indicator_ids:
      - jp-import-value-crude-ae
      - jp-import-value-crude-sa
      - jp-import-value-crude-kw
      - jp-import-value-crude-qa
      - jp-import-value-crude-om
      - jp-import-value-crude-us
      - jp-import-value-crude-total
      - jp-import-value-lng-au
      - jp-import-value-lng-my
      - jp-import-value-lng-ru
      - jp-import-value-lng-us
      - jp-import-value-lng-id
      - jp-import-value-lng-qa
      - jp-import-value-lng-pg
      - jp-import-value-lng-bn
      - jp-import-value-lng-total
      - jp-import-value-coal-au
      - jp-import-value-coal-id
      - jp-import-value-coal-us
      - jp-import-value-coal-ca
      - jp-import-value-coal-za
      - jp-import-value-coal-ru
      - jp-import-value-coal-total

  fit:
    name: 資源エネルギー庁「なっとく！再生可能エネルギー」FIT 買取価格
    publisher: 資源エネルギー庁（METI）
    publisher_url: https://www.enecho.meti.go.jp/
    # 過去（2012-2025 年度）と現行（2026 年度以降）の 2 ページから HTML 表を抽出。
    # source_url は過去ページ（2012-2025 の大半の出典）。2026 は fit_kakaku.html。
    source_url: https://www.enecho.meti.go.jp/category/saving_and_new/saiene/kaitori/kakaku.html
    past_url: https://www.enecho.meti.go.jp/category/saving_and_new/saiene/kaitori/kakaku.html
    current_url: https://www.enecho.meti.go.jp/category/saving_and_new/saiene/kaitori/fit_kakaku.html
    # --- D-011 メタデータ共通項目 ---
    license: meti-terms                            # 政府標準利用規約 2.0 互換（enecho-power と同じ）
    license_url: https://www.meti.go.jp/main/rules.html
    license_notice: "出典: 資源エネルギー庁「なっとく！再生可能エネルギー」FIT・FIP制度 買取価格。政府標準利用規約 2.0 に従い、出典明示を条件に利用可。"
    license_text: |
      経済産業省（METI）資源エネルギー庁 公表資料。政府標準利用規約 2.0（CC BY 4.0 互換）。
      出典明示を条件に商用含む再利用可。L-063 = GO。
      参考: https://www.meti.go.jp/main/rules.html
    domain: regulation
    frequency: annual
    unit: "円/kWh"
    tz: Asia/Tokyo
    missing_policy: "null"
    aggregation: raw
    backfill_start: "2012-04-01"
    # 翌年度の価格は調達価格等算定委員会を経て年度末に告示。年次更新のため SLA は約 18 ヶ月。
    freshness_sla_days: 540
    # ----- 抽出方式（fetch_fit_price.py） --------------------------------
    # ページは UTF-8 の HTML 表。h3「YYYY年度の価格表」(平成/令和は西暦換算) で年度ブロックを区切り、
    # 各電源の <table> を colspan/rowspan 展開した grid 上で「列見出しキーワード + 除外 + pick」により
    # 代表区分の調達価格（円/kWh）を抽出する（L-062: 価格はハードコードせず live HTML から取得）。
    # 列構成が年度で激変するため、年により異なる規模区分（例: 太陽光 10kW以上 / 10kW以上50kW未満）を
    # キーワード優先順で吸収する。2026 の地熱・中小水力 等の「出力に応じて連続的に変化」区分や
    # 入札区分（クリーンな単価なし）は取得対象外（無理に値を作らない）。
    notes: |
      日本の再エネ FIT 制度 電源別 調達価格（円/kWh、年度別、date=YYYY-04-01）。regulation seed（12 ドメイン最後）。
      過去ページ kakaku.html（2012-2025）+ 現行ページ fit_kakaku.html（2026）。
      系列は fit-price-{solar-business|wind-onshore|geothermal|biomass-wood|hydro-small}。
      代表区分: 事業用太陽光 10kW以上(非入札) / 陸上風力(非入札・非リプレース) / 地熱 15,000kW未満新設 /
      一般木質バイオマス(入札対象外) / 中小水力 200kW未満新設。原則税抜（事業用調達価格）。
      地熱 2026 は 1,000-15,000kW が連続価格化したため未取得（14 年分）。他 4 系列は 2012-2026（15 年分）。
      検証(2026-06-12): 事業用太陽光 40円(2012)→10円(2025)→9.9円(2026)、陸上風力 22→13→14、地熱 40 固定、
      一般木質バイオマス 24 固定、中小水力 34 固定。FIT 履歴と整合（大幅削減は太陽光/風力のみ）。
      L-063: 政府標準利用規約、出典明記で商用含む再利用可（GO、license=meti-terms）。
    indicator_ids:
      - fit-price-solar-business
      - fit-price-wind-onshore
      - fit-price-geothermal
      - fit-price-biomass-wood
      - fit-price-hydro-small
    indicators:
      fit-price-solar-business:
        name: "FIT 調達価格 事業用太陽光（10kW以上・非入札）"
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2012-04-01"
        aggregation: raw
        notes: "事業用太陽光の非入札・非屋根の代表区分（年により 10kW以上 / 10kW以上50kW未満 等）。上期(4-9月)額。原則税抜。"
        depends_on: null
      fit-price-wind-onshore:
        name: "FIT 調達価格 陸上風力（非入札・非リプレース）"
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2012-04-01"
        aggregation: raw
        notes: "陸上風力の非入札・非リプレースの代表区分（年により 20kW以上 / 陸上風力 / 陸上風力50kW未満）。大規模は近年入札移行のため非入札区分。"
        depends_on: null
      fit-price-geothermal:
        name: "FIT 調達価格 地熱（15,000kW未満・新設）"
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2012-04-01"
        aggregation: raw
        notes: "地熱 15,000kW未満・新設（リプレース除く）。2026 は連続価格化のため未取得。原則税抜。"
        depends_on: null
      fit-price-biomass-wood:
        name: "FIT 調達価格 一般木質バイオマス（入札対象外）"
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2012-04-01"
        aggregation: raw
        notes: "一般木質バイオマス（固体燃料）の入札対象外の代表区分。近年は 10,000kW未満（10,000kW以上は入札）。原則税抜。"
        depends_on: null
      fit-price-hydro-small:
        name: "FIT 調達価格 中小水力（200kW未満・新設）"
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2012-04-01"
        aggregation: raw
        notes: "中小水力 200kW未満・新設（既設導水路活用＝リプレース除く）。原則税抜。"
        depends_on: null

  jepx-nonfossil:
    name: JEPX 非化石価値取引市場 オークション結果
    publisher: 一般社団法人 日本卸電力取引所 (JEPX)
    publisher_url: https://www.jepx.jp/
    source_url: https://www.jepx.jp/nonfossil/market-data/
    market_page: https://www.jepx.jp/nonfossil/market-data/
    # ----- 取得エンドポイント（L-063 レポート §A-1 §1 で実測特定）------------
    # 市場ページの JS (js/nonfossil-market-data.js) が叩いている 2 本をそのまま使う。
    # spot と違い POST(_download.php) ではなく GET で CSV が返る。
    #   1) 収録年度レンジ: 応答本文 "2025,2017"（最新年度, 最古年度）
    #   2) 年度別オークション結果 CSV
    # ★ 取得範囲は 1) の応答から決める（年度をハードコードしない）。
    #   年度ローテーションを公式レスポンスで検知できる = Pink Sheet 型サイレント停滞の予防。
    year_range_url: https://www.jepx.jp/js/get_graph_year.php?dir=nf_summary
    csv_url_template: https://www.jepx.jp/js/csv_read.php?dir=nf_summary&file=nf_summary_{fy}.csv
    post_dir: nf_summary
    # --- D-011 メタデータ共通項目 ---
    license: jepx-terms                            # 既存識別子。新規追加不要（jepx-spot 10 系列と同条件）
    license_url: https://www.jepx.jp/disclaimer/
    license_notice: "出典: 一般社団法人 日本卸電力取引所 (JEPX) 非化石価値取引市場 オークション結果。JEPX 免責事項・著作権「当ウェブサイトに掲載されている内容に関する著作権は本所にあります」「出所を明示した上でご利用下さい」に従い、出所明示を条件に利用。"
    license_text: |
      JEPX 公開データ。免責事項・著作権ページ（https://www.jepx.jp/disclaimer/）に
      「当ウェブサイトに掲載されている内容に関する著作権は本所にあります」
      「出所を明示した上でご利用下さい」
      「ご利用条件および公開されている情報の変更・削除は原則として予告なしに行います」とある。
      政府標準利用規約でも CC BY でもない JEPX 独自条件。出所明示を条件に利用。
      L-063 = GO（jepx-spot 10 系列と完全に同一条件のため新規ライセンスリスクなし）。
    domain: regulation
    frequency: quarterly
    tz: Asia/Tokyo
    missing_policy: "null"                         # 未開催回は行を作らない（"-" は観測なし）
    aggregation: raw
    # 年 4 回オークション（間隔 約 92 日）。L-063 レポート推奨値。
    # check_staleness.py の 2x ハードゲート = 240 日 ≒ 約定 2 回分の欠落で赤くなる。
    freshness_sla_days: 120
    # ----- サニティ枠（fetch_nonfossil.check_sanity_bands が書き出し前に検査）-----
    # 目的は「約定量(1e8 オーダー)を価格として書き込む」類の列取り違えを、
    # ゴミが data/processed に着地する前に落とすこと。
    # **最新観測** が枠外なら書き出し中止 + exit 1。過去観測の枠外は warning のみ
    # （下限/上限は制度改正で動いており、現行の枠を過去に遡って当てるのは誤り）。
    # 制度改正で枠が動いてもコード修正なしで追随できるよう yaml 側に持つ。
    columns:
      # 元 CSV の列構造（全 FY2017-2025 の 9 ファイルで同一と確認, L-062）
      - 年度
      - 開催回          # {1,2,3,4}。ただし FY2017 のみ "通年"
      - 商品            # FIT / 非FIT(再エネ指定) / 非FIT(再エネ指定なし) の 3 種で固定
      - 約定日          # "YYYY/M/D"。未開催回は "-"
      - 約定総量(kWh)
      - 約定価格(円/kWh)
      - 約定最高価格(円/kWh)
      - 約定最低価格(円/kWh)
      - 入札会員数
      - 約定会員数
      - 売り入札量(kWh)
      - 買い入札量(kWh)
    notes: |
      日本の非化石証書 3 類型 × (約定価格, 約定総量) の四半期系列。regulation ドメイン拡充（5 → 11 系列）。
      L-063 事前確認: energy-data-platform/docs/l063-check-energy-gx-2026-08-07.md §A-1 = 🟢 GO。
      date は「約定日」をそのまま使う。同一開催回でも商品ごとに約定日が 1 日ずつずれる
      （例 FY2025 第4回: 非FIT指定なし 5/20 / 非FIT指定 5/21 / FIT 5/22）ため系列間で日付は揃わない。
      実データ調査（全 9 年度走査, L-062）で確定した仕様:
        - ヘッダ・商品名は 9 年度すべて同一。表記ゆれなし。
        - 未開催セルは空文字ではなく "-"。行自体は存在し全列が "-" になる → 約定日が "-" の行はスキップ。
        - 非FIT 2 種は FY2020 第 2 回が初回（FY2017-2019 + FY2020 第 1 回は全て "-"）。
        - FY2017 のみ開催回が "通年"（年 1 回開催）。数値前提のパースにしない。
        - **FY2021 第 1 回だけ FIT が "-"** → 欠落は系列先頭だけでなく途中にも出る。行単位で判定する。
      価格の推移（実測）: FIT 1.3円(FY2017-2020) → 0.3円台(FY2021-2022) → 0.4円台(FY2023-2025)。
      非FIT 2 種は全観測が 0.6〜1.3 円のレンジ内。直近は上下限に張り付く回が多く、
      記事化では「需給で動く市場価格」ではなく「制度上下限の中での約定」として扱うこと。
      レポートが密度版として挙げた入札倍率（買い入札量÷約定総量）は不採用:
      FIT は 買い入札量 == 約定総量 が恒常成立し倍率が常に 1.000 の定数系列になるため。
    indicator_ids:
      - nonfossil-cert-fit-price
      - nonfossil-cert-nonfit-re-price
      - nonfossil-cert-nonfit-price
      - nonfossil-cert-fit-volume
      - nonfossil-cert-nonfit-re-volume
      - nonfossil-cert-nonfit-volume
    indicators:
      nonfossil-cert-fit-price:
        name: 非化石証書 約定価格 FIT
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2017-04-01"
        aggregation: raw
        sanity_min: 0.4                            # 現行の最低価格
        sanity_max: 4                              # 現行の上限価格
        notes: "FIT 非化石証書の回次約定価格。FY2017 は通年 1 回のみ、FY2021 第1回は未開催。最低価格は制度改正で 1.3→0.3→0.4 円と変遷しており、FY2021-2022 の 0.3 円台は当時の下限（現行枠 0.4 円の枠外だが正しい実績値）。"
        depends_on: null
      nonfossil-cert-nonfit-re-price:
        name: 非化石証書 約定価格 非FIT（再エネ指定）
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2020-04-01"
        aggregation: raw
        sanity_min: 0.6
        sanity_max: 1.3
        notes: "非FIT 再エネ指定の回次約定価格。FY2020 第2回が初回（FY2017-2019 と FY2020 第1回は未開催）。全観測が 0.6〜1.3 円のレンジ内。"
        depends_on: null
      nonfossil-cert-nonfit-price:
        name: 非化石証書 約定価格 非FIT（再エネ指定なし）
        domain: regulation
        unit: "円/kWh"
        backfill_start: "2020-04-01"
        aggregation: raw
        sanity_min: 0.6
        sanity_max: 1.3
        notes: "非FIT 再エネ指定なしの回次約定価格。FY2020 第2回が初回（FY2017-2019 と FY2020 第1回は未開催）。全観測が 0.6〜1.3 円のレンジ内。"
        depends_on: null
      nonfossil-cert-fit-volume:
        name: 非化石証書 約定総量 FIT
        domain: regulation
        unit: kWh
        backfill_start: "2017-04-01"
        aggregation: raw
        notes: "FIT 非化石証書の回次約定総量。FIT は売り超過が恒常的で、買い入札量が全量約定する（買い入札量 == 約定総量）。"
        depends_on: null
      nonfossil-cert-nonfit-re-volume:
        name: 非化石証書 約定総量 非FIT（再エネ指定）
        domain: regulation
        unit: kWh
        backfill_start: "2020-04-01"
        aggregation: raw
        notes: "非FIT 再エネ指定の回次約定総量。FY2020 第2回が初回。"
        depends_on: null
      nonfossil-cert-nonfit-volume:
        name: 非化石証書 約定総量 非FIT（再エネ指定なし）
        domain: regulation
        unit: kWh
        backfill_start: "2020-04-01"
        aggregation: raw
        notes: "非FIT 再エネ指定なしの回次約定総量。FY2020 第2回が初回。"
        depends_on: null

  nbs-pmi:
    name: 中国 国家統計局 製造業 PMI（NBS 官製）
    publisher: National Bureau of Statistics of China (NBS) / China Federation of Logistics & Purchasing (CFLP)
    publisher_url: https://www.stats.gov.cn/english/
    # 月次の Purchasing Managers' Index 英語版プレスリリースのインデックス。
    # スクリプトはこのページからアンカー名 "Purchasing Managers' Index" のリンクを引き当て、
    # 各リリース内 Table 1 (China's Manufacturing PMI and Sub-indexes) の 13 ヶ月分を抽出する。
    index_url: "https://www.stats.gov.cn/english/PressRelease/"
    # --- D-011 メタデータ共通項目 ---
    license: nbs-terms
    license_url: https://www.stats.gov.cn/english/
    license_notice: "Source: National Bureau of Statistics of China (NBS) / CFLP. Reuse permitted with citation."
    license_text: |
      中国国家統計局の英語版プレスリリース。再利用は出典明示を条件に可。
      参考: https://www.stats.gov.cn/english/
    frequency: monthly
    tz: Asia/Shanghai
    missing_policy: "null"
    # 翌月 1 日朝（北京時間 09:30）に前月分を公表。最新リリースに過去 13 ヶ月の表が同梱されるため、
    # 通常運用では毎月初に 1 回叩けば直近値が更新される。45 日マージン。
    freshness_sla_days: 45
    indicator_ids:
      - china-nbs-mfg-pmi
    indicators:
      china-nbs-mfg-pmi:
        name: "中国 製造業 PMI（NBS 官製、季節調整済）"
        domain: international
        unit: "index"
        backfill_start: "2025-04-01"
        aggregation: raw
        notes: "stats.gov.cn 英語版 Purchasing Managers' Index 月次リリース Table 1 の PMI 列。50 を境界に >50=拡張 / <50=収縮。Caixin PMI は S&P Global proprietary のため不採用 (L-063, 2026-05-27)。FRED に NBS PMI 直系列は存在せず、NBS 英語版プレスリリースから直接抽出。各リリースに過去 13 ヶ月のテーブルが同梱され、月次運用で過去分は dedup で安定化"
        depends_on: null
    notes: |
      - 英語版 PressRelease トップから anchor text に "Purchasing Managers' Index" を含むリンクを最新 1 件引いてフォロー。
      - リリース URL は /english/PressRelease/{YYYYMM}/t{YYYYMMDD}_{ID}.html 形式だが ID は予測不能なため index 経由で動的解決。
      - 各リリース本文 Table 1 (China's Manufacturing PMI and Sub-indexes, Seasonally Adjusted) は直近 13 ヶ月分を含む。
        年マーカー "YYYY-MonthName" 行があり、以降は MonthName のみ繰り返す。次の "YYYY-MonthName" が次年。
      - 列順: PMI / Production Index / New Order Index / Raw Materials Inventory Index / Employment Index / Supplier Delivery Time Index。
        headline PMI は month label の直後の 1 つ目の数値。
      - 過去 13 ヶ月を超える backfill には過去のプレスリリースを別途辿る必要があるが、月次運用で自然に時系列が伸びる。
      - ディレクトリリスト (/PressRelease/202604/ 等) は 403 で取れないため、index ページの "Purchasing Managers' Index" アンカー経由が唯一の発見手段。
      - L-063 判断 (2026-05-27): FRED API series_search で "China Manufacturing PMI" / "China PMI" / "NBS Manufacturing" を全件確認、NBS 製造業 PMI の公開系列なし
        （OECD Business Tendency Surveys composite indicator は方法論が異なり PMI ではない）。NBS 直スクレイプを採用。
      - L-062 smoke (2026-05-27): 2026-04 PMI = 50.3、2026-03 = 50.4、2025-04 = 49.0 で >50 拡張/<50 収縮の妥当帯。

  eu-ets:
    name: "EU ETS data from EUTL (European Environment Agency)"
    source_name: "EU ETS data from EUTL (European Environment Agency)"
    publisher: European Environment Agency (EEA)
    publisher_url: https://www.eea.europa.eu/
    source_url: https://www.eea.europa.eu/en/datahub/datahubitem-view/98f04097-26de-4fca-86c4-63834818c0c0
    # datahub.io ミラー（安定 r-link、追加加工は ODC-PDDL-1.0）。2 本の CSV を 1 リクエストずつ取得。
    #   Family A: 部門別 EU 集計（重複排除済み・Mt 単位）
    #   Family B: 国 × 部門 × metric の原票（約 8MB）
    csv_url_sector: "https://datahub.io/core/eu-emissions-trading-system/_r/-/data/eu-ets-sector-emissions.csv"
    csv_url_full: "https://datahub.io/core/eu-emissions-trading-system/_r/-/data/eu-ets.csv"
    # --- D-011 メタデータ共通項目 ---
    license: eea-terms
    license_url: https://www.eea.europa.eu/legal/copyright
    license_notice: "Source: EU Emissions Trading System (EU ETS) data from EUTL, European Environment Agency / DG-CLIMA. Re-use permitted with attribution. Processed package: ODC-PDDL-1.0 (datahub.io)."
    license_text: |
      EEA 再利用ポリシー（出典明記で商用再利用可）。datahub.io の追加加工分は
      Open Data Commons Public Domain Dedication and License (ODC-PDDL-1.0)。
      L-063 (2026-06-01): 公表元 EEA(EUTL)、出典明記で商用再利用可、安定 r-link で自動取得可を確認済み。
    frequency: annual
    domain: esg
    unit: "Mt-CO2e"
    tz: UTC
    missing_policy: "null"
    # 年次。前年分の検証排出量は翌年中頃（4 月頃）に公表 → 年次 + 公開ラグで緩め設定。
    freshness_sla_days: 400
    backfill_start: "2005-01-01"
    # Family A: activity code -> slug マップ。未マップ部門は fetch script が name から kebab 導出してログ出力。
    sector_slug_map:
      "10": aviation
      "20": combustion
      "21": refining
      "24": iron-steel
      "29": cement
      "30": lime
      "36": paper
      "42": chemicals
    # Family B: 検証排出量フィルタで除外する特殊 country_code（実在国以外）。
    #   XI=北アイルランド（Windsor 枠組みの行政コード）。Innovation/Modernisation Fund / NER 300 / RRF 等の
    #   ファンド行は 2.1 検証排出量サブセットには出現しないが、ISO2 正規表現 + 本リストで安全側に除外。
    country_exclude:
      - XI
    # Family B: ISO2 -> 日本語国名（name 用）。未登録コードは id にフォールバックしてログ出力。
    country_names:
      AT: オーストリア
      BE: ベルギー
      BG: ブルガリア
      CY: キプロス
      CZ: チェコ
      DE: ドイツ
      DK: デンマーク
      EE: エストニア
      ES: スペイン
      FI: フィンランド
      FR: フランス
      GB: 英国
      GR: ギリシャ
      HR: クロアチア
      HU: ハンガリー
      IE: アイルランド
      IS: アイスランド
      IT: イタリア
      LI: リヒテンシュタイン
      LT: リトアニア
      LU: ルクセンブルク
      LV: ラトビア
      MT: マルタ
      NL: オランダ
      "NO": ノルウェー   # YAML 1.1 で NO は bool False に化けるためクォート必須
      PL: ポーランド
      PT: ポルトガル
      RO: ルーマニア
      SE: スウェーデン
      SI: スロベニア
      SK: スロバキア
    # D-011 準拠の indicator 固有メタデータ（Family A 8 + Family B 31 + Family C 2 + Family D 31 = 72 系列）。
    # 系列数・件数はハードコードではなく実データから確定する（L-013）。本 dict は name と
    # 個別 override の出典であり、実際に書き出す系列は fetch_eu_ets.py が実 CSV から決定する。
    indicators:
      # --- Family A: EU 全体 部門別 検証排出量（aggregation=raw, region=EU-ETS）---
      eu-ets-emissions-aviation:   { name: "航空 EU ETS 検証排出量",                              domain: esg, unit: "Mt-CO2e", backfill_start: "2012-01-01", aggregation: raw, notes: "EU ETS sector emissions: 10 Aviation（EU 集計・検証排出量）。航空は 2012- から。", depends_on: null }
      eu-ets-emissions-combustion: { name: "燃料燃焼（発電・熱）EU ETS 検証排出量",               domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: raw, notes: "EU ETS sector emissions: 20 Combustion of fuels（発電・熱の最大部門）。", depends_on: null }
      eu-ets-emissions-refining:   { name: "鉱物油精製 EU ETS 検証排出量",                        domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: raw, notes: "EU ETS sector emissions: 21 Refining of mineral oil。", depends_on: null }
      eu-ets-emissions-iron-steel: { name: "銑鉄・鉄鋼 EU ETS 検証排出量",                        domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: raw, notes: "EU ETS sector emissions: 24 Production of pig iron or steel。", depends_on: null }
      eu-ets-emissions-cement:     { name: "セメントクリンカ EU ETS 検証排出量",                  domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: raw, notes: "EU ETS sector emissions: 29 Production of cement clinker。", depends_on: null }
      eu-ets-emissions-lime:       { name: "石灰・ドロマイト/マグネサイト焼成 EU ETS 検証排出量", domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: raw, notes: "EU ETS sector emissions: 30 Production of lime, or calcination of dolomite/magnesite。", depends_on: null }
      eu-ets-emissions-paper:      { name: "紙・板紙 EU ETS 検証排出量",                          domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: raw, notes: "EU ETS sector emissions: 36 Production of paper or cardboard。", depends_on: null }
      eu-ets-emissions-chemicals:  { name: "バルク化学品 EU ETS 検証排出量",                      domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: raw, notes: "EU ETS sector emissions: 42 Production of bulk chemicals。", depends_on: null }
      # --- Family B: 加盟国別 合計検証排出量（aggregation=annual_sum, region=ISO2, leaf 部門合計）---
      eu-ets-emissions-country-at: { name: "オーストリア EU ETS 検証排出量（全部門合計）",   domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: annual_sum, notes: "eu-ets.csv 2.1 EU-ETS Verified Emission を国×年で合計（rollup -99 除外、leaf 部門合計）。country=AT", depends_on: null }
      eu-ets-emissions-country-be: { name: "ベルギー EU ETS 検証排出量（全部門合計）",       domain: esg, unit: "Mt-CO2e", backfill_start: "2005-01-01", aggregation: annual_sum, notes: "eu-ets.csv 2.1 EU-ETS Verified Emission を国×年で合計（rollup -99 除外、leaf 部門合計）。country=BE", depends_on: null }
