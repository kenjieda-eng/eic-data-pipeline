      ember-share-bioenergy-gb:   { name: "英国 発電量シェア バイオ (%)",   domain: international, unit: "%", backfill_start: "2015-01-01", aggregation: monthly_mean, notes: "Ember monthly: United Kingdom, Electricity generation / Fuel / Bioenergy (%)", depends_on: null }
    notes: |
      - long-format CSV 1 本で全国全変数を取得。Area type='Country or economy' で国別を絞る。
      - 主要 5 ヶ国 (日/米/中/独/英) × {demand, total generation, CO2 intensity} 3 指標 = 15 系列。
      - 加えて電源種別 share of generation (%): 5 ヶ国 × 7 fuel (coal/gas/nuclear/solar/wind/hydro/bioenergy) = 35 系列。
        #67 CO2 強度の「なぜ＝電源構成」を見せる主要国 電源構成比較 Insight の素材。
        Subcategory='Fuel' / Unit='%' で抽出。月ごとに 7 fuel の和は概ね 100% (Other Fossil/Other Renewables 除外分の差分)。
      - 米国は Area 列で "United States of America"。"United States" は存在しないため注意。
      - 通常モードでも全期間 (1999-01 ~ 最新月) を 1 リクエストで取得 → write_processed が key_cols で dedup。
      - 観測は概ね月次データ確定後 2-3 ヶ月遅延で更新される (freshness_sla_days=90 マージン)。

  estat:
    name: 政府統計の総合窓口（e-Stat）API
    publisher: 総務省統計局
    publisher_url: https://www.e-stat.go.jp/
    source_url: https://www.e-stat.go.jp/
    # 認証必須（無料登録で appId 発行）。コードからは os.environ["ESTAT_APP_ID"] で読む。
    api_base: "https://api.e-stat.go.jp/rest/3.0/app/json"
    # --- D-011 メタデータ共通項目 ---
    license: estat-terms
    license_url: https://www.e-stat.go.jp/terms-of-use
    license_notice: "出典: 政府統計の総合窓口（e-Stat）。"
    license_text: |
      e-Stat 利用規約。出典明示を条件に再利用可（政府標準利用規約 2.0 互換）。
      参考: https://www.e-stat.go.jp/terms-of-use
    frequency: monthly
    tz: Asia/Tokyo
    missing_policy: "null"
    # CPI は翌月下旬・IIP は速報が翌々月末。2020 基準時系列データは半年〜年単位で再公開されるため
    # 半年マージンに設定。
    freshness_sla_days: 180
    # 2026-05-27 実 API 探索（getStatsList + getMetaInfo）で確定した統計表 ID と分類コード。
    # ハードコード推測ではなく、L-062 に従い実 API で検証してから採用。
    indicator_ids:
      - jpn-cpi-yoy
      - jpn-industrial-production
    indicators:
      jpn-cpi-yoy:
        name: "日本 消費者物価指数 総合 前年同月比"
        domain: economy
        unit: "%"
        backfill_start: "1971-01-01"
        aggregation: raw
        notes: "e-Stat 統計表 0003427113（2020 年基準消費者物価指数）から tab=3 (前年同月比) / cat01=0001 (総合) / area=00000 (全国) を抽出。総務省統計局が翌月下旬に確報を公表"
        depends_on: null
        # e-Stat API パラメータ
        stats_data_id: "0003427113"
        cd_tab: "3"
        cd_cat01: "0001"
        cd_area: "00000"
      jpn-industrial-production:
        name: "日本 鉱工業生産指数（2020=100）"
        domain: economy
        unit: "index (2020=100)"
        backfill_start: "2018-01-01"
        aggregation: raw
        notes: "e-Stat 統計表 0004052181（鉱工業生産・出荷・在庫指数 業種別原指数【月次】 付加価値額生産（2020＝100.0））から cat01=0001000 (鉱工業計、業種別の親項目) を抽出。原指数（非季節調整）。経産省 METI が速報・確報を翌々月に公表、e-Stat 時系列表は survey 年単位で再公開され表 ID がローテーションする（直近スナップ id=0004052181, open=2026-05-19, survey=2025、データ末端は 2026-03）。旧 ID 0004015804 は 2026-06 に STATUS=300 で消滅、getStatsList で後継を再特定（L-062、2026-06-06）"
        depends_on: null
        # 2026-06-06: 旧 0004015804 が STATUS=300 で消滅 → getStatsList（searchWord 鉱工業 生産 業種別 月次）で
        # 後継 0004052181（業種別原指数【月次】付加価値額生産 2020＝100.0）を再特定。cat01=0001000（鉱工業）は新表でも不変（L-062）。
        stats_data_id: "0004052181"
        cd_cat01: "0001000"
        # 2020 基準時系列データは monthly 公開ではなく年単位アーカイブ。約 18 ヶ月マージン
        freshness_sla_days: 540
    notes: |
      - getStatsData JSON で 1 系列ずつ取得（複数系列の同時取得は不可、別 cdCat01 同一表は可）。
      - 認証必須。ESTAT_APP_ID 未設定時はログのみ吐いて他系列を止めない（continue-on-error 互換）。
      - CPI 表 0003427113 は 1970-01 から（2020 年基準は遡及計算済）。IIP 0004052181 は 2018-01 から。
      - IIP 表 ID はローテーションする（survey 年単位で再公開→旧 ID 消滅 STATUS=300）。消滅時は getStatsList
        （searchWord「鉱工業 生産 業種別 月次」）で「業種別原指数【月次】付加価値額生産（2020＝100.0）」の最新 open 版を再特定する。
      - 時間軸コードは name に "YYYYMM"（6 桁数字）の月次値、"YYYY年度" の年度集計、"付加生産ウエイト" などのウエイト値が混在する。月次抽出時は name が YYYYMM 6 桁数字の値のみを採用。
      - 数値文字列の特殊値: "-" / "..." / "" / "X" 等は NaN として扱う。
      - L-062 検証 (2026-05-27): CPI 直近 2026M04=1.4%, 2026M03=1.5%。
      - L-062 再検証 (2026-06-06): 旧 IIP 0004015804=STATUS=300 消滅 → 後継 0004052181 採用。IIP 直近 2026M03=112.6, 2026M02=97.9, 2026M01=95.0（妥当帯）。

  estat-population:
    name: 政府統計の総合窓口（e-Stat）API 人口推計 都道府県別
    publisher: 総務省統計局
    publisher_url: https://www.e-stat.go.jp/
    source_url: https://www.e-stat.go.jp/
    api_base: "https://api.e-stat.go.jp/rest/3.0/app/json"
    # --- D-011 メタデータ共通項目 ---
    license: estat-terms
    license_url: https://www.e-stat.go.jp/terms-of-use
    license_notice: "出典: 政府統計の総合窓口（e-Stat）。"
    license_text: |
      e-Stat 利用規約。出典明示を条件に再利用可（政府標準利用規約 2.0 互換）。
      参考: https://www.e-stat.go.jp/terms-of-use
    domain: population
    frequency: annual
    unit: "千人"
    tz: Asia/Tokyo
    missing_policy: "null"
    aggregation: raw
    backfill_start: "2016-10-01"
    # 人口推計 都道府県 年齢3区分表は 2024 年版が最新（各年10月1日現在）。約 13 ヶ月マージン。
    # L-065 (2026-08-05): 2025-10-01 は「人口推計」ではなく令和7年国勢調査の基準日のため、
    # このセクションからは 2025 年値が永久に出ない（下の notes 参照）。それでも SLA は 400 のまま
    # 据え置く。2×400=800 日 → hard gate は 2026-12-10 に赤化するが、後継データ（国勢調査
    # 人口等基本集計）の公表予定は 2026-09 末であり、gate 赤化はその 2 ヶ月超過を示す
    # 「正しい発火」になる。ここを緩めると L-064 (Pink Sheet) と同じ「警告を黙らせる」誤りになる。
    freshness_sla_days: 400
    # 採用コード（getMetaInfo 検証 2026-06-03、L-062）。男女計=000 / 総人口=001（外国人含む）。
    sex_code: "000"
    poptype_code: "001"
    # 人口推計 都道府県別「各年10月1日現在」統計表。cat02/cat03 の割当が表で入れ替わるため
    # fetch_estat.py は実行時に分類名で次元 @id を解決する（cdCatNN 位置をハードコードしない）。
    # 表は国勢調査サイクル (5 年) 単位でローテーションし、センサス年 (2015 / 2020 / 2025) は
    # 「推計」ではなく国勢調査そのものが値を持つため、人口推計側には現れない。
    #   0004021110 = 2016-2020（2015 センサス後の推計 5 年分）
    #   0003448225 = 2021-2024（2025 センサス直前まで。2025 は入らない = 4 年分で確定）
    tables:
      - stats_data_id: "0004021110"   # 2016-2020（cat02=人口 / cat03=年齢3区分）
      - stats_data_id: "0003448225"   # 2021-2024（cat02=年齢3区分 / cat03=人口）
    # 年齢3区分 → 指標。total=000 総数 / working=002 15～64歳 / 65over=003 65歳以上。
    metrics:
      total:   { age_code: "000", name_ja: "総人口",                 id_suffix: total }
      working: { age_code: "002", name_ja: "生産年齢人口（15-64歳）", id_suffix: working }
      "65over": { age_code: "003", name_ja: "65歳以上人口",           id_suffix: 65over }
    notes: |
      人口推計 都道府県別 年齢（3区分）男女別人口（総人口・男女計・各年10月1日現在・単位=千人）。
      統計表 0004021110（2016-2020）+ 0003448225（2021-2024）を結合し 2016-2024 の年次系列を構成。
      分類コード（getMetaInfo 検証 2026-06-03）: 男女計=000 / 総人口=001 /
      年齢3区分 総数=000・15～64歳=002・65歳以上=003。area={cc}000（cc=JIS 都道府県コード 01-47）。
      L-062: cdCatNN の位置は表で cat02↔cat03 が入れ替わるため分類名で次元解決し取り違いを防ぐ。

      L-065 (2026-08-05) 2025-10-01 値がこのセクションから出ない理由と後継の入口:
        2025-10-01 は令和7年国勢調査の調査基準日。人口推計は国勢調査の「間」を埋める推計なので、
        センサス年の 10/1 現在人口は推計ではなく国勢調査が確定値を持つ。したがって
        本セクションの都道府県×年齢3区分は 2024-10-01 が構造上の終端であり、待っても伸びない。
        実測（2026-08-05, getStatsList/getMetaInfo）:
          - 人口推計 (statsCode=00200524) の「都道府県」を含む統計表 244 本を getMetaInfo で全走査し、
            time 次元に 2025 を持つ表は 0 本。既存 0003448225 も time = 2021..2024 の 4 値のみ
            (UPDATED_DATE=2025-10-03)。表 ID ローテーションでもなく、単に 2025 が存在しない。
          - 令和7年国勢調査 (statsCode=00200521) で 2025 年を持つ表は 2 本のみ (2026-05-29 公表の
            人口速報集計)。うち 0004050397 は次元が tab/男女/area/time だけで年齢区分を持たず、
            全国 2025-10-01 総数 = 123,049,524 人。3 区分別の内訳は速報集計には無い。
        後継の入口（次に 2025-10-01 行を足すときはここから）:
          令和7年国勢調査「人口等基本集計」(年齢別・男女別を含む) — 公表予定 2026-09 末
          (出典: https://www.stat.go.jp/data/kokusei/2025/kekka.html)。公表後に
          statsCode=00200521 / surveyYears=202510 で 都道府県×年齢3区分 の統計表 ID を再特定し、
          tables に追加する。人口推計とは統計・次元名が異なるため resolve_pop_dims の
          名前解決キーワード（「男女」「人口」「年齢」「都道府県」）の適合を必ず実 API で確認すること。
          なお国勢調査は全数調査、人口推計は推計であり、2025-10-01 で系列の出所が切り替わる点に注意
          (全国 2025-10-01: 国勢調査速報 123,050 千人 vs 人口推計 月次確定値 123,219 千人、差 ≈ 169 千人)。
