      jma-sunshine-shikoku:  { name: "高松 日照時間",       domain: weather, unit: "h",  backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 高松。四国の太陽光適地", depends_on: null }
      jma-sunshine-kyushu:   { name: "福岡 日照時間",       domain: weather, unit: "h",  backfill_start: "2012-01-01", aggregation: daily_sum,  notes: "気象官署 福岡。九州太陽光の基準", depends_on: null }
      # --- 日平均風速（9 地点）---
      jma-wind-avg-hokkaido: { name: "札幌 日平均風速",     domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 札幌。洋上風力を含む北海道の風況の参考指標", depends_on: null }
      jma-wind-avg-tohoku:   { name: "仙台 日平均風速",     domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 仙台", depends_on: null }
      jma-wind-avg-tokyo:    { name: "東京 日平均風速",     domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 東京", depends_on: null }
      jma-wind-avg-chubu:    { name: "名古屋 日平均風速",   domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 名古屋", depends_on: null }
      jma-wind-avg-hokuriku: { name: "金沢 日平均風速",     domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 金沢。日本海側の冬の季節風の強度", depends_on: null }
      jma-wind-avg-kansai:   { name: "大阪 日平均風速",     domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 大阪", depends_on: null }
      jma-wind-avg-chugoku:  { name: "広島 日平均風速",     domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 広島", depends_on: null }
      jma-wind-avg-shikoku:  { name: "高松 日平均風速",     domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 高松", depends_on: null }
      jma-wind-avg-kyushu:   { name: "福岡 日平均風速",     domain: weather, unit: "m/s", backfill_start: "2012-01-01", aggregation: daily_mean, notes: "気象官署 福岡", depends_on: null }
      # --- 最深積雪（9 地点）---
      # 雪が積もらない地点は冬の最後の積雪日で値が固定される（例: 大阪は 2021 年以来）。
      # SLA を 365 日に緩めて季節データの自然な不在を SLA 違反扱いしない。
      jma-snow-max-hokkaido: { name: "札幌 最深積雪",       domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 札幌。冬季除雪コスト・暖房需要の素材", depends_on: null, freshness_sla_days: 365 }
      jma-snow-max-tohoku:   { name: "仙台 最深積雪",       domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 仙台", depends_on: null, freshness_sla_days: 365 }
      jma-snow-max-tokyo:    { name: "東京 最深積雪",       domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 東京。大雪時の首都圏交通麻痺イベント指標", depends_on: null, freshness_sla_days: 365 }
      jma-snow-max-chubu:    { name: "名古屋 最深積雪",     domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 名古屋", depends_on: null, freshness_sla_days: 365 }
      jma-snow-max-hokuriku: { name: "金沢 最深積雪",       domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 金沢。北陸の豪雪＝春先の水力発電の素材", depends_on: null, freshness_sla_days: 365 }
      jma-snow-max-kansai:   { name: "大阪 最深積雪",       domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 大阪。ほぼゼロだが寒波イベント記録用", depends_on: null, freshness_sla_days: 365 }
      jma-snow-max-chugoku:  { name: "広島 最深積雪",       domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 広島", depends_on: null, freshness_sla_days: 365 }
      jma-snow-max-shikoku:  { name: "高松 最深積雪",       domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 高松", depends_on: null, freshness_sla_days: 365 }
      jma-snow-max-kyushu:   { name: "福岡 最深積雪",       domain: weather, unit: "cm", backfill_start: "2012-01-01", aggregation: daily_max,  notes: "気象官署 福岡", depends_on: null, freshness_sla_days: 365 }
    notes: |
      - 月単位の HTML ページから日次テーブルを抽出する方式。
      - 欠測記号 `///`, `--`, `)`, `×`, 空文字を NaN として扱う。
      - `--all` 指定時は 2012-01 から現在まで。通常は直近 2 ヶ月分のみ取り直し（差分更新）。
      - 観測点コード（prec_no, block_no）は公式の「地点の情報」ページで確認済みのものを採用。初回ラン時にページ到達失敗が出たら修正する。
      - 当該年の CSV は年内更新型（追記される）ため、当該年と前年の 2 ファイルを取得すれば最新まで揃う。

  wb-pink-sheet:
    name: World Bank Commodity Prices (Pink Sheet) — 月次
    publisher: The World Bank Group
    publisher_url: https://www.worldbank.org/en/research/commodity-markets
    source_url: https://www.worldbank.org/en/research/commodity-markets
    # 単一の安定 XLSX URL（"CMO-Historical-Data-Monthly"）。
    # World Bank は数年単位でこの URL を引っ越す履歴があるため fallback_urls を併記しておく。
    xlsx_url: "https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025/related/CMO-Historical-Data-Monthly.xlsx"
    fallback_urls:
      - "https://pubdocs.worldbank.org/en/561011486076393416/CMO-Historical-Data-Monthly.xlsx"
      - "https://thedocs.worldbank.org/en/doc/561011486076393416-0050022017/CMO-Historical-Data-Monthly"
    sheet_name: "Monthly Prices"
    # --- D-011 メタデータ共通項目 ---
    license: CC-BY-4.0                # SPDX
    license_url: https://creativecommons.org/licenses/by/4.0/
    license_notice: ""
    license_text: |
      World Bank Open Data: Creative Commons Attribution 4.0 International (CC BY 4.0)
      出典明示を条件に自由利用可（再配布・商用可）。
      参考: https://www.worldbank.org/en/about/legal/terms-of-use-for-datasets
    frequency: monthly
    tz: UTC
    missing_policy: forward_fill_within_month
    # WB Historical Data Monthly XLSX の更新は Pink Sheet PDF より遅延サイクルが長く、
    # 月次データは公開後 4〜6 ヶ月のラグがある実態（2026-04-29 確認: XLSX 取得日に
    # かかわらず内部データは 2025M12 で停止）。SLA 180 日は 6 ヶ月の余裕を見たもの（Phase A スプリント期間中の安定運用を優先）。
    # D-011 v2 で publication_lag_months フィールドを正式導入予定。
    freshness_sla_days: 180                       # 半年マージン（Phase 0 v2-A Step 3-A revision、Phase A 期間中の安定優先）
    # 各系列は wide 形式の Excel 列を部分一致で引くためのキーワード定義。
    # match: すべて含む AND 条件、exclude: いずれかに含まれたら除外。
    series:
      - id: fuel-lng-jp-cif
        name: 日本向け LNG 輸入価格（CIF）
        # Pink Sheet の実際の列名は "Liquefied natural gas, Japan"
        match: [Liquefied, Japan]
        exclude: []
        region: jp
        unit: USD_per_mmbtu
      - id: fuel-ng-henryhub
        name: 天然ガス（米国, Henry Hub）
        # "U.S." ではなく "US"（ピリオドなし）が実際の表記。
        # Natural gas 系列で Europe/Japan/Liquefied/index を除外すれば Henry Hub 列に一意特定。
        match: [Natural gas, US]
        exclude: [index, europe, japan, liquefied]
        region: us
        unit: USD_per_mmbtu
      - id: fuel-ng-europe-ttf
        name: 天然ガス（欧州, TTF）
        match: [Natural gas, Europe]
        exclude: [index]
        region: eu
        unit: USD_per_mmbtu
      - id: fuel-crude-brent
        name: 原油（Brent）
        match: [Crude oil, Brent]
        exclude: []
        region: eu
        unit: USD_per_bbl
      - id: fuel-crude-dubai
        name: 原油（Dubai）
        match: [Crude oil, Dubai]
        exclude: []
        region: me
        unit: USD_per_bbl
      - id: fuel-crude-wti
        name: 原油（WTI）
        match: [Crude oil, WTI]
        exclude: []
        region: us
        unit: USD_per_bbl
      - id: fuel-coal-au
        name: 石炭（豪州）
        match: [Coal, Australian]
        exclude: []
        region: au
        unit: USD_per_mt
    indicator_ids:
      - fuel-lng-jp-cif
      - fuel-ng-henryhub
      - fuel-ng-europe-ttf
      - fuel-crude-brent
      - fuel-crude-dubai
      - fuel-crude-wti
      - fuel-coal-au
    # D-011 準拠の indicator 固有メタデータ（7 系列）
    indicators:
      fuel-lng-jp-cif:
        name: "日本 LNG 輸入価格（CIF）"
        domain: fuel
        unit: "$/MMBtu"
        backfill_start: "1977-01-01"
        aggregation: raw
        notes: "日本の LNG 輸入 CIF 価格（月次）。Pink Sheet 収録で 1977-01 から"
        depends_on: null
      fuel-ng-henryhub:
        name: "天然ガス Henry Hub（米国）"
        domain: fuel
        unit: "$/MMBtu"
        backfill_start: "1960-01-01"
        aggregation: raw
        notes: "Natural gas, US 系列（Pink Sheet 列）"
        depends_on: null
      fuel-ng-europe-ttf:
        name: "天然ガス TTF（欧州）"
        domain: fuel
        unit: "$/MMBtu"
        backfill_start: "1992-08-01"
        aggregation: raw
        notes: "Natural gas, Europe 系列。TTF は 1990 年代以降の整備で早期は代替指標の継ぎ"
        depends_on: null
      fuel-crude-brent:
        name: "原油 Brent"
        domain: fuel
        unit: "$/bbl"
        backfill_start: "1960-01-01"
        aggregation: raw
        notes: "Crude oil, Brent（Pink Sheet）"
        depends_on: null
      fuel-crude-dubai:
        name: "原油 Dubai"
        domain: fuel
        unit: "$/bbl"
        backfill_start: "1960-01-01"
        aggregation: raw
        notes: "Crude oil, Dubai（Pink Sheet）"
        depends_on: null
      fuel-crude-wti:
        name: "原油 WTI"
        domain: fuel
        unit: "$/bbl"
        backfill_start: "1960-01-01"
        aggregation: raw
        notes: "Crude oil, WTI（Pink Sheet）"
        depends_on: null
      fuel-coal-au:
        name: "石炭（豪州 Newcastle）"
        domain: fuel
        unit: "$/mt"
        backfill_start: "1960-01-01"
        aggregation: raw
        notes: "Coal, Australian 系列（Pink Sheet）"
        depends_on: null
    notes: |
      - 月次データ、日付は「月初日（YYYY-MM-01）」で正規化。
      - 1960-01 から現在まで。翌月上旬に前月値が確定（遅延約 1 ヶ月）。
      - 列ヘッダは年度で表記が揺れるため、部分一致（match / exclude）で列を探す設計。
        もし初回ランで series が見つからなければ、Excel を開いて実際の列名を確認し match を微調整する。
      - シート名が "Monthly Prices" でないバージョンに当たった場合は sheet_name を更新する。
      - 価格単位の混在: $/mmbtu（天然ガス）, $/bbl（原油）, $/mt（石炭）。indicator ごとに unit を持つ。

  boj-fx:
    name: 日本銀行 時系列統計データ（外国為替市況, FM08）
    publisher: 日本銀行
    publisher_url: https://www.stat-search.boj.or.jp/
    source_url: https://www.stat-search.boj.or.jp/ssi/mtshtml/fm08_m_1_en.html
    # getDataCode エンドポイント。複数系列をカンマ区切りで同時取得可能。
    # URL 例: https://www.stat-search.boj.or.jp/api/v1/getDataCode?format=csv&lang=en&db=FM08&code=FXERM07,FXERM06&startDate=197301&endDate=203012
    api_url: "https://www.stat-search.boj.or.jp/api/v1/getDataCode"
    db: FM08
    # 月次データの date 形式は YYYYMM。日次は FM08 内だがパラメータ仕様に癖があり、初版は月次のみ。
    start_date: "197301"
    # 終了側は十分先を指定しておけば API 側で収録終了期にクランプされる
    end_date_buffer_years: 5
    # --- D-011 メタデータ共通項目 ---
    license: boj-terms
    license_url: https://www.stat-search.boj.or.jp/info/api_notice.pdf
    license_notice: "本サービスは、日本銀行時系列統計データ検索サイトの API 機能を使用しています。本サービスの内容は日本銀行によって保証されたものではありません。"
    license_text: |
      日本銀行時系列統計データ検索サイト利用規約。
      必須掲載文言:
        「このサービスは、日本銀行時系列統計データ検索サイトの API 機能を使用しています。
         サービスの内容は日本銀行によって保証されたものではありません。」
      API 機能利用時の留意点: https://www.stat-search.boj.or.jp/info/api_notice.pdf
    frequency: monthly
    tz: Asia/Tokyo
    missing_policy: "null"
    freshness_sla_days: 60
    # 各系列は BOJ 側の系列コード 1 対 1。単位は「円/ドル」で共通。
    series:
      - id: fx-usdjpy-monthly-avg
        name: 米ドル/円 月中平均（東京市場 17時）
        code: FXERM07
        region: jp
        unit: JPY_per_USD
      - id: fx-usdjpy-monthly-end
        name: 米ドル/円 月末値（東京市場 17時）
        code: FXERM06
        region: jp
        unit: JPY_per_USD
      - id: fx-usdjpy-monthly-high
        name: 米ドル/円 月内高値（東京市場）
        code: FXERM03
        region: jp
        unit: JPY_per_USD
      - id: fx-usdjpy-monthly-low
        name: 米ドル/円 月内安値（東京市場）
        code: FXERM05
        region: jp
        unit: JPY_per_USD
    indicator_ids:
      - fx-usdjpy-monthly-avg
      - fx-usdjpy-monthly-end
      - fx-usdjpy-monthly-high
      - fx-usdjpy-monthly-low
    # D-011 準拠の indicator 固有メタデータ（4 系列）
    indicators:
      fx-usdjpy-monthly-avg:
        name: "USD/JPY 月中平均"
        domain: finance
        unit: "¥/USD"
        backfill_start: "1973-01-01"
        aggregation: monthly_mean
        notes: "BOJ FM08 / FXERM07。月中平均（東京市場 17 時）"
        depends_on: null
      fx-usdjpy-monthly-end:
        name: "USD/JPY 月末値"
        domain: finance
        unit: "¥/USD"
        backfill_start: "1973-01-01"
        aggregation: monthly_end
        notes: "BOJ FM08 / FXERM06。月末値（東京市場 17 時）"
        depends_on: null
      fx-usdjpy-monthly-high:
        name: "USD/JPY 月内高値"
        domain: finance
        unit: "¥/USD"
        backfill_start: "1992-08-01"
        aggregation: monthly_high
        notes: "BOJ FM08 / FXERM03。月内高値（東京市場）"
        depends_on: null
      fx-usdjpy-monthly-low:
        name: "USD/JPY 月内安値"
        domain: finance
        unit: "¥/USD"
        backfill_start: "1992-08-01"
        aggregation: monthly_low
        notes: "BOJ FM08 / FXERM05。月内安値（東京市場）"
        depends_on: null
    notes: |
      - 月次データ、日付は「月初日（YYYY-MM-01）」で正規化。
      - FXERM07 / FXERM06 は 1973-01 から、FXERM03 / FXERM05 は 1992-08 から。
      - 更新は平日 8:50 JST。月の値が確定するのは翌月初。
      - CSV レスポンスの先頭 11 行は STATUS/PARAMETER などのメタデータ。12 行目が列ヘッダ、以降がデータ。
      - 全系列を 1 リクエストで取得（カンマ区切り code=FXERM07,FXERM06,FXERM03,FXERM05）。
      - 日次系列（FXERD04 等）は startDate のパラメータ仕様に癖があるため、初版は月次のみ。

  mof-jgb:
    name: 財務省 国債金利情報（日次、各年限）
    publisher: 財務省
    publisher_url: https://www.mof.go.jp/
    source_url: https://www.mof.go.jp/jgbs/reference/interest_rate/
    # 単一 CSV（過去全期間: 1974-09-24 〜 前年度末）。Shift-JIS、和暦日付、15 年限の wide 形式。
    # 年度切替時にまとめて前年度をアーカイブする運用。
    csv_url: "https://www.mof.go.jp/jgbs/reference/interest_rate/data/jgbcm_all.csv"
    # 当年度の日次更新版 CSV（1974-09-24〜最新営業日まで取れない、当年度のみ）。
    # 2026-04-25 の事故（observation_cutoff が 3/31 で止まる）を受けて Phase 2-A v2 で追加。
    # 当年度版のキー = 同日付があればこちらが優先（fetch_jgb.py で union 時に当年度版が後勝ち）。
    current_csv_url: "https://www.mof.go.jp/jgbs/reference/interest_rate/jgbcm.csv"
    encoding: shift_jis
    # 列ヘッダ（2 行目）: 基準日,1年,2年,3年,4年,5年,6年,7年,8年,9年,10年,15年,20年,25年,30年,40年
    # 1 行目は単位注意書き。3 行目以降がデータ。欠損（新発がなかった期間）は "-"。
    header_row: 2
    # --- D-011 メタデータ共通項目 ---
    license: public-domain                       # 財務省公表資料、自由利用可（国の著作物）
    license_url: https://www.mof.go.jp/index.htm
    license_notice: ""
    license_text: |
      財務省（国）が作成した公表資料。国の著作物は原則として自由利用可。
      参考: 財務省ホームページ利用規約 https://www.mof.go.jp/index.htm
    frequency: daily
    tz: Asia/Tokyo
    missing_policy: "null"                        # 金利が付かなかった日は "-" → null で保持
    freshness_sla_days: 5
    indicator_ids:
      - jgb-10y-yield
      - jgb-30y-yield
    # Phase 1 は 10 年、Phase 3-B で 30 年を追加。Phase 2 以降で 2y/5y/20y も昇格可能。
    indicators:
      jgb-10y-yield:
        name: "JGB 10 年金利（新発）"
        domain: finance
        unit: "%"
        backfill_start: "1974-09-24"
        aggregation: raw
        notes: "財務省 金利情報 jgbcm_all.csv、10 年新発国債の日次利回り。土日祝・入札なし日は '-' → null"
        depends_on: null
      jgb-30y-yield:
        name: "JGB 30 年金利（新発）"
        domain: finance
        unit: "%"
        backfill_start: "1999-09-21"
        aggregation: raw
        notes: "財務省 金利情報 jgbcm_all.csv、30 年新発国債の日次利回り（1999-09 開始）。米 30 年金利との比較に使用"
        depends_on: null
    # CSV 構造のメモ（fetch_jgb.py が読む）
    columns_wide:
      - 基準日
      - "1年"
      - "2年"
      - "3年"
      - "4年"
      - "5年"
      - "6年"
      - "7年"
      - "8年"
      - "9年"
      - "10年"
      - "15年"
      - "20年"
      - "25年"
      - "30年"
      - "40年"
    # 年限と indicator_id の対応（Phase 1: 10 年、Phase 3-B: 30 年追加）
    term_to_id:
      "10年": jgb-10y-yield
      "30年": jgb-30y-yield
    notes: |
      - 単一 CSV で 1974-09-24 〜 最新営業日までを取得。差分更新不要（常に全量差し替え）。
      - 日付は和暦（例: S49.9.24 / H10.4.1 / R6.4.1）。fetch_jgb.py で西暦に変換。
      - 元号マッピング: M=明治(1868)/T=大正(1912)/S=昭和(1926)/H=平成(1989)/R=令和(2019)。
      - 新発がなかった年限は "-"。float 変換時は None に落とす（missing_policy: null）。
      - 更新タイミング: 平日 17 時台に当日分が追記される。週末・祝日は行が増えない。
      - Phase 2 で 2年 / 5年 / 20年 / 30年 を追加する際は term_to_id に 1 行足すだけで良い設計。

  enecho-power:
    name: 資源エネルギー庁 電力調査統計
    publisher: 資源エネルギー庁（METI）
    publisher_url: https://www.enecho.meti.go.jp/
    source_url: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/
    # ----- 2026-04-24 Day 3 実 HTML 疎通で確定した仕様 ------------------
    # ファイルは **年度単位** で公開される（月次ファイルではない）。
    # 1 XLSX に 4 月〜翌 3 月の 12 ヶ月分が格納される wide 形式。
    # 年度によって filename / layout が変わる:
    #   2019 年度〜2025 年度: `2-1-{YYYY}.xlsx` / `3-1-{YYYY}.xlsx`（西暦）
    #   2016 年度〜2018 年度: `2-1-H{nn}.xlsx` / `3-1-H{nn}.xlsx`（和暦平成）
    #   2015 年度以前:       `2-1-H{nn}.xls` + 表構造が根本的に異なる（2-1〜2-12 分割シート）
    # Phase 2-A v1 のスコープは **2016 年度〜最新（2025 年度）** の 10 年分に限定。
    # 2015 年度以前は Phase 2-B 以降で別ローダーを書く。
    # --------------------------------------------------------------
    # 最新年度トップページ（通常 1 年度分のリンクのみ）
    index_url: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/results.html
    # 過去年度一覧（2014〜直近年度を 1 ページにまとめたアーカイブ）
    archive_url: https://www.enecho.meti.go.jp/statistics/electric_power/ep002/results_archive.html
    # どちらのページも同じ HTML 構造。list_xlsx_links は両方を順に走査して union を返す。
    index_urls:
      - https://www.enecho.meti.go.jp/statistics/electric_power/ep002/results.html
      - https://www.enecho.meti.go.jp/statistics/electric_power/ep002/results_archive.html
    # --- D-011 メタデータ共通項目 ---
    license: meti-terms                           # 政府標準利用規約 2.0 互換（CC BY 4.0 互換相当）
    license_url: https://www.meti.go.jp/main/rules.html
    license_notice: |
      出典: 資源エネルギー庁「電力調査統計」
      政府標準利用規約 2.0 に従い、出典明示を条件に利用可。
    license_text: |
      経済産業省（METI）公表資料。政府標準利用規約 2.0（CC BY 4.0 互換）。
      参考: https://www.meti.go.jp/main/rules.html
    frequency: monthly
    tz: Asia/Tokyo
    missing_policy: "null"                        # 欠測月は null
    freshness_sla_days: 150                       # METI 電力調査統計は 4 ヶ月遅れ（FY2025 確定は 2026-07 頃）
    # ----- 対象ファイル名パターン ---------------------------------------
    # 発電実績テーブル: 2-1-{YEAR}.xlsx or 2-1-H{nn}.xlsx or 2-1-{YEAR}n.xlsx（機械判読版、2025 のみ）
    # 需要実績テーブル: 3-1-{YEAR}.xlsx or 3-1-H{nn}.xlsx
    # 正規表現で抽出する。`n.xlsx` 変種が存在すればそちらを優先（機械判読しやすい）。
    target_patterns:
      generation: "^2-1-(H\\d{2}|\\d{4})n?\\.xlsx$"
      demand:     "^3-1-(H\\d{2}|\\d{4})n?\\.xlsx$"
    # 和暦プレフィックス → 西暦オフセット（filename パース用）
    era_offset:
      H: 1988     # 平成（H28 → 2016）
      R: 2018     # 令和（未使用、現状 filename は西暦直接）
    # スコープ境界（この fiscal year 以降のみを対象に取得）
    min_fiscal_year: 2016
    # 対象シート名（XLSX 内部）。Day 4 で実 XLSX を確認して調整予定。
    sheet_hints:
      generation_total: "総括"                    # 電源別・月次・全国計
      demand_total:     "総括"                    # 電灯・電力・月次・合計
    # 代替シート名（旧レイアウト）
    sheet_aliases:
      generation_total: ["発電実績", "電源別", "発電端", "月別"]
      demand_total:     ["販売", "電灯・電力", "用途別", "電力需要"]
    # ラベル駆動で値を抽出（行ラベルの最初のマッチを採用）
    row_labels:
      gen_total:       ["発電電力量計", "総計", "合計", "発電電力量合計"]
      gen_thermal:     ["火力計", "火力発電計", "火力"]
      gen_hydro:       ["水力計", "水力発電計", "水力"]
      gen_nuclear:     ["原子力"]
      gen_solar:       ["太陽光", "太陽光発電"]
      gen_wind:        ["風力", "風力発電"]
      gen_geothermal:  ["地熱", "地熱発電"]
      gen_biomass:     ["バイオマス", "バイオマス発電"]
      demand_total:    ["販売電力量計", "合計", "総計", "販売電力量合計"]
      demand_lights:   ["電灯"]
      demand_power:    ["電力"]
    # 単位の想定値（XLSX では「(百万 kWh)」「(GWh)」等の揺れあり、fetch 側で正規化）
    unit_canonical: GWh
    # 派生系列の定義（fetch 後に計算）
    derived:
      meti-renewables-share:
        formula: "(solar + wind + geothermal + hydro + biomass) / total * 100"
        numerator_ids:
          - meti-gen-solar
          - meti-gen-wind
          - meti-gen-geothermal
          - meti-gen-hydro
          - meti-gen-biomass
        denominator_id: meti-gen-total
    indicator_ids:
      - meti-gen-total
      - meti-gen-thermal
      - meti-gen-hydro
      - meti-gen-nuclear
      - meti-gen-solar
      - meti-gen-wind
      - meti-gen-geothermal
      - meti-gen-biomass
      - meti-demand-total
      - meti-demand-lights
      - meti-demand-power
      - meti-renewables-share
    # D-011 準拠の indicator 固有メタデータ（12 系列）
    indicators:
      meti-gen-total:
        name: "総発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "発電端ベース。一般送配電＋発電事業者の月合計"
        depends_on: null
      meti-gen-thermal:
        name: "火力発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "LNG・石炭・石油などの合計"
        depends_on: null
      meti-gen-hydro:
        name: "水力発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "一般水力＋揚水水力"
        depends_on: null
      meti-gen-nuclear:
        name: "原子力発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "再稼働状況と強く相関"
        depends_on: null
      meti-gen-solar:
        name: "太陽光発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "FIT/FIP 対象＋非対象"
        depends_on: null
      meti-gen-wind:
        name: "風力発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "陸上＋洋上"
        depends_on: null
      meti-gen-geothermal:
        name: "地熱発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "国内合計"
        depends_on: null
      meti-gen-biomass:
        name: "バイオマス発電電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "FIT/FIP 主体"
        depends_on: null
      meti-demand-total:
        name: "販売電力量合計（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "電灯＋電力の合計"
        depends_on: null
      meti-demand-lights:
        name: "電灯販売電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "家庭用需要"
        depends_on: null
      meti-demand-power:
        name: "電力販売電力量（月次）"
        domain: power
        unit: "GWh"
        backfill_start: "2012-01"
        aggregation: monthly_sum
        notes: "業務・産業需要"
        depends_on: null
      meti-renewables-share:
        name: "再エネ比率（発電ベース、月次）"
        domain: power
        unit: "%"
        backfill_start: "2012-01"
        aggregation: derived
        notes: "(太陽光＋風力＋地熱＋水力＋バイオマス) / 総発電量 × 100"
        depends_on:
          - meti-gen-solar
          - meti-gen-wind
          - meti-gen-geothermal
          - meti-gen-hydro
          - meti-gen-biomass
          - meti-gen-total
    notes: |
      - 月次公表、約 2 ヶ月遅延（例: 2026-04 時点で 2026-02 分まで）。
      - XLSX ファイルはトップページ results.html から取得。年別・月別ファイルの切替あり。
      - 2012 以前は XLS（旧形式）混在のため、Phase 2-A の backfill は 2012-01 以降のみ対象。
      - ラベル列の揺れ（「火力計」「火力」「火力発電計」など）に対応するため、row_labels はリスト。
      - 単位は「(百万 kWh)」= GWh に正規化（fetch_enecho_power.py で値変換）。
      - meti-renewables-share は他系列から計算される派生指標。D-011 の depends_on を初めて非 null で埋める系列。
      - ライセンス: 政府標準利用規約 2.0（CC BY 4.0 互換）。出典明示が必須。

