        aggregation: monthly_mean
        notes: "CPIAUCSL（Consumer Price Index for All Urban Consumers, SA）の 12 ヶ月前比 % を算出。Insight #40「日米 CPI 差 → USD/JPY」で使用"
        depends_on: null
        citation_url: "https://fred.stlouisfed.org/series/CPIAUCSL"
        publisher_detail: "U.S. Bureau of Labor Statistics"
        # CPI は対象月の翌月中旬公表 + FRED 反映で典型 45-75 日遅延 → 90 で余裕（運用観察後に再評価）
        freshness_sla_days: 90
      us-fed-funds-rate:
        name: "Fed Funds Rate（実効、月次平均）"
        domain: macro
        frequency: monthly
        unit: "%"
        fred_series_id: "FEDFUNDS"
        transform: "level"
        backfill_start: "1954-07-01"
        aggregation: monthly_mean
        notes: "FEDFUNDS（Federal Funds Effective Rate, 月内平均）。FOMC 決定値ではなく実効レート。Insight #41「Fed FF rate × JEPX」で使用"
        depends_on: null
        citation_url: "https://fred.stlouisfed.org/series/FEDFUNDS"
        publisher_detail: "Board of Governors of the Federal Reserve System (US)"
      us-industrial-production:
        name: "米国鉱工業生産指数（Index 2017=100）"
        domain: macro
        frequency: monthly
        unit: "index_2017_eq_100"
        fred_series_id: "INDPRO"
        transform: "level"
        backfill_start: "1919-01-01"
        aggregation: raw
        notes: "INDPRO（Industrial Production Total Index, SA）。製造業＋鉱業＋公益事業の総合指数。Insight #42「米景気 × 日本電力需要」で使用"
        depends_on: null
        citation_url: "https://fred.stlouisfed.org/series/INDPRO"
        publisher_detail: "Board of Governors of the Federal Reserve System (US)"
        # INDPRO も CPI と同じく月次集計に時間がかかり 45-75 日遅延が典型 → 90 で余裕
        freshness_sla_days: 90
      us-nonfarm-payrolls:
        name: "米国 非農業部門雇用者数（千人）"
        domain: macro
        frequency: monthly
        unit: "thousand_persons"
        fred_series_id: "PAYEMS"
        transform: "level"
        backfill_start: "1939-01-01"
        aggregation: raw
        notes: "PAYEMS（All Employees, Total Nonfarm, SA, Thousands of Persons）。月次雇用統計の主要指標、毎月第一金曜公表 (BLS Employment Situation)。前月比変化が市場の利下げ観測 + USD/JPY を動かす"
        depends_on: null
        citation_url: "https://fred.stlouisfed.org/series/PAYEMS"
        publisher_detail: "U.S. Bureau of Labor Statistics"
        # PAYEMS は対象月の翌月第一金曜公表 → 7-14 日後に FRED 反映、改定も多い → 60 で余裕
        freshness_sla_days: 60
      us-unemployment-rate:
        name: "米国 失業率（%）"
        domain: macro
        frequency: monthly
        unit: "%"
        fred_series_id: "UNRATE"
        transform: "level"
        backfill_start: "1948-01-01"
        aggregation: raw
        notes: "UNRATE（Unemployment Rate, SA, %）。労働力人口に占める失業者の割合、PAYEMS と同時公表 (CPS = 家計調査ベース、PAYEMS は事業所調査)。FRB の二大マンデート (物価安定 + 雇用最大化) の一翼"
        depends_on: null
        citation_url: "https://fred.stlouisfed.org/series/UNRATE"
        publisher_detail: "U.S. Bureau of Labor Statistics"
        # UNRATE も PAYEMS と同時公表 → 60 日 SLA
        freshness_sla_days: 60
      us-cpi-food-yoy:
        name: "米国 CPI 食品（前年比 %）"
        domain: macro
        frequency: monthly
        unit: "%"
        fred_series_id: "CPIUFDSL"
        transform: "yoy_pct"
        backfill_start: "1948-01-01"
        aggregation: monthly_mean
        notes: "CPIUFDSL（Consumer Price Index for All Urban Consumers: Food, SA）の 12 ヶ月前比 %。総合 CPI (CPIAUCSL) のうち食品セクター単独、商品サブ最大ウェイト。エネルギーと並んで「コア外」を構成し、Fed のインフレ判断で重視"
        depends_on: null
        citation_url: "https://fred.stlouisfed.org/series/CPIUFDSL"
        publisher_detail: "U.S. Bureau of Labor Statistics"
        # CPI 系列は対象月の翌月中旬公表 + FRED 反映で典型 45-75 日遅延 → 90 で余裕 (us-cpi-yoy 同様)
        freshness_sla_days: 90
      us-cpi-energy-yoy:
        name: "米国 CPI エネルギー（前年比 %）"
        domain: macro
        frequency: monthly
        unit: "%"
        fred_series_id: "CPIENGSL"
        transform: "yoy_pct"
        backfill_start: "1957-01-01"
        aggregation: monthly_mean
        notes: "CPIENGSL（Consumer Price Index for All Urban Consumers: Energy, SA）の 12 ヶ月前比 %。ガソリン + 家庭用電気 + 暖房油などのエネルギー価格、原油価格の変動を直接反映するため CPI の中で最も変動が大きい"
        depends_on: null
        citation_url: "https://fred.stlouisfed.org/series/CPIENGSL"
        publisher_detail: "U.S. Bureau of Labor Statistics"
        freshness_sla_days: 90
    notes: |
      - FRED API キー（無料、120 req/min）を環境変数 FRED_API_KEY から読む。
        ローカル: .env ファイルに `FRED_API_KEY=...` を記載 → python-dotenv が自動読込。
        GitHub Actions: secrets.FRED_API_KEY を env: で渡す。
      - キー未設定時は CSV 直 DL エンドポイント（fredgraph.csv?id=...）にフォールバック。
      - 月次データ、日付は「月初日（YYYY-MM-01）」で正規化。
      - 翌月中旬に確定。FRED 側で過去値の改定が入るため、毎日叩いて差分更新（write_processed が dedup）。
      - us-cpi-yoy は CPIAUCSL の raw level を取得後、(this - 12mo_ago) / 12mo_ago * 100 で算出した派生系列。
      - INDPRO は 1919-01 から、CPIAUCSL は 1947-01 から、FEDFUNDS は 1954-07 から取得可能。

  ecb:
    name: 欧州中央銀行 政策金利 + 参照為替レート (SDMX API)
    publisher: European Central Bank (ECB)
    publisher_url: https://www.ecb.europa.eu/
    source_url: https://data.ecb.europa.eu/
    # SDMX REST API base URL. flowRef と key を URL パスに繋げる:
    #   {base_url}/{flow_ref}/{key}?startPeriod=YYYY-MM&endPeriod=YYYY-MM
    base_url: "https://data-api.ecb.europa.eu/service/data"
    # --- D-011 メタデータ共通項目 ---
    license: ecb-terms
    license_url: https://www.ecb.europa.eu/services/disclaimer/html/index.en.html
    license_notice: "Source: European Central Bank. Reuse permitted with attribution."
    license_text: |
      ECB のオープンデータ。再利用は出典明示を条件に可。
      参考: https://www.ecb.europa.eu/services/disclaimer/html/index.en.html
    frequency: monthly
    tz: UTC
    missing_policy: forward_fill
    freshness_sla_days: 45                        # 政策金利は月内変化、月末値で集約
    # 5 系列定義 (政策金利 3 + 為替 2)
    series:
      - id: ecb-rate-dfr
        flow_ref: FM
        key: "D.U2.EUR.4F.KR.DFR.LEV"
        region: eu
        # 日次データだが「政策金利変更日のみ tick」型 → 日次 ffill → 月末値で月次化
        daily_to_monthly: true
      - id: ecb-rate-mrr
        flow_ref: FM
        key: "D.U2.EUR.4F.KR.MRR_FR.LEV"
        region: eu
        daily_to_monthly: true
      - id: ecb-rate-mlf
        flow_ref: FM
        key: "D.U2.EUR.4F.KR.MLFR.LEV"
        region: eu
        daily_to_monthly: true
      - id: fx-eurusd-monthly-avg
        flow_ref: EXR
        key: "M.USD.EUR.SP00.A"
        region: eu
        daily_to_monthly: false
      - id: fx-eurjpy-monthly-avg
        flow_ref: EXR
        key: "M.JPY.EUR.SP00.A"
        region: eu
        daily_to_monthly: false
    indicator_ids:
      - ecb-rate-dfr
      - ecb-rate-mrr
      - ecb-rate-mlf
      - fx-eurusd-monthly-avg
      - fx-eurjpy-monthly-avg
    # D-011 準拠の indicator 固有メタデータ (5 系列)
    indicators:
      ecb-rate-dfr:
        name: "ECB Deposit Facility Rate"
        domain: international
        unit: "%"
        backfill_start: "1999-01-01"
        aggregation: monthly_end
        notes: "ECB FM/D.U2.EUR.4F.KR.DFR.LEV。中銀預金ファシリティ金利。政策金利変更日に tick、日次 ffill → 月末値で月次化"
        depends_on: null
      ecb-rate-mrr:
        name: "ECB Main Refinancing Operations Rate"
        domain: international
        unit: "%"
        backfill_start: "1999-01-01"
        aggregation: monthly_end
        notes: "ECB FM/D.U2.EUR.4F.KR.MRR_FR.LEV。主要リファイナンス・オペ金利 (fixed rate tenders)。MROフィックスドレート、ユーロ圏短期金利の基準"
        depends_on: null
      ecb-rate-mlf:
        name: "ECB Marginal Lending Facility Rate"
        domain: international
        unit: "%"
        backfill_start: "1999-01-01"
        aggregation: monthly_end
        notes: "ECB FM/D.U2.EUR.4F.KR.MLFR.LEV。限界貸付ファシリティ金利。回廊金利の上限"
        depends_on: null
      fx-eurusd-monthly-avg:
        name: "EUR/USD ECB Reference Rate 月平均"
        domain: international
        unit: "USD/EUR"
        backfill_start: "1999-01-01"
        aggregation: monthly_mean
        notes: "ECB EXR/M.USD.EUR.SP00.A。ECB 公表 14:15 CET 参照レート、月平均。USD per 1 EUR"
        depends_on: null
      fx-eurjpy-monthly-avg:
        name: "EUR/JPY ECB Reference Rate 月平均"
        domain: international
        unit: "JPY/EUR"
        backfill_start: "1999-01-01"
        aggregation: monthly_mean
        notes: "ECB EXR/M.JPY.EUR.SP00.A。ECB 公表 14:15 CET 参照レート、月平均。JPY per 1 EUR。Phase 0 で BOJ FM08 に EUR/JPY 系列が無いことを実 API で確認し、ECB 一次ソースに切替"
        depends_on: null
    notes: |
      - SDMX REST API。flowRef はパスに、各次元 (FREQ/REF_AREA/CURRENCY/...) は key に "." 区切りで指定。
      - 政策金利 3 系列 (DFR/MRR/MLF) は dataflow FM、FREQ=D、観測は政策金利変更日のみ存在 ("date of changes (raw data)")。
        日次 ffill → 月末値で月次化することで monthly 系列として保存。月次集約版 (FM/M.*.LEV) は ECB API 上 404 で存在しない。
      - 為替 2 系列 (EUR/USD, EUR/JPY) は dataflow EXR、FREQ=M で月平均レートが直接取得できる。
      - MRR は "MRR_FR" (fixed rate tenders) を採用。MRR_RT/MRR_MBR は別概念で歴史的役割が異なる。
      - L-063 (2026-05-26): 仕様書の (B) BOJ FM08 EUR/JPY は FM08 に該当系列が無いことを実 API で確認 → ECB EXR JPY/EUR に切替。

  ember:
    name: Ember Monthly Electricity Data (グローバル月次電力統計)
    publisher: Ember
    publisher_url: https://ember-energy.org/
    source_url: https://ember-energy.org/data/monthly-electricity-data/
    # long-format CSV を 1 発で取得 (約 70 MB、全国全変数を 1999-01 から)。
    csv_url: "https://files.ember-energy.org/public-downloads/monthly_full_release_long_format.csv"
    # --- D-011 メタデータ共通項目 ---
    license: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    license_notice: "Source: Ember (https://ember-energy.org/), licensed under CC BY 4.0."
    license_text: |
      Creative Commons Attribution 4.0 International (CC BY 4.0)。
      出典明示を条件に再配布・商用利用可。
    frequency: monthly
    tz: UTC
    missing_policy: "null"
    freshness_sla_days: 90                        # Ember は概ね 2-3 ヶ月遅延で公表
    # 抽出対象国 (5 ヶ国)。area_name は Ember CSV の Area 列の値と一致させること
    countries:
      - { area_name: "Japan",                    region: jp }
      - { area_name: "United States of America", region: us }
      - { area_name: "China",                    region: cn }
      - { area_name: "Germany",                  region: de }
      - { area_name: "United Kingdom",           region: gb }
    # 抽出対象指標テンプレ (3 種)。id_template の {cc} に region 値が入る
    indicator_templates:
      - id_template: "ember-demand-{cc}"
        category: "Electricity demand"
        subcategory: "Demand"
        variable: "Demand"
        unit: "TWh"
        aggregation: monthly_sum
      - id_template: "ember-generation-{cc}"
        category: "Electricity generation"
        subcategory: "Total"
        variable: "Total Generation"
        unit: "TWh"
        aggregation: monthly_sum
      - id_template: "ember-co2-intensity-{cc}"
        category: "Power sector emissions"
        subcategory: "CO2 intensity"
        variable: "CO2 intensity"
        unit: "gCO2/kWh"
        aggregation: monthly_mean
    indicator_ids:
      - ember-demand-jp
      - ember-demand-us
      - ember-demand-cn
      - ember-demand-de
      - ember-demand-gb
      - ember-generation-jp
      - ember-generation-us
      - ember-generation-cn
      - ember-generation-de
      - ember-generation-gb
      - ember-co2-intensity-jp
      - ember-co2-intensity-us
      - ember-co2-intensity-cn
      - ember-co2-intensity-de
      - ember-co2-intensity-gb
    # D-011 準拠の indicator 固有メタデータ (15 系列)
    indicators:
      ember-demand-jp:        { name: "日本 月次電力需要",     domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: Japan, Electricity demand / Demand / Demand", depends_on: null }
      ember-demand-us:        { name: "米国 月次電力需要",     domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: United States of America, Electricity demand / Demand / Demand", depends_on: null }
      ember-demand-cn:        { name: "中国 月次電力需要",     domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: China, Electricity demand / Demand / Demand", depends_on: null }
      ember-demand-de:        { name: "ドイツ 月次電力需要",   domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: Germany, Electricity demand / Demand / Demand", depends_on: null }
      ember-demand-gb:        { name: "英国 月次電力需要",     domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: United Kingdom, Electricity demand / Demand / Demand", depends_on: null }
      ember-generation-jp:    { name: "日本 月次総発電量",     domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: Japan, Electricity generation / Total / Total Generation", depends_on: null }
      ember-generation-us:    { name: "米国 月次総発電量",     domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: United States of America, Electricity generation / Total / Total Generation", depends_on: null }
      ember-generation-cn:    { name: "中国 月次総発電量",     domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: China, Electricity generation / Total / Total Generation", depends_on: null }
      ember-generation-de:    { name: "ドイツ 月次総発電量",   domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: Germany, Electricity generation / Total / Total Generation", depends_on: null }
      ember-generation-gb:    { name: "英国 月次総発電量",     domain: international, unit: "TWh",      backfill_start: "1999-01-01", aggregation: monthly_sum,  notes: "Ember monthly: United Kingdom, Electricity generation / Total / Total Generation", depends_on: null }
      ember-co2-intensity-jp: { name: "日本 電力部門 CO2 排出強度",   domain: international, unit: "gCO2/kWh", backfill_start: "1999-01-01", aggregation: monthly_mean, notes: "Ember monthly: Japan, Power sector emissions / CO2 intensity / CO2 intensity", depends_on: null }
      ember-co2-intensity-us: { name: "米国 電力部門 CO2 排出強度",   domain: international, unit: "gCO2/kWh", backfill_start: "1999-01-01", aggregation: monthly_mean, notes: "Ember monthly: USA, Power sector emissions / CO2 intensity / CO2 intensity", depends_on: null }
      ember-co2-intensity-cn: { name: "中国 電力部門 CO2 排出強度",   domain: international, unit: "gCO2/kWh", backfill_start: "1999-01-01", aggregation: monthly_mean, notes: "Ember monthly: China, Power sector emissions / CO2 intensity / CO2 intensity", depends_on: null }
      ember-co2-intensity-de: { name: "ドイツ 電力部門 CO2 排出強度", domain: international, unit: "gCO2/kWh", backfill_start: "1999-01-01", aggregation: monthly_mean, notes: "Ember monthly: Germany, Power sector emissions / CO2 intensity / CO2 intensity", depends_on: null }
      ember-co2-intensity-gb: { name: "英国 電力部門 CO2 排出強度",   domain: international, unit: "gCO2/kWh", backfill_start: "1999-01-01", aggregation: monthly_mean, notes: "Ember monthly: United Kingdom, Power sector emissions / CO2 intensity / CO2 intensity", depends_on: null }
    notes: |
      - long-format CSV 1 本で全国全変数を取得。Area type='Country or economy' で国別を絞る。
      - 主要 5 ヶ国 (日/米/中/独/英) × 3 指標 (demand, total generation, CO2 intensity) = 15 系列。
      - 米国は Area 列で "United States of America"。"United States" は存在しないため注意。
      - 通常モードでも全期間 (1999-01 ~ 最新月) を 1 リクエストで取得 → write_processed が key_cols で dedup。
      - 観測は概ね月次データ確定後 2-3 ヶ月遅延で更新される (freshness_sla_days=90 マージン)。

  estat:
    name: 政府統計の総合窓口（e-Stat）API
    publisher: 総務省統計局
    publisher_url: https://www.e-stat.go.jp/
    source_url: https://www.e-stat.go.jp/
    # 認証必須（無料登録で appId 発行）。コードからは os.environ["ESTAT_APP_ID"] で読む。
    api_base: "https://api.e-stat.go.jp/rest/3.0/app/json"
    # --- D-011 メタデータ共通項目 ---
    license: estat-terms
    license_url: https://www.e-stat.go.jp/terms-of-use
    license_notice: "出典: 政府統計の総合窓口（e-Stat）。"
    license_text: |
      e-Stat 利用規約。出典明示を条件に再利用可（政府標準利用規約 2.0 互換）。
      参考: https://www.e-stat.go.jp/terms-of-use
    frequency: monthly
    tz: Asia/Tokyo
    missing_policy: "null"
    # CPI は翌月下旬・IIP は速報が翌々月末。2020 基準時系列データは半年〜年単位で再公開されるため
    # 半年マージンに設定。
    freshness_sla_days: 180
    # 2026-05-27 実 API 探索（getStatsList + getMetaInfo）で確定した統計表 ID と分類コード。
    # ハードコード推測ではなく、L-062 に従い実 API で検証してから採用。
    indicator_ids:
      - jpn-cpi-yoy
      - jpn-industrial-production
    indicators:
      jpn-cpi-yoy:
        name: "日本 消費者物価指数 総合 前年同月比"
        domain: economy
        unit: "%"
        backfill_start: "1971-01-01"
        aggregation: raw
        notes: "e-Stat 統計表 0003427113（2020 年基準消費者物価指数）から tab=3 (前年同月比) / cat01=0001 (総合) / area=00000 (全国) を抽出。総務省統計局が翌月下旬に確報を公表"
        depends_on: null
        # e-Stat API パラメータ
        stats_data_id: "0003427113"
        cd_tab: "3"
        cd_cat01: "0001"
        cd_area: "00000"
      jpn-industrial-production:
        name: "日本 鉱工業生産指数（2020=100）"
        domain: economy
        unit: "index (2020=100)"
        backfill_start: "2018-01-01"
        aggregation: raw
        notes: "e-Stat 統計表 0004015804（鉱工業生産・出荷・在庫指数 2020 年基準時系列データ 業種別原指数【月次】 付加価値額生産）から cat01=0001000 (鉱工業計、業種別の親項目) を抽出。原指数（非季節調整）。経産省 METI が速報・確報を翌々月に公表、e-Stat 時系列表は半年〜1 年単位で再公開される（直近スナップは open=2025-04-30、データ末端は 2025-02）"
        depends_on: null
        stats_data_id: "0004015804"
        cd_cat01: "0001000"
        # 2020 基準時系列データは monthly 公開ではなく年単位アーカイブ。約 18 ヶ月マージン
        freshness_sla_days: 540
    notes: |
      - getStatsData JSON で 1 系列ずつ取得（複数系列の同時取得は不可、別 cdCat01 同一表は可）。
      - 認証必須。ESTAT_APP_ID 未設定時はログのみ吐いて他系列を止めない（continue-on-error 互換）。
      - CPI 表 0003427113 は 1970-01 から（2020 年基準は遡及計算済）。IIP 0004015804 は 2018-01 から。
      - 時間軸コードは name に "YYYYMM"（6 桁数字）の月次値、"YYYY年度" の年度集計、"付加生産ウエイト" などのウエイト値が混在する。月次抽出時は name が YYYYMM 6 桁数字の値のみを採用。
      - 数値文字列の特殊値: "-" / "..." / "" / "X" 等は NaN として扱う。
      - L-062 検証 (2026-05-27): CPI 直近 2026M04=1.4%, 2026M03=1.5% / IIP 直近 2025M02=97.3, 2024M12=104.1（妥当帯）。

