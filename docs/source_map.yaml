  # ==========================================================================
  # EIA International Energy Statistics — 国際 CO2 排出量 9 系列（2026-08-14 追加）
  # ==========================================================================
  eia-intl:
    name: 米国エネルギー情報局（EIA）International Energy Statistics
    source_name: 米国エネルギー情報局（EIA）International Energy Statistics
    publisher: U.S. Energy Information Administration (EIA)
    publisher_url: https://www.eia.gov/
    source_url: https://www.eia.gov/international/data/world
    # ----- 取得経路 --------------------------------------------------------
    # REST API v2。API キー必須（無料登録、https://www.eia.gov/opendata/register.php）。
    # キーは環境変数 EIA_API_KEY からのみ読む。★ yaml にもコードにも絶対に書かない。
    api_base: https://api.eia.gov/v2/international/data/
    # ★★ facet 一覧エンドポイント（/v2/international/facet/{id}）は使ってはいけない ★★
    #   2026-08-14 実測: 一覧が返す値は石油系サブセットのみで、実データに存在する値を取りこぼす。
    #     activityId: 一覧 4 件（1,2,3,5）      ← 実データには 14 件（8=Emissions を含む）
    #     unit      : 一覧 3 件（MBBL,MT,TBPD） ← 実データには 17 件（MMTCD を含む）
    #     productId : 一覧 18 件（石油＋輸入元別のみ） ← 実データには石炭/ガス/電力/CO2 が存在
    #   ルート説明文は "petroleum, natural gas, electricity, etc." と書いているのに
    #   一覧は石油だけ、という矛盾から発覚。facet 一覧を信じて実装すると
    #   **CO2 の存在自体に気づけない**。→ facet 値は下記のとおりハードコードで明示指定する。
    activity_id: "8"          # Emissions
    unit_filter: "MMTCD"      # million metric tonnes carbon dioxide
    # ----- D-011 メタデータ共通項目 ---------------------------------------
    license: public-domain
    license_url: https://www.eia.gov/about/copyrights_reuse.php
    license_notice: "米国連邦政府著作物としてパブリックドメイン。EIA は出典表記を推奨（例: Source: U.S. Energy Information Administration）"
    license_text: |
      EIA の Copyright & Reuse ページ: EIA が作成した情報は米国政府の著作物であり、
      合衆国内において著作権保護の対象外（17 U.S.C. § 105）。許諾なく自由に複製・再配布・
      改変・商用利用が可能。出典表記は義務ではなく推奨
      （EIA requests that you cite the U.S. Energy Information Administration as the source）。
      → SPDX 相当は public-domain。既存の us-treasury / fred-macro（連邦政府データ）と同じ扱い。
    domain: international
    frequency: annual
    unit: "Mt-CO2"
    tz: UTC
    missing_policy: "null"
    aggregation: raw
    # 年次更新。2026-08-14 実測で最新 period = 2024（約 19-20 ヶ月遅れ）。
    # 同じ /international でも石油消費（activityId=2）は 2025 まで存在し、
    # CO2（activityId=8）だけがさらに 1 年遅い階層である点に注意（activity 別に鮮度が違う）。
    # 観測日の規約は**暦年の 1/1**（2024 年 → 2024-01-01）。既存の暦年年次系列
    # （nrel-atb 2021-01-01 / eu-ets 2005-01-01 / estat-trade 2016-01-01）と同じ規約。
    # GIO の年度末規約（FY2024 → 2025-03-31）とは別物。
    # ----- SLA の根拠（★ 観測日規約と SLA は必ずセットで動かすこと）---------
    # EIA は年 Y の CO2 を ~Y+2 年央に公表する（2024 年値が 2026-08 時点で最新）。
    # 観測日を暦年 1/1 に置くため、**初出の瞬間から age ≈ 950 日**になる構造。
    #   2026-08-14 実測: cutoff=2024-01-01 → age=956d
    # 最大滞留は次版（2025 年値, ~2027 年央）が出る直前:
    #   2027-06 − 2024-01-01 ≈ 1250 日
    # → SLA 1300（余裕込み）。check_staleness.py の 2× ハードゲート = 2600 日。
    # ⚠️ frequency=annual の既定値 540 を採ると初日から warning、かつ 2026-12-16 に
    #   ハードゲート（2×540=1080d）を突破して nightly CI が赤になる。
    #   540 が妥当なのは「観測日が公表日に近い」年次系列だけで、本ソースは当てはまらない。
    freshness_sla_days: 1300
    backfill_start: "1980-01-01"
    # ----- 地域コード（2026-08-14 実測で存在を確認したもののみ）------------
    # ★★ WP15 / WP17 / WP27 という重複コードが存在する ★★
    #   WP17 は name="Japan"・countryRegionTypeId="r"(Region) で、値は JPN（type="c"/Country）と
    #   完全一致（2024 = 941.0 で同値）。WP15=China / WP27=United States も同様。
    #   countryRegionId を明示ピン留めせず全行を走査して集計すると**日本が二重計上**される。
    #   → fetch_eia_intl.py は要求した countryRegionId と完全一致する行以外を検証ゲートで弾く。
    # ----- productId の正式定義（実測）------------------------------------
    #   4008 = CO2 emissions（総計）
    #   4002 = Coal and coke（石炭・コークス）
    #   4006 = Petroleum and other liquids（石油・その他液体）
    #   4010 = Consumed natural gas（消費天然ガス）
    #   4 地域すべてで 4008 == 4002 + 4006 + 4010 が差分 0.00 で成立することを実測確認済み。
    #   （GIO の「5 部門単純合算は合計にならない」問題とは異なり、単純加算が成立する）
    #   なお productId 1 / 5 / 3002 も MMTCD を持つ旧コード系のため、
    #   unit=MMTCD だけで一括取得すると同様に二重計上になる。productId も必ず明示指定する。
    # ----- 派生 12 系列の分母（★ 分母自体は系列化しない = materialize しない）------
    #   2026-08-20 実測（EIA API v2 /international）。facet 一覧は使わず実データ行から導出。
    #   ★★ activityId だけで絞ってはいけない ★★
    #     activityId=33（Population）には productId=4702（Population, unit=THP）のほかに
    #     productId=47（Energy intensity, unit=MBTUPP = million Btu per person）が**同居**する。
    #     activityId=34（GDP）も同様に productId=4701（GDP, unit=BDOLPPP）と
    #     productId=47（Energy intensity, unit=TBTUUSDPP）が同居する。
    #     activityId だけで取得すると「エネルギー原単位」を人口・GDP として取り込む。
    #     → productId と unit を必ず明示指定し、取得後も完全一致を検証する（ゲート a / c）。
    #   ★★ WP15 / WP17 / WP27 の重複コードは人口・GDP にも存在する ★★
    #     2026-08-20 実測: WP17（name="Japan", type="r"）の 2024 年値は
    #     人口 123,753 千人 / GDP 5,311.332（JPN と完全同値）。CO2 と同じ規律で弾く（ゲート b）。
    #   ★ GDP の定義（実測で確定、2026-08-20）:
    #     - PPP か市場為替か → **PPP**（unit 名 "billion dollars at purchasing power parities"）
    #     - 実質か名目か     → **実質**。USA の前年比が実質 GDP 成長率と一致する
    #                          （2020 −2.08% / 2021 +6.15% / 2022 +2.52% / 2023 +2.93% / 2024 +2.79%）。
    #                          名目なら 2021 は +10% 台になるはずで、そうなっていない。
    #     - 基準年           → **2015**。米国は PPP の numeraire（換算 = 1）なので系列 = 米実質 GDP。
    #                          EIA の USA 2015 = 18,295.000 は BEA 米名目 GDP 2015 = 18,295.019
    #                          十億ドルと一致する（基準年では実質 = 名目）。他年は一致しない
    #                          （2010 = 16,339.1 / 2012 = 16,974.6 / 2017 = 19,085.7 / 2019 = 20,159.6）。
    #     - 出所             → 履歴値は Oxford Economics（EIA IEO の記述 "real 2015 purchasing
    #                          power parity (PPP) adjusted U.S. dollars"）。
    #     ⚠️ 基準年は unit 文字列（BDOLPPP）に含まれない。EIA が基準年をサイレント変更しても
    #        unit は変わらないため、下記 gdp_base_year_canary で毎回検証する（ゲート f）。
    #   ★ 分母が正しいことの独立した裏付け（2026-08-20 実測）:
    #     EIA 自身のエネルギー原単位を 2 経路で復元すると完全一致する。
    #       126.578 MBtu/人 × 123,753 千人 = 15.66442 quad
    #       2.94924 kBtu/$ × 5,311.332 十億$ = 15.66442 quad   （差 0.0000%、2020/2023/2024 で確認）
    #     → EIA 自身が productId 4702 / 4701 を分母に使っている。同じ分母を使うのが正しい。
    derived:
      denominators:
        population:
          activity_id: "33"       # Population
          product_id: "4702"      # Population（★ 47 = Energy intensity と同居）
          unit: "THP"             # people in thousands（千人）
        gdp:
          activity_id: "34"       # GDP
          product_id: "4701"      # Gross domestic product（★ 47 = Energy intensity と同居）
          unit: "BDOLPPP"         # billion dollars at purchasing power parities（十億2015年PPPドル）
      # ゲート f: 基準年カナリア。米国は PPP numeraire なので基準年では実質 = 名目。
      gdp_base_year_canary:
        country_region_id: "USA"
        base_year: "2015"
        reference_nominal_bdol: 18295.019   # BEA 米名目 GDP 2015（十億ドル）
        # 許容 1%: BEA の年次改定（10 年前の名目水準では通常 ±0.3% 以内）は通し、
        # 基準年の変更（2015→2017 で +2.9%、2015→2020 で +9.5%）は確実に弾く幅。
        tolerance_pct: 1.0
      # ゲート e: 派生値のレンジ。1980-2024 の実測レンジは
      #   per_capita 1.59〜20.97 t/人、per_gdp 124.2〜2353.9 t/百万$。
      range_gates:
        per_capita: [0.5, 30.0]
        per_gdp: [50.0, 3000.0]
      # ゲート c: 行数下限（実測 45 点 = 1980-2024。分母が 1980 始まりなので CO2 が
      # 1949 始まりの USA / WORL / OECD でも 1980 が律速）。
      min_rows: 40
    notes: |
      EIA International Energy Statistics から国際 CO2 排出量 9 系列。international ドメインの
      「経済全体・国際横断・共通方法論の CO2」を新規に埋める。

      既存系列との重複なし（2026-08-14 catalog 581 系列で確認）:
        - jp-ghg-*（18 系列, esg）= GIO・**日本のみ**・UNFCCC インベントリ・**年度**
        - ember-co2-intensity-*（5 系列, international）= **電力部門のみ**・gCO2/kWh・月次
      いずれも「複数国の経済全体 CO2 を共通方法論で比較する」用途は満たしておらず、本 9 系列が初。

      ★ 定義差の警告（サイト表示時に必ず出すこと）:
        EIA 日本 2024（暦年）= 941.0 Mt-CO2 に対し、GIO エネルギー起源 CO2 FY2024 = 906.6、
        GIO 全 CO2 FY2024 = 971.5、GIO 全 GHG FY2024 = 1,046.4 Mt-CO2e。
        EIA 値は GIO のエネルギー起源と全 CO2 の**中間**に落ちる（エネルギー起源比 +3.8%）。
        要因: (a) 暦年 vs 年度 (b) EIA 独自のエネルギー収支×排出係数 vs UNFCCC インベントリ方法論
        (c) バンカー燃料の扱い。→ jp-ghg-* と同一チャートに重ねてはいけない。

      系列の構成:
        地域別合計 6 系列（WORL / JPN / CHN / USA / EU27 / OECD × productId 4008）
        日本の燃料別内訳 3 系列（JPN × 4002 石炭 / 4006 石油等 / 4010 天然ガス）
          → 他ソースにない差別化要素。加算整合が検証済みなのでスタック表示に耐える。

      実測 period 範囲（2026-08-14）:
        JPN / CHN / EU27 = 1980-2024（45 点）、USA / WORL / OECD = 1949-2024（76 点）

      ---- 派生 12 系列（2026-08-20 追加、catalog 590 → 602）----
      一人当たり CO2 6 系列 + GDP 当たり CO2 6 系列。分子は上記 eia-co2-*（暦年・エネルギー起源）、
      分母は EIA が同じ /international に持つ人口（productId 4702）と実質 GDP（productId 4701）。
      **分母自体は系列化しない**（生の人口・GDP は materialize しない）。理由:
        - 生の人口は既存の e-Stat 人口推計（都道府県別・各年 10/1 基準）と競合し、
          「日本の人口が 2 本ある」問題を生む。EIA 2024 = 123,753 千人 に対し
          e-Stat 47 都道府県合計 2024-10-01 = 123,803 千人（差 50 千人 = 0.04%）。
        - 2015 年 PPP ドル建て実質 GDP は円建て国内 GDP と並べられず、単体では読まれない。
      EIA 側に「計算済みの一人当たり CO2 / 炭素集約度」は**存在しない**（2026-08-20 実測）:
        - 全 267 country/region × activityId=8（2023 年、1,841 行）の unit は MMTCD のみ、
          product は 7 種（1/5/3002/4002/4006/4008/4010）のみ。
        - activityId 10,11,13-22,24-32,35-50 を一括 probe → total = 0。
          実在する activity は 1-9, 12, 23, 33, 34 の 13 種のみ。
        → 自前計算しか道がない。ただし ③ の通り EIA 自身の原単位算出と同一の分母を使う。
      鮮度: 分母（人口・GDP）は最新 2025 で CO2（2024）より 1 年進んでいる。派生は分子で律速
      されるため最新 = 2024。ゲート d で「CO2 に無い period は出力しない」ことを強制する。
      freshness_sla_days は CO2 と同一（1300）でよい。
    indicator_ids:
      - eia-co2-world
      - eia-co2-jp
      - eia-co2-cn
      - eia-co2-us
      - eia-co2-eu27
      - eia-co2-oecd
      - eia-co2-jp-coal
      - eia-co2-jp-oil
      - eia-co2-jp-gas
      # --- 派生 12 系列（一人当たり 6 / GDP 当たり 6）---
      - eia-co2-per-capita-world
      - eia-co2-per-capita-jp
      - eia-co2-per-capita-cn
      - eia-co2-per-capita-us
      - eia-co2-per-capita-eu27
      - eia-co2-per-capita-oecd
      - eia-co2-per-gdp-world
      - eia-co2-per-gdp-jp
      - eia-co2-per-gdp-cn
      - eia-co2-per-gdp-us
      - eia-co2-per-gdp-eu27
      - eia-co2-per-gdp-oecd
    indicators:
      # --- 地域別合計 6 系列（productId 4008 = CO2 emissions）---
      eia-co2-world:
        name: 世界のCO2排出量（EIA・エネルギー起源）
        domain: international
        unit: "Mt-CO2"
        region: world
        country_region_id: WORL
        product_id: "4008"
        backfill_start: "1949-01-01"
        aggregation: raw
        notes: "productId 4008 = CO2 emissions（総計）。EIA独自のエネルギー収支×排出係数による暦年値（エネルギー起源CO2のみ）。UNFCCCインベントリ（GIO・年度）とは方法論・期間定義が異なり数値は一致しない（日本2024年: EIA 941.0 / GIO エネルギー起源 906.6 Mt-CO2）。CH4・N2O・フロン類・LULUCFを含まない。countryRegionId=WORL（type=r/Region）。"
        depends_on: null
      eia-co2-jp:
        name: 日本のCO2排出量（EIA・エネルギー起源）
        domain: international
        unit: "Mt-CO2"
        region: jp
        country_region_id: JPN
        product_id: "4008"
