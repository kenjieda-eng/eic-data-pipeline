      ember-share-bioenergy-cn:   { name: "中国 発電量シェア バイオ (%)",   domain: international, unit: "%", backfill_start: "2015-01-01", aggregation: monthly_mean, notes: "Ember monthly: China, Electricity generation / Fuel / Bioenergy (%)", depends_on: null, freshness_sla_days: 120 }
      ember-share-bioenergy-de:   { name: "ドイツ 発電量シェア バイオ (%)", domain: international, unit: "%", backfill_start: "2015-01-01", aggregation: monthly_mean, notes: "Ember monthly: Germany, Electricity generation / Fuel / Bioenergy (%)", depends_on: null }
